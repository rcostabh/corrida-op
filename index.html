<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrida de Prêmios OP</title>
<link rel="icon" type="image/png" href="app/icon-192.png">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea;
  --accent:#d95300; --accent-2:#ff8a1f; --accent-soft:#fff1e5; --on-accent:#ffffff;
  --red:#d70015; --ok:#248a3d; --warn:#b25000;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
    --accent:#ff9f0a; --accent-2:#ff6a00; --accent-soft:#3a2308; --on-accent:#1a0e00;
    --red:#ff6961; --ok:#30d158; --warn:#ffb340; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.band{display:none}
h1{font:700 clamp(26px,5vw,34px)/1.1 var(--font-display);letter-spacing:-.03em;margin:2px 0 0}
h2{font:650 19px/1.2 var(--font-display);letter-spacing:-.02em;margin:0 0 4px}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sub,.hint{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.card{background:var(--surface);border-radius:22px;padding:22px;min-width:0;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.who{color:var(--muted);font-size:13.5px;font-weight:500}
.nav{display:flex;gap:2px;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--line);padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;width:fit-content;max-width:100%}
.nav button{flex:none;border:0;background:transparent;color:var(--muted);font:600 14px var(--font-body);padding:8px 18px;border-radius:999px;min-height:40px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.nav button:hover:not([disabled]):not([aria-current="page"]){color:var(--ink)}
.nav button[aria-current="page"]{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--on-accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.nav button[disabled]{opacity:.45;cursor:not-allowed}
.two{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.two{grid-template-columns:minmax(0,380px) minmax(0,1fr)}}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--muted);min-width:0}
input,select{font:inherit;font-weight:500;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:10px 14px;min-height:46px;width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
input:hover,select:hover{border-color:var(--line)}
input:focus,select:focus{outline:none;background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-radius:12px;min-height:46px;cursor:pointer;font-weight:500;color:var(--ink)}
.err{color:var(--red);font-weight:500;font-size:13px;min-height:1em}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 15px var(--font-body);border:0;border-radius:999px;padding:10px 22px;min-height:46px;cursor:pointer;color:var(--on-accent);
  background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s,filter .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;font-weight:600;font-size:14px}
.btn.ghost:hover{background:var(--line);filter:none}
.btn.sm{font-size:13px;min-height:36px;padding:6px 16px}
.btn[disabled]{opacity:.6;cursor:wait}
.items{list-style:none;margin:0;padding:0;display:grid;gap:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:14px 4px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.empty{padding:22px;background:var(--surface-2);border-radius:14px;color:var(--muted);text-align:center;list-style:none}
.sigla{font:700 12px var(--font-display);background:var(--accent-soft);color:var(--accent);padding:4px 9px;border-radius:8px;letter-spacing:.04em}
.badge{font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.ouro{background:linear-gradient(180deg,#ffd35c,#ffb400);color:#3a2a00}
.badge.prata{background:linear-gradient(180deg,#e4e6ea,#c3c7ce);color:#1f2933}
.chip{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.off{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 0%,transparent),inset 0 0 0 1px rgba(0,0,0,.12)}
.login{max-width:420px;margin:9vh auto 0;display:grid;gap:22px}
.login .card{display:grid;gap:16px;padding:28px}
.link{background:none;border:0;color:var(--accent);font:600 13.5px var(--font-body);cursor:pointer;padding:6px 0;text-align:center}
.link:hover{text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:min(92vw,460px);
  background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--bg);padding:14px 18px;border-radius:16px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.btn,.nav button,input,select{transition:none}.btn:active{transform:none}}
.sec{border-top:1px solid var(--line);margin-top:22px;padding-top:20px;display:grid;gap:12px}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.picks{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.rrow{display:grid;gap:8px 10px;grid-template-columns:minmax(170px,1.3fr) minmax(150px,1fr) 100px 100px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rrow.off .r-modo,.rrow.off .r-passo,.rrow.off .r-pts{opacity:.45}
@media (max-width:700px){.rrow{grid-template-columns:1fr 1fr}.rrow .chk,.rrow .r-modo{grid-column:1/-1}}
.prow{display:grid;gap:8px;grid-template-columns:100px minmax(0,1fr) 150px auto;align-items:center}
@media (max-width:700px){.prow{grid-template-columns:1fr 1fr}.prow .p-premio{grid-column:1/-1}}
.grp{display:grid;gap:8px}
.grp h3{margin:0;font:650 14px var(--font-display);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--font-body);padding:7px 16px;border-radius:999px;min-height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mapa{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#7fd0ff 0%,#b9ecff 22%,#c9f2b8 55%,#8fdc74 100%);box-shadow:var(--shadow)}
.mapa .nuvem{position:absolute;width:90px;height:30px;border-radius:30px;background:#fff;opacity:.85;filter:blur(.4px)}
.mapa .nuvem::before,.mapa .nuvem::after{content:"";position:absolute;background:#fff;border-radius:50%}
.mapa .nuvem::before{width:38px;height:38px;left:14px;top:-18px}.mapa .nuvem::after{width:30px;height:30px;left:46px;top:-12px}
.mapa svg.estrada{position:absolute;left:0;top:0;pointer-events:none}
.t{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 17px var(--font-display);text-shadow:0 1px 2px rgba(0,0,0,.35);
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.85) 0 11%,rgba(255,255,255,0) 12%),radial-gradient(circle at 50% 38%,var(--c),color-mix(in srgb,var(--c) 68%,#000));
  box-shadow:0 5px 0 rgba(0,0,0,.22),inset 0 -5px 8px rgba(0,0,0,.18),inset 0 3px 4px rgba(255,255,255,.35)}
.t.ini{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.85) 0 11%,rgba(255,255,255,0) 12%),radial-gradient(circle at 50% 38%,#4bdc7a,#1f9d4c);font-size:13px}
.t.fim{width:58px;height:58px;margin:-29px 0 0 -29px;background:repeating-conic-gradient(#fff 0 25%,#1b1b1f 0 50%) 0 0/16px 16px;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.t.bau{width:60px;height:60px;margin:-30px 0 0 -30px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 4px rgba(255,255,255,.75);transition:transform .25s}
.t.bau.ouro{--c:#ffc400}.t.bau.prata{--c:#b8c2cc}
.t.bau svg{width:36px;height:36px;margin-top:-2px}
.t.bau .tampa{transform-box:fill-box;transform-origin:0% 100%;transition:transform .35s}
.t.bau.aberto .tampa{transform:rotate(-62deg)}
.t.bau.novo{animation:balanca .5s}
@keyframes balanca{20%{transform:rotate(-10deg) scale(1.12)}50%{transform:rotate(8deg) scale(1.16)}80%{transform:rotate(-4deg) scale(1.08)}}
.rot{position:absolute;transform:translate(-50%,0);font:700 10px var(--font-body);background:#fff;color:#3a2a00;border-radius:999px;padding:1px 8px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tk{position:absolute;left:0;top:0;z-index:5;will-change:transform;pointer-events:none}
.tk .disc{position:absolute;left:-19px;top:-56px;width:38px;height:38px;border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font:800 13px var(--font-display);border:3px solid var(--rc,#fff);background:var(--rc,#888);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tk .sombra{position:absolute;left:-18px;top:-6px;width:36px;height:12px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(1px)}
.tk.pulo .disc{animation:esmaga .22s}
@keyframes esmaga{0%{transform:scale(1.18,.82)}60%{transform:scale(.94,1.08)}100%{transform:scale(1,1)}}
.po{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9;pointer-events:none;z-index:4}
@media (prefers-reduced-motion:reduce){.t.bau.novo,.tk.pulo .disc{animation:none}}
.rk{display:grid;grid-template-columns:34px 14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk .pos{font:700 18px var(--font-display);text-align:center}
.rk .pts{font:700 18px var(--font-display);text-align:right}
.rk .meta{margin:0}
#area:fullscreen{background:var(--bg);padding:24px;overflow:auto;align-content:start}
.g3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
table.tab{width:100%;border-collapse:collapse;font-size:14px}
table.tab th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tab td{padding:10px;border-bottom:1px solid var(--line)}
table.tab .n{text-align:right;white-space:nowrap}
table.tab tr.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--surface-2)}
.barra{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--surface-2);vertical-align:middle;overflow:hidden;margin-right:6px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:4px}
.pd-card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);min-width:0;border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.pd-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.pd-bar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pd-mes{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:12px;padding:2px}
.pd-mes button{border:0;background:transparent;color:var(--ink);font:700 16px var(--font-body);width:34px;height:34px;border-radius:10px;cursor:pointer}
.pd-mes button:disabled{opacity:.35;cursor:default}
.pd-mes b{min-width:130px;text-align:center;font-size:14px;display:inline-block}.pd-mes b::first-letter,.pd-bar .sub::first-letter{text-transform:uppercase}.pd-bar select{width:auto;min-width:200px}
.pd-placar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pd-pc{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:6px;min-width:0}
.pd-pc .k{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.pd-pc .v{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.pd-pc .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.pd-pc .b{position:relative;height:8px;border-radius:4px;background:var(--surface-2)}
.pd-pc .b i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.pd-pc .b u{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:1px}
.pd-pc .f{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pl{display:inline-block;font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pl.no{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pl.nd{background:var(--surface-2);color:var(--muted)}
.pd-scroll{overflow:auto;max-width:100%;border-radius:20px;max-height:76vh}
table.pd{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;table-layout:fixed}
table.pd th,table.pd td{padding:0;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.pd thead th{position:sticky;top:0;z-index:3;background:var(--surface);font-size:12px;font-weight:700;height:46px}
table.pd thead th small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
table.pd .dom{background:var(--surface-2)}
table.pd td.c{height:40px;font-size:13px;font-weight:600}
table.pd td.c.z{color:var(--muted);opacity:.55;font-weight:500}
table.pd td.c.hj,table.pd thead th.hj{box-shadow:inset 0 -2px 0 var(--accent)}
table.pd td.c.dv{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);cursor:help}
table.pd .nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:0 12px;font-weight:600;border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis}
table.pd thead th.nm{z-index:5}
table.pd .rt{position:sticky;background:var(--surface);z-index:2;font-weight:700}
table.pd thead th.rt{z-index:5}
table.pd .r1{right:186px;border-left:1px solid var(--line)} table.pd .r2{right:132px} table.pd .r3{right:62px} table.pd .r4{right:0;color:var(--muted);font-weight:600}
table.pd tr.gr td{background:var(--surface-2)!important;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;height:32px}
table.pd tr.in td.nm{color:var(--muted)}
table.pd tr.tot td{font-weight:700}
.pd-tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:6px;background:var(--surface-2);color:var(--muted)}
.pd-tag.a{background:var(--accent-soft);color:var(--accent)}
.pd-leg{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:12.5px;padding:12px 16px;align-items:center}
.pd-div{padding:12px 16px}
.mp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.mp-grid{grid-template-columns:minmax(0,1fr)}}
.mp-vars{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.mp-vars button,.mp-dias button{border:0;background:var(--surface-2);color:var(--ink);font:600 12px var(--font-body);padding:5px 10px;border-radius:999px;cursor:pointer;min-height:30px}
.mp-dias{display:flex;flex-wrap:wrap;gap:6px}
.mp-dias button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.mp-opts{display:flex;flex-wrap:wrap;gap:4px 14px;max-height:160px;overflow:auto;padding:2px}
.mp-opts .chk{min-height:32px}
.mp-prev{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin-top:10px}
.mp-prev b{display:block}
.mp-item{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.mp-item:first-child{border-top:0}
.mp-item .txt{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.ag-top{display:grid;grid-template-rows:1fr;transition:grid-template-rows .34s cubic-bezier(.3,.7,.2,1),opacity .28s,margin .34s}
.ag-wrap{display:grid;gap:0;min-width:0}
.ag-top-in{overflow:hidden;min-height:0}
.ag-top-pad{display:grid;gap:14px;padding-bottom:20px}
.ag-top.fechado{grid-template-rows:0fr;opacity:0;pointer-events:none}
.ag-resumo{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;text-align:left;border:0;background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);font:500 12.5px var(--font-body);cursor:pointer;padding:0 16px;max-height:0;opacity:0;overflow:hidden;margin:0;transition:max-height .34s cubic-bezier(.3,.7,.2,1),opacity .28s,padding .34s,margin .34s}
.ag-resumo.on{max-height:90px;opacity:1;padding:10px 16px;margin-bottom:20px}
.ag-resumo span{color:var(--muted)}.ag-resumo b{font-weight:700}.ag-resumo em{margin-left:auto;font-style:normal;font-weight:700;color:var(--accent)}
.ag-card{padding:14px 16px}
.ag-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.ag-nav{display:flex;align-items:center;gap:8px;flex:1;min-width:0;justify-content:center}
.ag-per{min-width:170px;text-align:center;font:700 15px var(--font-body);color:var(--ink)}
.ag-tools{display:flex;gap:8px;margin-left:auto}
.ag-ib{border:0;background:var(--surface-2);color:var(--ink);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font:600 20px var(--font-body);transition:background .15s,transform .15s}

.ds-k:not(.destaque) .f{color:var(--muted);opacity:1}
.ds-grafico{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:8px}
.ds-dia{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.ds-dia .cols{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:1px}
.ds-dia i{display:block;flex:1;max-width:14px;border-radius:4px 4px 0 0;min-height:0}
.ds-dia i.vi{background:color-mix(in srgb,var(--accent) 32%,var(--surface-2))}
.ds-dia i.ve{background:var(--accent)}
.ds-dia span{font-size:10px;color:var(--muted);height:12px;line-height:12px;font-variant-numeric:tabular-nums}
.ds-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:8px}
.ds-leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ds-sec{display:grid;gap:14px;grid-column:1/-1;min-width:0}

.ds-mapa-card{padding:18px 20px}
.ds-mapa{position:relative;border-radius:16px;overflow:hidden;background:color-mix(in srgb,var(--accent) 5%,var(--surface-2))}
#ds-svg{display:block;width:100%;height:min(62vh,520px);min-height:340px;touch-action:pan-y;cursor:crosshair;user-select:none;-webkit-user-select:none}
#ds-svg .reg{fill:var(--surface);stroke:var(--line);stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}
#ds-svg .reg.tem{fill:color-mix(in srgb,var(--accent) 12%,var(--surface))}
#ds-svg .reg.tem:hover{fill:color-mix(in srgb,var(--accent) 26%,var(--surface))}
#ds-svg .reg.sel{fill:color-mix(in srgb,var(--accent) 30%,var(--surface));stroke:var(--accent);stroke-width:2}
#ds-svg .bd{pointer-events:none;transition:opacity .3s}
#ds-svg.foco .bd{opacity:0}
#ds-svg text{font-family:var(--font-body);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;fill:var(--ink)}
#ds-svg .bd .t1{font-size:11px;font-weight:700;text-anchor:middle}
#ds-svg .bd .t2{font-size:11px;font-weight:600;text-anchor:middle;fill:var(--muted)}
#ds-svg .mk{cursor:pointer;transition:opacity .25s}
#ds-svg .mk circle{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
#ds-svg .mk .lb{opacity:0;transition:opacity .25s;pointer-events:none}
#ds-svg.foco .mk .lb{opacity:1}
#ds-svg .mk .lb rect{fill:var(--surface);stroke:var(--line)}
#ds-svg .mk .lb text{font-size:11.5px;font-weight:700;stroke:none}
#ds-svg .mk:hover .lb{opacity:1}
#ds-svg .mk.off{opacity:.18}
#ds-svg .selr{fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;pointer-events:none}
.ds-sem{color:var(--muted);font-size:12.5px;margin-top:8px}
.ds-sem:empty{display:none}

.ds-mapa-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:stretch}
@media (max-width:1000px){.ds-mapa-grid{grid-template-columns:minmax(0,1fr)}}
.ds-lado{display:flex;flex-direction:column;gap:12px;min-width:0}
.ds-lado h3{margin:0;font:650 13px var(--font-body);color:var(--muted);letter-spacing:.02em}
.ds-tot{background:linear-gradient(160deg,var(--accent-2),var(--accent));color:var(--on-accent);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.ds-tot .eyebrow{color:inherit;opacity:.8}
.ds-tot .ds-tt{font:700 22px/1.15 var(--font-display);letter-spacing:-.02em;color:inherit;margin:0;overflow-wrap:anywhere}
.ds-tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ds-tg span,.ds-pc span{display:block;font-size:12px;font-weight:600;opacity:.8}
.ds-tg b{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.ds-pc{background:color-mix(in srgb,var(--on-accent) 18%,transparent);border-radius:12px;padding:10px 12px}
.ds-pc b{font-size:32px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.ds-tot small{opacity:.8;font-size:12px}
.ds-li{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px;max-height:300px;overflow-y:auto}
.ds-li button{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:500 13px var(--font-body);padding:8px 8px;border-radius:10px;cursor:pointer}
.ds-li button:hover{background:var(--surface-2)}
.ds-li .n{min-width:0;display:grid}
.ds-li .n b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-li .n small{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-li .v{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.ds-li .p{font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.ds-ext{margin-top:12px;border-radius:14px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.ds-ext iframe{display:block;width:100%;height:calc(100vh - 230px);min-height:520px;border:0}
</style>
</head>
<body>
<div class="wrap">
  
  <!-- carregando -->
  <div id="v-load" class="login"><h1>Corrida de Prêmios OP</h1><p class="sub">Carregando...</p></div>

  <!-- entrar -->
  <div id="v-login" class="login" hidden>
    <div style="text-align:center"><img src="mascote.png" alt="Mascote da Orthopride" width="459" height="671" style="height:230px;width:auto;filter:drop-shadow(0 14px 16px rgba(217,83,0,.3))"><div><span class="eyebrow">Painel do gestor</span><h1>Corrida de Prêmios OP</h1></div></div>
    <form class="card" id="f-login" novalidate>
      <label class="field" for="l-email">E-mail<input id="l-email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="field" for="l-senha">Senha<input id="l-senha" type="password" autocomplete="current-password"></label>
      <div class="err" id="l-err" role="alert"></div>
      <button class="btn" type="submit" id="l-btn">Entrar</button>
      <button class="link" type="button" id="l-esqueci">Esqueci minha senha</button>
      <span class="ver" id="ver-l"></span>
    </form>
  </div>

  <!-- confirmar o link do e-mail (evita que o programa de e-mail gaste o link antes da pessoa) -->
  <div id="v-confirmar" class="login" hidden>
    <div><span class="eyebrow">Quase lá</span><h1 id="c-titulo">Vamos criar sua senha</h1></div>
    <div class="card">
      <p class="sub" style="margin:0">Toque no botão para continuar.</p>
      <div class="err" id="c-err" role="alert"></div>
      <button class="btn" type="button" id="c-ok">Continuar</button>
      <button class="link" type="button" id="c-voltar" hidden>Ir para a tela de entrada</button>
    </div>
  </div>

  <!-- definir senha (convite ou recuperação) -->
  <div id="v-senha" class="login" hidden>
    <div><span class="eyebrow">Quase lá</span><h1>Crie sua senha</h1></div>
    <form class="card" id="f-senha" novalidate>
      <label class="field" for="s-nova">Nova senha<input id="s-nova" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label>
      <label class="field" for="s-rep">Repita a senha<input id="s-rep" type="password" autocomplete="new-password"></label>
      <div class="err" id="s-err" role="alert"></div>
      <button class="btn" type="submit">Salvar senha</button>
    </form>
  </div>

  <!-- painel -->
  <div id="v-app" hidden>
    <aside class="side" id="side" aria-label="Menu principal">
      <div class="marca"><img src="app/icon-192.png" alt="" width="40" height="40"><div class="tx"><b>Corrida OP</b><small id="eyebrow">Painel do gestor</small></div></div>
      <span class="ver" id="ver" title=""></span>
      <button type="button" id="side-toggle" aria-expanded="false" aria-controls="nav" title="Abrir ou fechar o menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span class="tx">Recolher menu</span></button>
      <div class="sep"></div>
      <nav id="nav" aria-label="Seções" style="display:flex;flex-direction:column;gap:4px">
        <button type="button" data-r="inicio" title="Início"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span class="tx">Início</span></button>
        <button type="button" data-g="camp" id="g-camp-btn" aria-expanded="false" aria-controls="g-camp" title="Campanhas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg><span class="tx">Campanhas</span><svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        <div class="grupo-lista" id="g-camp">
          <button type="button" data-r="corrida">Corrida</button><button type="button" data-r="lancamentos">Lançamentos</button>
        </div>
        <button type="button" data-g="vend" id="g-vend-btn" aria-expanded="false" aria-controls="g-vend" title="Vendas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span class="tx">Vendas</span><svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        <div class="grupo-lista" id="g-vend">
          <button type="button" data-r="diario">Lançamento diário</button><button type="button" data-r="planilha">Planilha do mês</button><button type="button" data-r="ranking">Ranking de vendas</button>
        </div>
        <button type="button" data-r="relatorios" title="Relatórios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="tx">Relatórios</span></button>
        <button type="button" data-r="mensagens" title="Mensagens push"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="tx">Mensagens push</span></button>
        <button type="button" data-r="agenda" title="Agenda das teles"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="tx">Agenda das teles</span></button>
        <button type="button" data-r="externo" title="Relatório NUV"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M7 12l3-3 2.5 2 4-4"/></svg><span class="tx">Relatório NUV</span></button>
        <div class="sep"></div>
        <button type="button" data-g="cad" id="g-cad-btn" aria-expanded="false" aria-controls="g-cad" title="Cadastros"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2V17.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span class="tx">Cadastros</span><svg class="seta" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        <div class="grupo-lista" id="g-cad">
          <button type="button" data-r="clinicas">Clínicas</button><button type="button" data-r="tipos">Tipos de lançamento</button><button type="button" data-r="premios">Prêmios</button><button type="button" data-r="pessoas">Pessoas</button><button type="button" data-r="campanhas">Campanhas</button>
        </div>
      </nav>
      <div class="rodape"><button type="button" id="sair" title="Sair"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5.5a1.5 1.5 0 0 0-1.5 1.5v13A1.5 1.5 0 0 0 5.5 20H10"/><path d="M15 8l4 4-4 4M19 12H9"/></svg><span class="tx">Sair</span></button></div>
    </aside>
    <main class="principal">
      <header class="topo">
        <h1 id="titulo-tela">Início</h1>
        <div class="line"><div class="seg" role="group" aria-label="Entrar como" id="modo" hidden><button type="button" data-m="gestor" aria-pressed="true">Gestão</button><button type="button" data-m="gerente" aria-pressed="false">Gerência</button></div><span class="who" id="quem"></span></div>
      </header>
      <section class="two" id="area"></section>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  'use strict';
  /* Chaves públicas do projeto. A chave "publishable" foi feita para ficar no navegador:
     quem protege os dados são as regras de acesso do banco. Nunca coloque a chave secreta aqui. */
  const SUPABASE_URL = 'https://fjroscujmyrjxatakcpo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ZuqKt7UHtpkiyQr95Ji67w_OQXS1nMV';

  const $ = (s, r) => (r||document).querySelector(s);
  const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const brl = n => Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  let toastTimer;
  function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4500); }

  /* Se o convite ou a recuperação de senha chegou pelo link do e-mail, o endereço traz "type=invite" ou "type=recovery". */
  /* Endereço sem o "ponto final" no nome do site (corrida...com.br.): com o ponto, o navegador mostra "conexão não privada". */
  const enderecoLimpo = () => (location.origin + location.pathname).replace(/^(https?:\/\/[^\/:]+?)\.(?=[\/:]|$)/, '$1');
  if (/\.$/.test(location.hostname)){ location.replace(location.href.replace(/^(https?:\/\/[^\/:]+?)\.(?=[\/:]|$)/, '$1')); }
  const veioDeLink = /type=(invite|recovery)/.test(location.hash);
  let definindoSenha = veioDeLink;
  /* Link novo do e-mail: traz "token_hash" e "type" no endereço e só vale depois que a pessoa toca no botão. */
  const paramsLink = new URLSearchParams(location.search);
  const linkToken = paramsLink.get('token_hash'), linkTipo = paramsLink.get('type');
  let linkPendente = !!linkToken && (linkTipo === 'invite' || linkTipo === 'recovery');
  const linkVencido = /error_code=otp_expired|error=access_denied/.test(location.hash);

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  /* controle de versão: a mais nova primeiro; o número aparece abaixo do logo */
  const VERSOES = [
    ['1.9.0', '2026-11-11', 'Pessoas: mais de um cargo por pessoa (ex.: Divulgador e Promotor, com uma linha para cada na planilha) e novo cargo Indicação. Gerência e Gestão veem só as linhas de promotor nos totais de vendas.'],
    ['1.8.0', '2026-11-11', 'Agenda: status Atendido, totais por clínica (agendamentos, confirmados, atendidos e fechamentos) no dia, na semana e no mês. Nomes das funções: Vendas, Gerência e Gestão.'],
    ['1.7.0', '2026-11-11', 'Agenda das teles: grid menor; status Agendado, Confirmado, Fechado e Não fechou (com motivo guardado); filtro por status e totais por clínica, tele e motivo.'],
    ['1.6.1', '2026-11-11', 'Grade da agenda segue o horário de atendimento: seg–sex 09:00–18:00 e sábado 08:00–13:00.'],
    ['1.6.0', '2026-11-11', 'Agendamento com status agendado e confirmado (marcado pela tele no app). Mês atual seleciona o mês inteiro. Visitas e vendas da agenda contam só as teles.'],
    ['1.5.1', '2026-11-11', 'Convites e links de nova senha nunca saem com ponto no fim do endereço (causa do aviso "conexão não privada").'],
    ['1.5.0', '2026-11-11', 'Agenda das teles: visões de dia, semana e mês com transições animadas; recolher filtros e totais; tela cheia que esconde o menu lateral.'],
    ['1.4.2', '2026-11-11', 'Link do e-mail (convite e nova senha) passa a ter um botão de confirmação, para o programa de e-mail não gastar o link antes da pessoa. Mensagem clara quando o link vence.'],
    ['1.4.1', '2026-11-11', 'Agenda das teles: cartões de filtros e totais menores, para a grade aparecer melhor.'],
    ['1.4.0', '2026-11-11', 'Agenda das teles com grade por clínica e horário, totalizadores Agendamento → Visita → Venda por período, tele e clínica, e histórico de alterações.'],
    ['1.3.0', '2026-11-11', 'Nova tela Agenda das teles: todos os agendamentos lançados no app, por dia, telemarketing e clínica, com o print da conversa.'],
    ['1.2.0', '2026-11-11', 'Gerente: sem acesso a Campanhas; passa a ver e editar os promotores e divulgadores da própria clínica e a enviar convites.'],
    ['1.1.0', '2026-11-11', 'Perfil Gerente: vê todas as telas do painel, menos Pessoas, e só os dados da clínica dele. Controle de versão no topo.'],
    ['1.0.0', '2026-11-10', 'Versão inicial do painel.']
  ];
  const VERSAO = VERSOES[0][0];
  ['ver', 'ver-l'].forEach(id => { const e = document.getElementById(id); if (e){ e.textContent = 'v'+VERSAO; e.title = 'v'+VERSAO+' · '+VERSOES[0][1]+' · '+VERSOES[0][2]; } });
  let eu = null;           // linha da tabela usuarios
  /* gerente: só as clínicas em que atua aparecem em listas e totais */
  const soMinhasClin = q => q.then(r => { if (!r.error && eu && eu.papel === 'gerente' && eu.minhas) r.data = (r.data || []).filter(c => eu.minhas.includes(c.id)); return r; });
  let recurso = 'inicio';
  let editId = null;
  let lista = [];
  let mostrarInativos = false, confirmaExcluir = false;

  const view = id => { ['load','login','confirmar','senha','app'].forEach(v => { $('#v-'+v).hidden = v !== id; }); document.body.classList.toggle('em-app', id === 'app'); };
  const msgErro = e => {
    if (!e) return '';
    if (e.code === '23505') return 'Já existe um cadastro com esse valor. Use outro nome ou sigla.';
    if (e.code === '42501' || /row-level security|permission denied/i.test(e.message || '')) return 'Sem permissão para esta ação.';
    if (/Invalid login credentials/i.test(e.message || '')) return 'E-mail ou senha incorretos.';
    if (/Email not confirmed/i.test(e.message || '')) return 'Este e-mail ainda não foi confirmado.';
    if (/fetch|network/i.test(e.message || '')) return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
    return e.message || 'Algo deu errado. Tente de novo.';
  };

  /* ---------- cadastros ---------- */
  const CORES = [['#5b9bff','Azul'],['#ffa23a','Laranja'],['#ff7aa8','Rosa'],['#3ecf9a','Verde'],['#b58cff','Roxo'],['#ff7a6b','Coral']];
  const RECURSOS = {
    clinicas: {
      titulo: 'Clínica', plural: 'Clínicas', tabela: 'clinicas', ordem: 'nome', ativo: 'ativa',
      intro: 'Cada clínica é uma equipe na corrida. A sigla aparece no carro da clínica.',
      campos: [
        {k:'sigla', rot:'Sigla (2 a 4 letras)', tipo:'text', max:4, upper:true, obrig:true},
        {k:'nome', rot:'Nome da clínica', tipo:'text', obrig:true},
        {k:'cidade', rot:'Cidade (Minas Gerais), para o mapa', tipo:'text', lista:'dl-mun'},
        {k:'cor', rot:'Cor do carro', tipo:'select', opcoes:CORES, padrao:'#5b9bff'},
        {k:'ativa', rot:'Clínica ativa', tipo:'check', padrao:true}
      ],
      validar: d => /^[A-Z0-9]{2,4}$/.test(d.sigla) ? '' : 'A sigla precisa ter de 2 a 4 letras ou números.',
      antes: async d => {
        if (!d.cidade){ Object.assign(d, { cidade: null, ibge_id: null, regiao_id: null, regiao: null, latitude: null, longitude: null }); return ''; }
        let lista; try { lista = await mgMunicipios(); } catch (e) { return 'Não consegui consultar a lista de cidades do IBGE agora. Tente de novo em instantes.'; }
        const m = lista.find(x => normTxt(x.nome) === normTxt(d.cidade)); if (!m) return 'Não encontrei essa cidade em Minas Gerais. Escolha uma da lista que aparece ao digitar.';
        let c; try { c = await mgCentro(m.id); } catch (e) { return 'Não consegui obter a localização dessa cidade agora. Tente de novo.'; }
        Object.assign(d, { cidade: m.nome, ibge_id: m.id, regiao_id: m.rid, regiao: m.rnome, longitude: c[0], latitude: c[1] }); return '';
      },
      resumo: r => '<div class="line"><span class="dot" style="background:'+esc(r.cor||'#999')+'"></span><span class="sigla">'+esc(r.sigla)+'</span><b>'+esc(r.nome)+'</b>'+(r.cidade?'<span class="chip">'+esc(r.cidade)+(r.regiao?' · '+esc(r.regiao.replace(/^Região (Geográfica )?(Intermediária de )?/,'')):'')+'</span>':'<span class="chip off">sem cidade</span>')+(r.ativa?'':'<span class="chip off">Inativa</span>')+'</div>'
    },
    tipos: {
      titulo: 'Tipo de lançamento', plural: 'Tipos de lançamento', tabela: 'tipos_lancamento', ordem: 'nome', ativo: 'ativo',

  function campoHtml(c, v){

    if (c.tipo === 'number') return '<label class="field" for="'+id+'">'+esc(c.rot)+'<input id="'+id+'" type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(v)+'"></label>';
    return '<label class="field" for="'+id+'">'+esc(c.rot)+'<input id="'+id+'" type="text"'+(c.max?' maxlength="'+c.max+'"':'')+(c.lista?' list="'+c.lista+'"':'')+' autocomplete="off" value="'+esc(v)+'">'+(c.lista?'<datalist id="'+c.lista+'"></datalist>':'')+'</label>';

  function desenhar(){
    const R = RECURSOS[recurso], atual = lista.find(r => r.id === editId) || null;

  async function carregar(){
    $('#area').style.gridTemplateColumns = '';
    marcarMenu();
    if ((recurso === 'campanhas' || recurso === 'agenda') && (eu.papel === 'gerente' || modoVisao === 'gerente')){ recurso = 'inicio'; marcarMenu(); }
    if (recurso === 'pessoas') return pessoasCarregar();
    if (recurso === 'campanhas') return campanhasCarregar();
    if (recurso === 'corrida') return corridaCarregar();
    if (recurso === 'relatorios') return relCarregar();
    if (recurso !== 'agenda') $('#v-app').classList.remove('sem-menu');
    if (recurso === 'agenda') return agendaCarregar();
    if (recurso === 'externo') return externoCarregar();
    if (recurso === 'mensagens') return msgCarregar();
    if (recurso === 'inicio') return inicioCarregar();
    if (recurso === 'planilha') return planCarregar();
    if (recurso === 'ranking') return rankCarregar();
    if (recurso === 'diario') return diaCarregar();

    const R = RECURSOS[recurso];
    $('#area').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const { data, error } = await sb.from(R.tabela).select('*').order(R.ordem);

    lista = data; desenhar();

  async function salvar(e){
    e.preventDefault();
    const R = RECURSOS[recurso], d = {};
    R.campos.forEach(c => {
      const el = $('#f-'+c.k);
      if (c.tipo === 'check') d[c.k] = el.checked;
      else if (c.tipo === 'number') d[c.k] = el.value === '' ? 0 : Number(el.value);
      else { let v = el.value.trim(); if (c.upper) v = v.toUpperCase(); d[c.k] = v; }
    });
    const falta = R.campos.find(c => c.obrig && !d[c.k]);
    const erro = falta ? 'Preencha: '+falta.rot.toLowerCase()+'.' : (R.validar ? R.validar(d) : '');
    if (erro){ $('#c-err').textContent = erro; return; }
    const btn = $('#c-btn'); btn.disabled = true;
    if (R.antes){ $('#c-err').textContent = ''; const m = await R.antes(d); if (m){ $('#c-err').textContent = m; btn.disabled = false; return; } }
    const q = editId ? sb.from(R.tabela).update(d).eq('id', editId) : sb.from(R.tabela).insert(d);
    const { error } = await q;
    btn.disabled = false;
    if (error){ $('#c-err').textContent = msgErro(error); return; }
    toast(editId ? R.titulo+' atualizado.' : R.titulo+' cadastrado.');
    editId = null; carregar();
  }

  async function excluir(){
    if (!confirmaExcluir){ confirmaExcluir = true; desenhar(); $('#c-err').textContent = 'Toque em "Confirmar exclusão" para apagar de vez.'; return; }
    const R = RECURSOS[recurso];
    const { error } = await sb.from(R.tabela).delete().eq('id', editId);
    confirmaExcluir = false;
    if (error){
      desenhar();
      $('#c-err').textContent = error.code === '23503' ? 'Este cadastro já tem movimentação e não pode ser excluído. Desmarque "ativo" e salve.' : msgErro(error);
      return;
    }
    toast(R.titulo+' excluído.'); editId = null; carregar();
  }

  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('button[data-r]'); if (!b) return;

  /* ---------- pessoas (gerentes e promotores) ---------- */
  let pessoas = [], vincs = [], clin = [], papelForm = 'promotor';
  const CARGOS = ['Promotor','Tele BH','Tele interno','Divulgador','Luminoso','Promotor de teste','Indicação'];
  const soDigitos = v => String(v||'').replace(/\D/g,'');
  const fmtTel = v => { const d = soDigitos(v); return d.length === 11 ? '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7) : d.length === 10 ? '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6) : d; };
  const clinicaDe = p => { const v = vincs.find(x => x.usuario_id === p.id); return v ? clin.find(c => c.id === v.clinica_id) : null; };

  async function chamar(body){
    body.redirectTo = enderecoLimpo();
    const { data, error } = await sb.functions.invoke('bright-service', { body });
    if (error){
      let m = error.message || '';
      try { const j = await error.context.json(); m = j.erro || m; } catch(e){}
      if (/not found|404|Failed to send/i.test(m)) m = 'A função de convite ainda não está ativa no Supabase. Veja as instruções de instalação.';
      return { erro: m };
    }
    if (data && data.erro) return { erro: data.erro };
    return { data };
  }

  async function pessoasCarregar(){
    $$('#nav button[data-r]').forEach(b => b.setAttribute('aria-current', b.dataset.r === recurso ? 'page' : 'false'));
    $('#area').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const [a, b, c] = await Promise.all([
      sb.from('usuarios').select('*').order('nome'),
      sb.from('vinculos_clinica').select('*'),
      soMinhasClin(sb.from('clinicas').select('*').order('nome'))]);

    if (er){ $('#area').innerHTML = '<div class="card"><div class="err">'+esc(msgErro(er))+'</div></div>'; return; }
    const gerV = eu.papel === 'gerente' || modoVisao === 'gerente';
    pessoas = a.data.filter(p => p.papel !== 'gestor' && (eu.papel === 'gestor' || p.papel !== 'assistente') && (!gerV || p.papel === 'promotor'));
    vincs = b.data.filter(v => !v.fim); clin = c.data;
    pessoasDesenhar();

    if (atual) papelForm = atual.papel;

    $('#area').innerHTML =
      '<div class="card"><h2>'+(atual ? 'Editar pessoa' : 'Nova pessoa')+'</h2>'
      + '<p class="sub">'+(atual ? 'Se trocar o e-mail, a pessoa recebe um link no novo endereço para criar a senha. Para tirar alguém de uso, desmarque "Pessoa ativa".' : 'A pessoa recebe um e-mail para criar a própria senha e colocar a foto.')+'</p>'

      + '<label class="field" for="p-papel">Função<select id="p-papel"'+(atual?' disabled':'')+'><option value="promotor"'+(papelForm==='promotor'?' selected':'')+'>Vendas</option>'+(eu.papel === 'gerente' || modoVisao === 'gerente' ? '' : '<option value="gerente"'+(papelForm==='gerente'?' selected':'')+'>Gerência (da clínica)</option>')+(eu.papel === 'gestor' ? '<option value="assistente"'+(papelForm==='assistente'?' selected':'')+'>Gestão (vê tudo, como o gestor)</option>' : '')+'</select></label>'
      + '<label class="field" for="p-nome">Nome<input id="p-nome" type="text" autocomplete="off" value="'+esc(atual?atual.nome:'')+'"></label>'
      + '<label class="field" for="p-email">E-mail<input id="p-email" type="email" inputmode="email" autocomplete="off" value="'+esc(atual?(atual.email||''):'')+'"'+'></label>'
      + '<label class="field" for="p-tel">Telefone com DDD<input id="p-tel" type="tel" inputmode="numeric" autocomplete="off" placeholder="(31) 99999-9999" value="'+esc(atual?fmtTel(atual.telefone):'')+'"></label>'
      + '<label class="field" for="p-clin" id="w-clin"'+(papelForm==='assistente'?' hidden':'')+'>Clínica<select id="p-clin"><option value="">Escolha...</option>'+opcClin.map(c => '<option value="'+c.id+'"'+(cAtual&&cAtual.id===c.id?' selected':'')+'>'+esc(c.sigla)+' · '+esc(c.nome)+'</option>').join('')+'</select></label>'
      + '<label class="field" for="p-desde" id="w-desde"'+(papelForm==='assistente'?' hidden':'')+'>Atua na clínica desde<input id="p-desde" type="date" max="'+hoje()+'" value="'+esc(vAtual ? vAtual.inicio : hoje())+'"><span class="sub" style="margin:0">Permite lançar visitas e vendas na planilha desde essa data, mesmo antes do cadastro aqui.</span></label>'
      + '<label class="field" for="p-cargo" id="w-cargo"'+(papelForm==='promotor'?'':' hidden')+'>Cargo<select id="p-cargo"><option value="">Escolha...</option>'+CARGOS.map(g => '<option'+(atual&&atual.cargo===g?' selected':'')+'>'+g+'</option>').join('')+'</select></label>'
      + '<div class="field" id="w-extra"'+(papelForm==='promotor'?'':' hidden')+'>Também atua como <small>(opcional; a pessoa ganha uma linha própria para cada cargo na planilha)</small><div class="mp-opts" id="p-extra">'+CARGOS.map(g => '<label class="chk" data-xg="'+esc(g)+'"><input type="checkbox" data-x="'+esc(g)+'"'+(atual && (atual.cargos_extra || []).includes(g) ? ' checked' : '')+'><span>'+esc(g)+'</span></label>').join('')+'</div></div>'
      + (atual ? '<label class="chk" for="p-ativo"><input id="p-ativo" type="checkbox"'+(atual.ativo?' checked':'')+'><span>Pessoa ativa</span></label>' : '')
      + '<div class="err" id="p-err" role="alert"></div>'
      + '<div class="btns"><button class="btn" type="submit" id="p-btn">'+(atual?'Salvar':'Enviar convite')+'</button>'
      + (atual ? '' : '<button class="btn ghost" type="button" id="p-sem">Salvar sem enviar convite</button>')
      + (atual ? '<button class="btn ghost" type="button" id="p-cancel">Cancelar edição</button>'+(atual.auth_id ? '<button class="btn ghost" type="button" id="p-reset">Enviar link de nova senha</button>' : '<button class="btn ghost" type="button" id="p-conv">Enviar convite agora</button>') : '')
      + '</div></form></div>'
      + '<div class="card"><h2>Pessoas</h2><label class="chk" style="margin-bottom:10px"><input type="checkbox" id="mostra-inat"'+(mostrarInativos?' checked':'')+'><span>Mostrar inativos</span></label>'
      + '<p class="sub">'+vis.length+' cadastrada'+(vis.length===1?'':'s')+'. Pessoas com lançamentos não são apagadas, só inativadas.</p>'
      + '<ul class="items">'+(vis.map(p => { const c = clinicaDe(p); return '<li class="item"><div><div class="line"><b>'+esc(p.nome)+'</b><span class="badge">'+(p.papel==='gerente'?'Gerência':p.papel==='assistente'?'Gestão':esc(p.cargo||'Vendas')+((p.cargos_extra || []).length ? ' + '+esc(p.cargos_extra.join(' + ')) : ''))+'</span>'+(c?'<span class="sigla">'+esc(c.sigla)+'</span>':(p.papel==='assistente'?'':'<span class="chip off">Sem clínica</span>'))+(p.auth_id?'':'<span class="chip off">Sem convite</span>')+(p.ativo?'':'<span class="chip off">Inativa</span>')+'</div><div class="meta">'+esc(p.email||'sem e-mail')+(p.telefone?' · '+esc(fmtTel(p.telefone)):'')+'</div></div><div><button type="button" class="btn ghost sm" data-ped="'+p.id+'">Editar</button></div></li>'; }).join('') || '<li class="empty">Ninguém cadastrado ainda.</li>')+'</ul></div>';
    $('#f-pes').addEventListener('submit', pessoaSalvar);

      cv.disabled = true; const r = await chamar({ acao: 'convidar_existente', pessoa_id: atual.id }); cv.disabled = false;

  const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  async function loginUnico(txt){
    let base = normTxt(String(txt).split('@')[0]).replace(/[^a-z0-9._-]+/g, '.').replace(/^\.+|\.+$/g, '').slice(0, 24);
    if (base.length < 3) base = (base+'usr').slice(0, 24);
    const { data } = await sb.from('usuarios').select('login').like('login', base+'%');
    const usados = new Set((data || []).map(x => x.login)); let l = base, n = 2;
    while (usados.has(l)) l = base+(n++);
    return l;
  }

  async function pessoaSalvar(e, semConvite){
    if (e) e.preventDefault();
    const atual = pessoas.find(p => p.id === editId) || null;
    const d = { papel: atual ? atual.papel : $('#p-papel').value, nome: $('#p-nome').value.trim(), email: $('#p-email').value.trim().toLowerCase(),
      telefone: soDigitos($('#p-tel').value), clinica_id: Number($('#p-clin').value) || null, cargo: $('#p-cargo').value, cargos_extra: $$('#p-extra input:checked').map(i => i.dataset.x), inicio: ($('#p-desde').value || hoje()) };
    if (d.papel !== 'promotor'){ d.cargo = null; d.cargos_extra = []; }
    d.cargos_extra = d.cargos_extra.filter(c => c !== d.cargo);
    const exigeContato = !atual && !semConvite;   // convite precisa de e-mail e telefone; salvar sem convite não
    const erro = !d.nome ? 'Informe o nome.'
      : ((exigeContato || d.email) && !emailOk(d.email)) ? 'Informe um e-mail válido.'
      : ((exigeContato || d.telefone || atual) && !/^[0-9]{10,11}$/.test(d.telefone) && !(atual && !atual.telefone && !d.telefone)) ? 'Telefone com DDD, 10 ou 11 números.'
      : (!d.clinica_id && d.papel !== 'assistente') ? 'Escolha a clínica.'
      : (d.papel !== 'assistente' && (!/^\d{4}-\d{2}-\d{2}$/.test(d.inicio) || d.inicio > hoje())) ? 'A data de início na clínica não pode ser vazia nem futura.'
      : (d.papel === 'promotor' && !d.cargo) ? 'Escolha o cargo.' : '';
    if (erro){ $('#p-err').textContent = erro; return; }
    const btns = $$('#f-pes .btns button'); btns.forEach(b => { b.disabled = true; }); $('#p-err').textContent = '';
    const libera = () => btns.forEach(b => { b.disabled = false; });

    if (!atual && semConvite){
      if (eu.papel === 'gerente'){
        const g = await sb.rpc('gerente_criar_promotor', { p_nome: d.nome, p_telefone: d.telefone || null, p_email: d.email || null, p_cargo: d.cargo, p_clinica: d.clinica_id, p_inicio: d.inicio });
        libera();
        if (g.error){ $('#p-err').textContent = msgErro(g.error); return; }
        toast(d.nome+' foi salva, sem convite. Quando quiser dar acesso, edite a pessoa e use "Enviar convite agora".'); pessoasCarregar(); return;
      }
      const login = await loginUnico(d.email || d.nome);
      const ins = await sb.from('usuarios').insert({ papel: d.papel, nome: d.nome, telefone: d.telefone || null, email: d.email || null, cargo: d.cargo || null, cargos_extra: d.cargos_extra, login }).select('id').single();
      if (ins.error){ libera(); $('#p-err').textContent = ins.error.code === '23505' ? 'Já existe uma pessoa com este e-mail.' : msgErro(ins.error); return; }
      if (d.papel !== 'assistente'){

  async function syncConj(tabela, col, campId, atuais, novos){
    const add = [...novos].filter(x => !atuais.has(x)), rem = [...atuais].filter(x => !novos.has(x));
    if (add.length){ const { error } = await sb.from(tabela).insert(add.map(x => ({ campanha_id: campId, [col]: x }))); if (error) return error; }
    if (rem.length){ const { error } = await sb.from(tabela).delete().eq('campanha_id', campId).in(col, rem); if (error) return error; }
    return null;
  }

  async function campanhaSalvar(e){
    e.preventDefault(); lerEditor();
    const falha = m => { $('#e-err').textContent = m; return null; };
    const casas = Number(ed.casas);
    if (!ed.nome) return falha('Informe o nome da campanha.');
    if (!ed.inicio || !ed.fim) return falha('Informe as datas de início e fim.');
    if (ed.fim < ed.inicio) return falha('A data final não pode ser antes da inicial.');
    if (!Number.isInteger(casas) || casas < 5 || casas > 120) return falha('O número de casas deve ficar entre 5 e 120.');
    if (ed.voltas && ed.limite !== '' && (!Number.isInteger(Number(ed.limite)) || Number(ed.limite) < 2)) return falha('O máximo de voltas deve ser 2 ou mais, ou fique vazio.');
    if (!ed.clinicas.size) return falha('Escolha pelo menos uma clínica.');
    const regras = [];
    for (const [tid, r] of Object.entries(ed.regras)){
      const t = C.tipos.find(x => x.id === Number(tid)), pts = Number(r.pontos), passo = r.modo === 'ocorrencia' ? 1 : Number(r.passo);
      if (r.pontos === '' || !Number.isInteger(pts) || pts < 0) return falha('Informe os pontos de "'+t.nome+'" (número inteiro).');
      if (!(passo > 0)) return falha('Informe o N de "'+t.nome+'" (maior que zero).');
      regras.push({ tipo_id: Number(tid), modo: r.modo, passo, pontos: pts });
    }
    if (!regras.length) return falha('Marque pelo menos um tipo de lançamento na pontuação.');
    const vistos = new Set(), casasP = [];
    for (const p of ed.premios){
      const n = Number(p.casa);
      if (!Number.isInteger(n) || n < 1 || n > casas) return falha('Cada casa premiada precisa ser um número de 1 a '+casas+'.');
      if (!p.premio_id) return falha('Escolha o prêmio da casa '+n+'.');
      const k = n+'|'+p.para; if (vistos.has(k)) return falha('A casa '+n+' já tem prêmio para '+(p.para==='clinica'?'clínica':'promotor')+'.');
      vistos.add(k); casasP.push({ casa: n, premio_id: p.premio_id, para: p.para });
    }
    const btn = $('#e-btn'); btn.disabled = true; $('#e-err').textContent = '';
    const fim = (m) => { btn.disabled = false; $('#e-err').textContent = m; return null; };
    const dados = { nome: ed.nome, inicio: ed.inicio, fim: ed.fim, casas, voltas_max: ed.voltas ? (ed.limite === '' ? null : Number(ed.limite)) : 1, premios_repetem: true };
    let id = ed.id;
    if (id){ const { error } = await sb.from('campanhas').update(dados).eq('id', id); if (error) return fim(msgErro(error)); }
    else { const { data, error } = await sb.from('campanhas').insert(dados).select('id').single(); if (error) return fim(msgErro(error)); id = data.id; ed.id = id; }
    let er = await syncConj('campanha_clinicas', 'clinica_id', id, new Set(C.cc.filter(x => x.campanha_id === id).map(x => x.clinica_id)), ed.clinicas);
    if (!er) er = await syncConj('campanha_participantes', 'usuario_id', id, new Set(C.cp.filter(x => x.campanha_id === id).map(x => x.usuario_id)), ed.promotores);
    if (!er){
      const at = C.rg.filter(r => r.campanha_id === id), novos = [], rem = [];
      for (const r of regras){
        const ex = at.find(x => x.tipo_id === r.tipo_id);
        if (!ex) novos.push(Object.assign({ campanha_id: id }, r));
        else if (ex.modo !== r.modo || Number(ex.passo) !== r.passo || ex.pontos !== r.pontos){ const u = await sb.from('regras_pontuacao').update({ modo: r.modo, passo: r.passo, pontos: r.pontos }).eq('id', ex.id); if (u.error){ er = u.error; break; } }
      }
      at.forEach(x => { if (!regras.some(r => r.tipo_id === x.tipo_id)) rem.push(x.id); });
      if (!er && novos.length){ const i = await sb.from('regras_pontuacao').insert(novos); er = i.error; }
      if (!er && rem.length){ const d = await sb.from('regras_pontuacao').delete().in('id', rem); er = d.error; }
    }
    if (!er){
      const at = C.cs.filter(x => x.campanha_id === id), novos = [], rem = [];
      for (const c of casasP){
        const ex = at.find(x => x.casa === c.casa && x.para === c.para);
        if (!ex) novos.push(Object.assign({ campanha_id: id }, c));
        else if (ex.premio_id !== c.premio_id){ const u = await sb.from('casas_premio').update({ premio_id: c.premio_id }).eq('id', ex.id); if (u.error){ er = u.error; break; } }
      }
      at.forEach(x => { if (!casasP.some(c => c.casa === x.casa && c.para === x.para)) rem.push(x); });
      if (!er && novos.length){ const i = await sb.from('casas_premio').insert(novos); er = i.error; }
      for (const x of rem){ if (er) break; const d = await sb.from('casas_premio').delete().eq('id', x.id); if (d.error) er = d.error.code === '23503' ? { message: 'A casa '+x.casa+' já tem ganhador e não pode ser removida.' } : d.error; }
    }
    if (er){ await campanhasCarregarSilencioso(); return fim('Salvo só em parte: '+msgErro(er)); }
    await sb.rpc('recalcular', { p_camp: id });
    toast('Campanha salva.'); ed = null; campanhasCarregar();
  }

  async function campanhasCarregarSilencioso(){

  const K = { camps: [], sel: null, modo: 'promotor', tk: 0, key: '', tokens: {}, prev: null, geo: null, N: 0, ganVistos: null, busy: false };
  const CORES_CASA = ['#ff5a5f','#ffa23a','#ffd23f','#3ddc84','#3aa0ff','#b86bff'];
  const tileDe = (p, N) => p <= 0 ? 0 : (p % N === 0 ? N : p % N);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const reduzMov = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  const bauSvg = tipo => { const c = tipo === 'ouro' ? ['#ffd34d','#e0a200','#8a5a00'] : ['#dfe5ec','#aab5c1','#5d6975'];
    return '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="19" width="30" height="16" rx="3" fill="'+c[1]+'" stroke="'+c[2]+'" stroke-width="2"/><path class="tampa" d="M5 19V15a8 8 0 018-8h14a8 8 0 018 8v4z" fill="'+c[0]+'" stroke="'+c[2]+'" stroke-width="2"/><rect x="17" y="17" width="6" height="8" rx="1.5" fill="'+c[2]+'"/><circle cx="20" cy="21" r="1.4" fill="'+c[0]+'"/></svg>'; };
  /* trilha em S, começando embaixo — a mesma do aplicativo, com mais colunas porque a tela é larga */
  function kGeom(N, W){
    const cols = Math.max(4, Math.min(8, Math.round(W / 150))), pad = 56, dx = (W - 2 * pad) / (cols - 1), dy = 92, rows = Math.ceil((N + 1) / cols), H = pad * 2 + (rows - 1) * dy + 36;
    const pt = i => { const r = Math.floor(i / cols); let c = i % cols; if (r % 2) c = cols - 1 - c; return { x: pad + c * dx, y: H - pad - r * dy }; };
    return { cols, rows, H, W, pt };
  }
  function kToken(id, e){
    const el = document.createElement('div'); el.className = 'tk'; el.dataset.id = id;
    el.innerHTML = '<span class="sombra"></span>'+(e.foto_url ? '<img class="disc" style="--rc:'+esc(e.cor)+'" src="'+esc(e.foto_url)+'" alt="'+esc(e.nome)+'">' : '<span class="disc" style="--rc:'+esc(e.cor)+'" title="'+esc(e.nome)+'">'+esc(e.tag)+'</span>');
    return el;
  }
  const kColocar = (t, ponto, off) => { t.xy = { x: ponto.x + (off || 0), y: ponto.y }; t.el.style.transform = 'translate('+t.xy.x+'px,'+t.xy.y+'px)'; };
  function kReempilhar(){
    const grupos = {};
    Object.values(K.tokens).forEach(t => { (grupos[t.tile] = grupos[t.tile] || []).push(t); });
    Object.keys(grupos).forEach(ti => grupos[ti].forEach((t, j, arr) => kColocar(t, K.geo.pt(Number(ti)), (j - (arr.length - 1) / 2) * 26)));
  }
  function kPoeira(t){
    const mapa = $('#k-pista'); if (reduzMov() || !mapa || !t.xy) return;
    for (let i = 0; i < 4; i++){
      const d = document.createElement('span'); d.className = 'po'; d.style.left = (t.xy.x - 4)+'px'; d.style.top = (t.xy.y - 4)+'px'; mapa.appendChild(d);
      const sg = i < 2 ? -1 : 1;
      d.animate([{ transform: 'translate(0,0) scale(1)', opacity: .9 }, { transform: 'translate('+(sg*(10+Math.random()*14))+'px,'+(-6-Math.random()*10)+'px) scale(.2)', opacity: 0 }], { duration: 520, easing: 'ease-out' }).onfinish = () => d.remove();

  async function kPular(t, ponto, dur){
    const de = t.xy, para = { x: ponto.x, y: ponto.y };

    if (!reduzMov()){
      const an = t.el.animate([{ transform: 'translate('+de.x+'px,'+de.y+'px)' }, { transform: 'translate('+((de.x+para.x)/2)+'px,'+(((de.y+para.y)/2)-30)+'px)', offset: .5 }, { transform: 'translate('+para.x+'px,'+para.y+'px)' }], { duration: dur, easing: 'ease-in-out', fill: 'forwards' });
      try { await an.finished; } catch (e) {}
      t.xy = para; t.el.style.transform = 'translate('+para.x+'px,'+para.y+'px)'; an.cancel();

  async function kAndar(t, p0, p1){
    const N = K.N;
    if (p1 < p0 || reduzMov()){ t.tile = tileDe(p1, N); kColocar(t, K.geo.pt(t.tile), 0); return; }

    t.tile = tileDe(ini, N); kColocar(t, K.geo.pt(t.tile), 0);

  async function corridaAtualizarInterno(c){
    const tk = ++K.tk, modo = K.modo, view = modo === 'promotor' ? 'ranking_promotores' : 'ranking_clinicas', idCol = modo === 'promotor' ? 'promotor_id' : 'clinica_id';

      + '<select id="l-fclin" aria-label="Filtrar por clínica" style="width:auto"><option value="">Todas as clínicas</option>'+L.clin.map(c => '<option value="'+c.id+'"'+(String(c.id)===L.filtroClin?' selected':'')+'>'+esc(c.sigla)+'</option>').join('')+'</select>'
      + '<select id="l-fdias" aria-label="Período" style="width:auto">'+[7,30,90].map(d => '<option value="'+d+'"'+(d===L.dias?' selected':'')+'>Últimos '+d+' dias</option>').join('')+'</select></div></div>'
      + '<div id="l-lista" style="margin-top:8px"><p class="sub">Carregando...</p></div></div>';
    $('#n-clin').addEventListener('change', e => { $('#n-prom').innerHTML = lancOpcPromotores(Number(e.target.value)); });
    $('#n-tipo').addEventListener('change', e => { const o = e.target.selectedOptions[0]; $('#w-valor').hidden = !(o && o.dataset.v === '1'); });
    $('#f-lanc').addEventListener('submit', lancarSalvar);
    $('#l-fclin').addEventListener('change', e => { L.filtroClin = e.target.value; L.acao = null; lancLista(); });
    $('#l-fdias').addEventListener('change', e => { L.dias = Number(e.target.value); L.acao = null; lancLista(); });
    $('#l-lista').addEventListener('click', lancClique);
