  async function lancarSalvar(e){
    e.preventDefault();
    const clinica = Number($('#n-clin').value), prom = Number($('#n-prom').value), tipo = Number($('#n-tipo').value), qtd = num($('#n-qtd').value);
    const t = L.tipos.find(x => x.id === tipo), valor = $('#n-valor').value === '' ? null : num($('#n-valor').value);
    const erro = !clinica ? 'Escolha a clínica.' : !prom ? 'Escolha o promotor.' : !tipo ? 'Escolha o que foi feito.' : !(qtd > 0) ? 'A quantidade precisa ser maior que zero.'
      : (t.usa_valor && !(valor > 0)) ? 'Este tipo exige o valor da venda.' : !$('#n-data').value ? 'Informe a data.' : '';
    if (erro){ $('#n-err').textContent = erro; return; }
    const btn = $('#n-btn'); btn.disabled = true; $('#n-err').textContent = '';
    const { error } = await sb.rpc('lancar', { p_promotor: prom, p_clinica: clinica, p_tipo: tipo, p_quantidade: qtd, p_valor: t.usa_valor ? valor : null, p_data: $('#n-data').value });
    btn.disabled = false;
    if (error){ $('#n-err').textContent = rpcMsg(error); return; }
    toast('Lançamento registrado.'); $('#n-qtd').value = '1'; $('#n-valor').value = ''; lancLista();
  }

  async function lancLista(){
    const alvo = $('#l-lista'); if (!alvo) return;
    const desde = new Date(Date.now() - L.dias * 864e5).toLocaleDateString('sv-SE');
    let q = sb.from('lancamentos').select('*').gte('data_ref', desde).order('criado_em', { ascending: false }).limit(200);
    if (L.filtroClin) q = q.eq('clinica_id', Number(L.filtroClin));
    const { data, error } = await q;
    if (error){ alvo.innerHTML = '<div class="err">'+esc(msgErro(error))+'</div>'; return; }
    L.rows = data; L.lcs = [];
    if (data.length){ const r = await sb.from('lancamento_campanhas').select('*').in('lancamento_id', data.map(x => x.id)); if (!r.error) L.lcs = r.data; }
    lancRender();
  }

  function lancRender(){
    const alvo = $('#l-lista'); if (!alvo) return;
    alvo.innerHTML = '<ul class="items">'+(L.rows.map(r => {
      const u = L.usu.find(x => x.id === r.promotor_id) || { nome: '#'+r.promotor_id }, c = L.clin.find(x => x.id === r.clinica_id) || { sigla: '?' }, t = L.tipos.find(x => x.id === r.tipo_id) || {};
      const nomeT = t.nome || 'Tipo #'+r.tipo_id;
      const lcs = L.lcs.filter(x => x.lancamento_id === r.id), validos = lcs.filter(x => x.status === 'valido');
      const st = !lcs.length ? '' : !validos.length ? '<span class="chip off">Cancelado</span>' : validos.length < lcs.length ? '<span class="chip off">Cancelado em parte</span>' : '';
      const aberto = L.acao && L.acao.id === r.id ? L.acao.tipo : null;
      return '<li class="item" style="grid-template-columns:minmax(0,1fr)"><div class="line" style="justify-content:space-between"><div style="min-width:0"><div class="line"><b>'+esc(u.nome)+'</b><span class="sigla">'+esc(c.sigla)+'</span><span>'+esc(nomeT)+'</span>'+st+'</div>'
        + '<div class="meta">'+dBR(r.data_ref)+' · qtd '+Number(r.quantidade)+(r.valor != null ? ' · '+brl(r.valor) : '')+' · '+lcs.map(x => '<span class="chip'+(x.status==='valido'?'':' off')+'">'+esc((L.camps.find(k => k.id === x.campanha_id) || {}).nome || '#'+x.campanha_id)+'</span>').join(' ')+'</div></div>'
        + '<div class="btns"><button type="button" class="btn ghost sm" data-a="hi" data-id="'+r.id+'">Histórico</button>'
        + (validos.length ? '<button type="button" class="btn ghost sm" data-a="ed" data-id="'+r.id+'">Corrigir</button><button type="button" class="btn ghost sm" data-a="ca" data-id="'+r.id+'">Cancelar</button>' : '')+'</div></div>'
        + (aberto ? lancPainel(r, aberto, validos, t) : '')+'</li>'; }).join('') || '<li class="empty">Nenhum lançamento neste período.</li>')+'</ul>';
  }

  function lancPainel(r, tipo, validos, t){
    if (tipo === 'ed') return '<div class="form" style="margin-top:10px;padding:12px;background:var(--surface-2);border-radius:14px"><div class="g2"><label class="field">Quantidade<input id="a-qtd" type="number" step="any" min="0.01" value="'+Number(r.quantidade)+'"></label>'
      + (t.usa_valor ? '<label class="field">Valor (R$)<input id="a-valor" type="number" step="0.01" min="0.01" value="'+(r.valor != null ? Number(r.valor) : '')+'"></label>' : '')+'</div>'
      + '<label class="field">Motivo da correção<input id="a-motivo" type="text" autocomplete="off" placeholder="Ex.: digitei o valor errado"></label><div class="err" id="a-err" role="alert"></div>'
      + '<div class="btns"><button type="button" class="btn sm" data-a="ok-ed" data-id="'+r.id+'">Salvar correção</button><button type="button" class="btn ghost sm" data-a="fechar">Fechar</button></div></div>';
    if (tipo === 'ca') return '<div class="form" style="margin-top:10px;padding:12px;background:var(--surface-2);border-radius:14px"><label class="field">Cancelar em<select id="a-camp"><option value="">Todas as campanhas</option>'
      + validos.map(x => '<option value="'+x.campanha_id+'">'+esc((L.camps.find(k => k.id === x.campanha_id) || {}).nome || '#'+x.campanha_id)+'</option>').join('')+'</select></label>'
      + '<label class="field">Motivo do cancelamento<input id="a-motivo" type="text" autocomplete="off" placeholder="Ex.: lançado em duplicidade"></label><div class="err" id="a-err" role="alert"></div>'
      + '<div class="btns"><button type="button" class="btn sm" data-a="ok-ca" data-id="'+r.id+'">Confirmar cancelamento</button><button type="button" class="btn ghost sm" data-a="fechar">Fechar</button></div></div>';
    const h = L.hist;
    return '<div style="margin-top:10px;padding:12px;background:var(--surface-2);border-radius:14px">'+(h.length ? h.map(a => {
      const u = L.usu.find(x => x.id === a.usuario_id) || { nome: '#'+a.usuario_id };
      const det = a.acao === 'editar' && a.antes && a.depois ? ' · qtd '+Number(a.antes.quantidade)+' → '+Number(a.depois.quantidade)+(a.antes.valor != null || a.depois.valor != null ? ' · valor '+brl(a.antes.valor)+' → '+brl(a.depois.valor) : '')
        : a.acao === 'criar' && a.depois ? ' · qtd '+Number(a.depois.quantidade)+(a.depois.valor != null ? ' · '+brl(a.depois.valor) : '') : '';
      return '<div class="meta" style="margin:4px 0"><b>'+({criar:'Criado',editar:'Corrigido',cancelar:'Cancelado'}[a.acao]||esc(a.acao))+'</b> por '+esc(u.nome)+' em '+new Date(a.quando).toLocaleString('pt-BR')+esc(det)+(a.motivo ? ' · motivo: '+esc(a.motivo) : '')+'</div>'; }).join('') : '<div class="meta">Sem histórico.</div>')
      + '<div class="btns" style="margin-top:8px"><button type="button" class="btn ghost sm" data-a="fechar">Fechar</button></div></div>';
  }

  async function lancClique(e){
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, id = Number(b.dataset.id);
    if (a === 'fechar'){ L.acao = null; lancRender(); return; }
    if (a === 'ed' || a === 'ca'){ L.acao = { id, tipo: a }; lancRender(); return; }
    if (a === 'hi'){
      const { data, error } = await sb.from('auditoria').select('*').eq('lancamento_id', id).order('quando', { ascending: false });
      L.hist = error ? [] : data; L.acao = { id, tipo: 'hi' }; lancRender(); return;
    }
    const motivo = ($('#a-motivo') || {}).value || '';
    if (motivo.trim().length < 3){ $('#a-err').textContent = 'Informe o motivo (mínimo 3 letras).'; return; }
    b.disabled = true;
    let r;
    if (a === 'ok-ed'){
      const qtd = num($('#a-qtd').value), v = $('#a-valor') ? ($('#a-valor').value === '' ? null : num($('#a-valor').value)) : null;
      if (!(qtd > 0)){ b.disabled = false; $('#a-err').textContent = 'A quantidade precisa ser maior que zero.'; return; }
      r = await sb.rpc('editar_lancamento', { p_id: id, p_quantidade: qtd, p_valor: v, p_motivo: motivo.trim() });
    } else {
      const c = $('#a-camp').value;
      r = await sb.rpc('cancelar_lancamento', { p_id: id, p_motivo: motivo.trim(), p_campanha: c ? Number(c) : null });
    }
    b.disabled = false;
    if (r.error){ $('#a-err').textContent = rpcMsg(r.error); return; }
    toast(a === 'ok-ed' ? 'Lançamento corrigido.' : 'Lançamento cancelado.'); L.acao = null; lancLista();
  }


  /* ---------- relatórios: fechamento e auditoria ---------- */
  const RP = { tipos: [], clin: [], usu: [], camps: [], aba: 'fech', f: { de: '', ate: '', camp: '', clin: '', por: 'promotor' }, a: { de: '', ate: '', quem: '', acao: '', so: true }, linhas: [], tk: 0 };
  const pct1 = n => n == null ? '—' : n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })+'%';
  const nfmt = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 2 });

  async function relCarregar(){
    $$('#nav button[data-r]').forEach(b => b.setAttribute('aria-current', b.dataset.r === recurso ? 'page' : 'false'));
    $('#area').style.gridTemplateColumns = 'minmax(0,1fr)';
    $('#area').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const rs = await Promise.all([sb.from('tipos_lancamento').select('*'), soMinhasClin(sb.from('clinicas').select('*').order('nome')), sb.from('usuarios').select('*').order('nome'), sb.from('campanhas').select('*')]);
    const er = rs.map(r => r.error).find(Boolean);
    if (er){ $('#area').innerHTML = '<div class="card"><div class="err">'+esc(msgErro(er))+'</div></div>'; return; }
    RP.tipos = rs[0].data; RP.clin = rs[1].data; RP.usu = rs[2].data; RP.camps = rs[3].data;
    const h = hoje(), ini = h.slice(0, 8)+'01';
    if (!RP.f.de){ RP.f.de = ini; RP.f.ate = h; RP.a.de = ini; RP.a.ate = h; }
    relDesenhar();
  }

  function relDesenhar(){
    $('#area').innerHTML = '<div class="card"><div class="top"><h2>Relatórios</h2><div class="seg" role="group" aria-label="Relatório"><button type="button" data-ra="fech" aria-pressed="'+(RP.aba==='fech')+'">% pela corrida</button><button type="button" data-ra="aud" aria-pressed="'+(RP.aba==='aud')+'">Auditoria</button></div></div><div id="r-corpo" style="margin-top:12px"></div></div>';
    $$('[data-ra]').forEach(b => b.addEventListener('click', () => { RP.aba = b.dataset.ra; relDesenhar(); }));
    if (RP.aba === 'fech') relFiltrosFech(); else relFiltrosAud();
  }

  const optsPessoas = (sel, papeis) => '<option value="">Todas as pessoas</option>'+RP.usu.filter(u => papeis.includes(u.papel)).map(u => '<option value="'+u.id+'"'+(String(u.id)===String(sel)?' selected':'')+'>'+esc(u.nome)+'</option>').join('');

  function relFiltrosFech(){
    const f = RP.f;
    $('#r-corpo').innerHTML = '<p class="sub">% de fechamento = vendas de início ÷ visitas. Só entram lançamentos que continuam válidos.</p>'
      + '<div class="g3"><label class="field">De<input id="f-de" type="date" value="'+esc(f.de)+'"></label><label class="field">Até<input id="f-ate" type="date" value="'+esc(f.ate)+'"></label>'
      + '<label class="field">Campanha<select id="f-camp"><option value="">Todas</option>'+RP.camps.map(c => '<option value="'+c.id+'"'+(String(c.id)===f.camp?' selected':'')+'>'+esc(c.nome)+'</option>').join('')+'</select></label>'
      + '<label class="field">Clínica<select id="f-clin"><option value="">Todas</option>'+RP.clin.map(c => '<option value="'+c.id+'"'+(String(c.id)===f.clin?' selected':'')+'>'+esc(c.sigla)+' · '+esc(c.nome)+'</option>').join('')+'</select></label>'
      + '<label class="field">Agrupar por<select id="f-por"><option value="promotor"'+(f.por==='promotor'?' selected':'')+'>Promotor</option><option value="clinica"'+(f.por==='clinica'?' selected':'')+'>Clínica</option><option value="mes"'+(f.por==='mes'?' selected':'')+'>Mês</option></select></label></div>'
      + '<div class="btns" style="margin:10px 0"><button class="btn ghost sm" type="button" data-p="mes">Este mês</button><button class="btn ghost sm" type="button" data-p="ant">Mês passado</button><button class="btn ghost sm" type="button" data-p="90">Últimos 90 dias</button><button class="btn ghost sm" type="button" id="f-csv">Baixar planilha</button></div><div id="f-res"><p class="sub">Carregando...</p></div>';
    const ler = () => { f.de = $('#f-de').value; f.ate = $('#f-ate').value; f.camp = $('#f-camp').value; f.clin = $('#f-clin').value; f.por = $('#f-por').value; relFechamento(); };
    ['f-de','f-ate','f-camp','f-clin','f-por'].forEach(id => $('#'+id).addEventListener('change', ler));
    $$('[data-p]').forEach(b => b.addEventListener('click', () => {
      const h = new Date(), d = n => new Date(h.getFullYear(), h.getMonth() + n, 1), iso = x => x.toLocaleDateString('sv-SE');
      if (b.dataset.p === 'mes'){ f.de = iso(d(0)); f.ate = hoje(); }
      else if (b.dataset.p === 'ant'){ f.de = iso(d(-1)); f.ate = iso(new Date(h.getFullYear(), h.getMonth(), 0)); }
      else { f.de = iso(new Date(Date.now() - 90 * 864e5)); f.ate = hoje(); }
      $('#f-de').value = f.de; $('#f-ate').value = f.ate; relFechamento();
    }));
    $('#f-csv').addEventListener('click', baixarCsv);
    relFechamento();
  }

  async function buscarLanc(de, ate){
    let tudo = [];
    for (let i = 0; ; i += 1000){
      const { data, error } = await sb.from('lancamentos').select('*, lancamento_campanhas(campanha_id,status)').gte('data_ref', de).lte('data_ref', ate).order('data_ref').range(i, i + 999);
      if (error) return { error };
      tudo = tudo.concat(data);
      if (data.length < 1000 || tudo.length >= 20000) break;
    }
    return { data: tudo };
  }

  async function relFechamento(){
    const f = RP.f, tk = ++RP.tk, alvo = $('#f-res'); if (!alvo) return;
    if (!f.de || !f.ate || f.de > f.ate){ alvo.innerHTML = '<div class="err">Informe um período válido.</div>'; return; }
    alvo.innerHTML = '<p class="sub">Calculando...</p>';
    const r = await buscarLanc(f.de, f.ate);
    if (tk !== RP.tk || !$('#f-res')) return;
    if (r.error){ alvo.innerHTML = '<div class="err">'+esc(msgErro(r.error))+'</div>'; return; }
    const camp = f.camp ? Number(f.camp) : null, g = {};
    r.data.forEach(l => {
      if (f.clin && l.clinica_id !== Number(f.clin)) return;
      if (!(l.lancamento_campanhas || []).some(x => x.status === 'valido' && (!camp || x.campanha_id === camp))) return;
      const t = RP.tipos.find(x => x.id === l.tipo_id); if (!t || t.base_fechamento === 'nenhum') return;
      const k = f.por === 'promotor' ? l.promotor_id : f.por === 'clinica' ? l.clinica_id : String(l.data_ref).slice(0, 7);
      const o = g[k] = g[k] || { k, visitas: 0, vendas: 0 };
      if (t.base_fechamento === 'visita') o.visitas += Number(l.quantidade); else o.vendas += Number(l.quantidade);
    });
    const nome = k => f.por === 'promotor' ? ((RP.usu.find(u => u.id === k) || {}).nome || '#'+k)
      : f.por === 'clinica' ? (c => c ? c.sigla+' · '+c.nome : '#'+k)(RP.clin.find(c => c.id === k)) : k.slice(5)+'/'+k.slice(0, 4);
    const linhas = Object.values(g).map(o => ({ nome: nome(o.k), visitas: o.visitas, vendas: o.vendas, pct: o.visitas > 0 ? 100 * o.vendas / o.visitas : null, k: o.k }));
    linhas.sort((a, b) => f.por === 'mes' ? (a.k < b.k ? -1 : 1) : ((b.pct == null ? -1 : b.pct) - (a.pct == null ? -1 : a.pct)) || b.visitas - a.visitas);
    const tv = linhas.reduce((s, x) => s + x.visitas, 0), tn = linhas.reduce((s, x) => s + x.vendas, 0);
    RP.linhas = linhas.concat([{ nome: 'Total', visitas: tv, vendas: tn, pct: tv > 0 ? 100 * tn / tv : null, total: true }]);
    alvo.innerHTML = linhas.length
      ? '<div style="overflow-x:auto"><table class="tab"><thead><tr><th>'+({promotor:'Promotor',clinica:'Clínica',mes:'Mês'}[f.por])+'</th><th class="n">Visitas</th><th class="n">Vendas de início</th><th class="n">% de fechamento</th></tr></thead><tbody>'
        + RP.linhas.map(x => '<tr'+(x.total?' class="tot"':'')+'><td>'+esc(x.nome)+'</td><td class="n">'+nfmt(x.visitas)+'</td><td class="n">'+nfmt(x.vendas)+'</td><td class="n"><span class="barra"><i style="width:'+Math.min(100, x.pct || 0)+'%"></i></span> <b>'+pct1(x.pct)+'</b></td></tr>').join('')+'</tbody></table></div>'
      : '<div class="empty">Nenhuma visita ou venda de início neste período.</div>';
  }

  function baixarCsv(){
    if (!RP.linhas.length){ toast('Nada para baixar neste período.'); return; }
    const n = v => String(v).replace('.', ',');
    const csv = '﻿'+['Nome;Visitas;Vendas de início;% de fechamento'].concat(RP.linhas.map(x => [x.nome, n(x.visitas), n(x.vendas), x.pct == null ? '' : n(x.pct.toFixed(1))].map(c => '"'+String(c).replace(/"/g, '""')+'"').join(';'))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'fechamento-'+RP.f.de+'-a-'+RP.f.ate+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

    const ler = () => { a.de = $('#a-de').value; a.ate = $('#a-ate').value; a.quem = $('#a-quem').value; a.acao = $('#a-acao').value; a.so = $('#a-so').checked; relAuditoria(); };

  async function relAuditoria(){
    const a = RP.a, tk = ++RP.tk, alvo = $('#a-res'); if (!alvo) return;
    if (!a.de || !a.ate || a.de > a.ate){ alvo.innerHTML = '<div class="err">Informe um período válido.</div>'; return; }
    alvo.innerHTML = '<p class="sub">Carregando...</p>';
    let q = sb.from('auditoria').select('*, lancamentos(promotor_id,clinica_id,tipo_id,quantidade,valor,data_ref)')
      .gte('quando', new Date(a.de+'T00:00:00').toISOString()).lte('quando', new Date(a.ate+'T23:59:59').toISOString()).order('quando', { ascending: false }).limit(300);
    if (a.quem) q = q.eq('usuario_id', Number(a.quem));
    if (a.acao) q = q.eq('acao', a.acao); else if (a.so) q = q.in('acao', ['editar', 'cancelar']);
    const { data, error } = await q;
    if (tk !== RP.tk || !$('#a-res')) return;
    if (error){ alvo.innerHTML = '<div class="err">'+esc(msgErro(error))+'</div>'; return; }
    alvo.innerHTML = data.length ? '<p class="meta" style="margin-bottom:6px">'+data.length+(data.length === 300 ? ' (mostrando os 300 mais recentes)' : '')+' registro'+(data.length === 1 ? '' : 's')+'</p><ul class="items">'+data.map(x => {
      const l = x.lancamentos || {}, quem = (RP.usu.find(u => u.id === x.usuario_id) || { nome: '#'+x.usuario_id }).nome,
        pr = (RP.usu.find(u => u.id === l.promotor_id) || { nome: '—' }).nome, cl = (RP.clin.find(c => c.id === l.clinica_id) || { sigla: '?' }).sigla, tp = (RP.tipos.find(t => t.id === l.tipo_id) || { nome: 'Lançamento' }).nome;
      const det = x.acao === 'editar' && x.antes && x.depois ? ' · quantidade '+nfmt(x.antes.quantidade)+' → '+nfmt(x.depois.quantidade)+(x.antes.valor != null || x.depois.valor != null ? ' · valor '+brl(x.antes.valor)+' → '+brl(x.depois.valor) : '') : '';
      return '<li class="item" style="grid-template-columns:minmax(0,1fr)"><div class="line"><span class="badge '+(x.acao==='criar'?'':'ouro')+'">'+({criar:'Criou',editar:'Corrigiu',cancelar:'Cancelou'}[x.acao]||esc(x.acao))+'</span><b>'+esc(quem)+'</b><span class="meta" style="margin:0">'+new Date(x.quando).toLocaleString('pt-BR')+'</span></div>'
        + '<div class="meta">'+esc(tp)+' de '+esc(pr)+' · '+esc(cl)+(l.data_ref ? ' · '+dBR(l.data_ref) : '')+esc(det)+'</div>'+(x.motivo ? '<div>Motivo: '+esc(x.motivo)+'</div>' : '')+'</li>'; }).join('')+'</ul>'
      : '<div class="empty">Nenhum registro neste período.</div>';
  }


  /* ---------- planilha diária: lançamento do dia e planilha do mês ---------- */
  const PD = { clinicas: [], clin: null, ano: 0, mes: 0, inativos: true, data: '', tk: 0, pessoas: [], r: {}, corr: {}, existe: false, testeMes: false };
  const TESTE = 'Promotor de teste';
  const PD_META = { 'Promotor': 30, 'Luminoso': 30, 'Tele BH': 45, 'Tele interno': 45, 'Promotor de teste': 30, 'Indicação': 30 };
  const PD_ORDEM = ['Promotor', 'Tele BH', 'Tele interno', 'Luminoso', 'Indicação'];
  const PD_ROT = { 'Promotor': 'Promotores', 'Tele BH': 'Tele BH', 'Tele interno': 'Tele interno', 'Luminoso': 'Luminoso', 'Divulgador': 'Divulgadores', 'Indicação': 'Indicação' };
  /* uma pessoa com mais de um cargo aparece em uma linha por cargo: a principal (id numérico) e uma por cargo extra (id "N_cX") */
  const pdChave = (uid, cargo) => cargo ? uid+'_c'+CARGOS.indexOf(cargo) : uid;
  async function pdExtras(){ const r = await sb.from('usuarios').select('id,cargos_extra').eq('papel', 'promotor'); const m = {}; (r.data || []).forEach(u => { if ((u.cargos_extra || []).length) m[u.id] = u.cargos_extra; }); return m; }
  const pdExpandir = (lista, extras) => { const o = []; lista.forEach(p => { o.push(Object.assign({}, p, { u: p.id, rc: '' })); (extras[p.id] || []).forEach(c => o.push(Object.assign({}, p, { id: pdChave(p.id, c), u: p.id, rc: c, cargo: c }))); }); return o; };
  const pd2 = n => String(n).padStart(2, '0');
  const pdIso = (a, m, d) => a+'-'+pd2(m + 1)+'-'+pd2(d);
  const pdN = (a, m) => new Date(a, m + 1, 0).getDate();
  const pf1 = x => x == null ? '—' : x.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })+'%';
  const pf0 = x => x == null ? '—' : Math.round(x)+'%';
  const pdPct = (v, s) => v > 0 ? 100 * s / v : null;
  const pdMarcar = () => $$('#nav button[data-r]').forEach(b => b.setAttribute('aria-current', b.dataset.r === recurso ? 'page' : 'false'));
  const pdErro = e => { $('#area').innerHTML = '<div class="card"><div class="err">'+esc(msgErro(e))+'</div></div>'; };

  async function pdBase(){
    if (PD.clinicas.length && PD.ano) return null;
    const q = await sb.from('clinicas').select('*').order('nome');
    if (q.error) return q.error;
    let lista = q.data.filter(c => c.ativa !== false);
    if (eu.papel === 'gerente'){
      const v = await sb.from('vinculos_clinica').select('*').eq('usuario_id', eu.id);
      if (v.error) return v.error;
      const ids = v.data.filter(x => !x.fim || x.fim >= hoje()).map(x => x.clinica_id);
      lista = lista.filter(c => ids.includes(c.id));
    }
    PD.clinicas = lista; PD.clin = lista[0] ? lista[0].id : null;
    const h = hoje(); PD.ano = Number(h.slice(0, 4)); PD.mes = Number(h.slice(5, 7)) - 1; PD.data = h;
    return null;
  }

  const pdSelClin = () => '<select id="pd-clin" aria-label="Clínica">'+PD.clinicas.map(c => '<option value="'+c.id+'"'+(c.id === PD.clin ? ' selected' : '')+'>'+esc(c.sigla)+' · '+esc(c.nome)+'</option>').join('')+'</select>';
  const pdVazio = () => { $('#area').innerHTML = '<div class="card"><div class="empty">'+(eu.papel === 'gerente' ? 'Você ainda não está vinculada a uma clínica. Fale com o gestor.' : 'Cadastre uma clínica primeiro.')+'</div></div>'; };

  /* meta do divulgador num dia: média das metas por tipo de visita (rua 30%, tele 45%) */
  function pdMetaDia(pes, M, d){
    let rua = 0, tele = 0;
    pes.forEach(p => { if (p.cargo === 'Divulgador') return; const v = ((M[p.id] || {})[d] || [0, 0])[0]; if (p.cargo === 'Tele BH' || p.cargo === 'Tele interno') tele += v; else rua += v; });
    return rua + tele > 0 ? (rua * 30 + tele * 45) / (rua + tele) : null;
  }
  function pdMetaDiv(pes, M, ids, n){
    let num = 0, den = 0;
    ids.forEach(id => { for (let d = 1; d <= n; d++){ const c = (M[id] || {})[d]; if (!c || c[0] <= 0) continue; const m = pdMetaDia(pes, M, d); if (m != null){ num += c[0] * m; den += c[0]; } } });
    return den > 0 ? num / den : null;
  }
  const pdSoma = (ids, M, n) => { let v = 0, s = 0; ids.forEach(id => { for (let d = 1; d <= n; d++){ const c = (M[id] || {})[d]; if (c){ v += c[0]; s += c[1]; } } }); return { v, s }; };
  function pdPill(p, m){
    if (p == null) return '<span class="pl nd">sem visitas</span>';
    if (m == null) return '<span class="pl nd">'+pf1(p)+'</span>';
    return '<span class="pl '+(p >= m ? 'ok' : 'no')+'">'+(p >= m ? '+' : '−')+Math.abs(p - m).toLocaleString('pt-BR', { maximumFractionDigits: 1 })+' pp</span>';
  }

  /* ----- planilha do mês ----- */
  async function planCarregar(){
    pdMarcar(); $('#area').style.gridTemplateColumns = 'minmax(0,1fr)';
    $('#area').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const e0 = await pdBase(); if (e0){ pdErro(e0); return; }
    if (!PD.clin){ pdVazio(); return; }
    const n = pdN(PD.ano, PD.mes), de = pdIso(PD.ano, PD.mes, 1), ate = pdIso(PD.ano, PD.mes, n), tk = ++PD.tk;
    const rs = await Promise.all([sb.rpc('equipe_clinica', { p_clinica: PD.clin, p_de: de, p_ate: ate }),
      sb.from('planilha_diaria').select('*').eq('clinica_id', PD.clin).gte('data_ref', de).lte('data_ref', ate).limit(5000),
      sb.rpc('conferencia_corrida', { p_clinica: PD.clin, p_de: de, p_ate: ate }), pdExtras()]);
    if (tk !== PD.tk) return;
    const er = rs.slice(0, 3).map(r => r.error).find(Boolean); if (er){ pdErro(er); return; }
    const M = {}, lanc = {}, C = {};
    rs[1].data.forEach(r => { const d = Number(String(r.data_ref).slice(8)), k = pdChave(r.usuario_id, r.cargo); (M[k] = M[k] || {})[d] = [r.visitas, r.vendas]; lanc[d] = true; });
    (rs[2].data || []).forEach(c => { C[c.usuario_id+'|'+Number(String(c.data_ref).slice(8))] = c; });
    const pes = pdExpandir(rs[0].data, rs[3]).filter(p => p.ativo || M[p.id]);
    PD.mapa = { M, lanc, C, pes, n };
    planDesenhar();
  }

  function planDesenhar(){
    const { M, lanc, C, pes, n } = PD.mapa, hj = hoje(), ehHj = d => pdIso(PD.ano, PD.mes, d) === hj, SEM = ['D','S','T','Q','Q','S','S'];
    const div = pes.filter(p => p.cargo === 'Divulgador'), ou = pes.filter(p => p.cargo !== 'Divulgador');
    const ids = a => a.map(p => p.id), idsC = c => ids(pes.filter(p => p.cargo === c));
    const tdiv = pdSoma(ids(div), M, n), rua = pdSoma(idsC('Promotor').concat(idsC('Luminoso'), idsC(TESTE), idsC('Indicação')), M, n), tele = pdSoma(idsC('Tele BH').concat(idsC('Tele interno')), M, n), todos = pdSoma(ids(ou), M, n);
    const mdiv = pdMetaDiv(pes, M, ids(div), n), rp = pdPct(rua.v, rua.s), tp = pdPct(tele.v, tele.s);
    const cards = [['Eficiência da clínica', pdPct(todos.v, todos.s), mdiv, todos], ['Promotores, teste e Luminoso', rp, 30, rua], ['Teles (BH e interno)', tp, 45, tele], ['Divulgadores', pdPct(tdiv.v, tdiv.s), mdiv, tdiv]];
    const placar = '<div class="pd-placar">'+cards.map(c => '<div class="pd-pc"><div class="k"><span>'+c[0]+'</span>'+pdPill(c[1], c[2])+'</div><div class="v">'+pf1(c[1]).replace('%','')+'<small>%</small></div>'
      + '<div class="b" title="Escala de 0 a 60%"><i style="width:'+Math.min(100, (c[1] || 0) / 60 * 100)+'%"></i>'+(c[2] != null ? '<u style="left:calc('+Math.min(100, c[2] / 60 * 100)+'% - 1px)"></u>' : '')+'</div>'
      + '<div class="f">Meta '+(c[2] != null ? pf1(c[2]) : '—')+' · '+c[3].s+' vendas · '+c[3].v+' visitas</div></div>').join('')+'</div>';

    const dvs = [];
    Object.keys(C).forEach(k => { const c = C[k], d = Number(k.split('|')[1]); if (d >= 1 && d <= n && pdIso(PD.ano, PD.mes, d) <= hj && (c.visitas_planilha !== c.visitas_corrida || c.vendas_planilha !== c.vendas_corrida)) dvs.push({ p: pes.find(x => x.id === c.usuario_id), d, c }); });
    dvs.sort((a, b) => a.d - b.d);
    const aviso = '<div class="pd-card pd-div">'+(dvs.length
      ? '<details><summary><span class="pl no">'+dvs.length+' divergência'+(dvs.length === 1 ? '' : 's')+' com a corrida</span> A planilha e a corrida precisam mostrar os mesmos números de cada pessoa no dia.</summary><ul>'
        + dvs.map(x => '<li><b>'+esc(x.p ? x.p.nome : '#'+x.c.usuario_id)+'</b> em '+pd2(x.d)+'/'+pd2(PD.mes + 1)+': planilha '+x.c.visitas_planilha+' vis. / '+x.c.vendas_planilha+' ven., corrida '+x.c.visitas_corrida+' vis. / '+x.c.vendas_corrida+' ven.</li>').join('')+'</ul></details>'
      : '<span class="pl ok">Sem divergências</span> Planilha e corrida mostram os mesmos números neste mês.')+'</div>';

    const exd = {}; for (let d = 1; d <= n; d++){ if (!lanc[d]) continue; let a0 = 0, a1 = 0, b0 = 0, b1 = 0;
      pes.forEach(p => { const x = (M[p.id] || {})[d]; if (!x) return; if (p.cargo === 'Divulgador'){ b0 += x[0]; b1 += x[1]; } else { a0 += x[0]; a1 += x[1]; } });
      if (a0 !== b0 || a1 !== b1) exd[d] = 'Divulgadores: '+b0+' vis. / '+b1+' ven. · Promotores e teles: '+a0+' vis. / '+a1+' ven.'; }
    const nex = Object.keys(exd).length;
    const aviso2 = '<div class="pd-card pd-div">'+(nex ? '<details><summary><span class="pl no ex"><b>!</b> '+nex+' dia'+(nex === 1 ? '' : 's')+' com totais diferentes</span> Divulgadores e promotores/teles deveriam somar o mesmo. Corrija pelo Lançamento diário.</summary><ul>'
        + Object.keys(exd).map(d => '<li><b>'+pd2(d)+'/'+pd2(PD.mes + 1)+'</b>: '+esc(exd[d])+'</li>').join('')+'</ul></details>'
      : '<span class="pl ok">Totais iguais</span> Divulgadores e promotores/teles somam o mesmo em todos os dias lançados.')+'</div>';

    let h = '<table class="pd" style="width:'+(168 + n * 50 + 240)+'px"><colgroup><col style="width:168px">'+new Array(n + 1).join('<col style="width:50px">')+'<col style="width:54px"><col style="width:54px"><col style="width:70px"><col style="width:62px"></colgroup><thead><tr><th class="nm">Pessoa</th>';
    for (let d = 1; d <= n; d++){ const w = new Date(PD.ano, PD.mes, d).getDay(); h += '<th class="'+(w === 0 ? 'dom' : '')+(ehHj(d) ? ' hj' : '')+'"'+(exd[d] ? ' title="'+esc(exd[d])+'"' : '')+'>'+d+(exd[d] ? '<b class="exm">!</b>' : '')+'<small>'+SEM[w]+'</small></th>'; }
    h += '<th class="rt r1">Vis.</th><th class="rt r2">Ven.</th><th class="rt r3">%</th><th class="rt r4">Meta</th></tr></thead><tbody>';
    const grupo = (tit, arr, meta) => { const t = pdSoma(ids(arr), M, n), pc = pdPct(t.v, t.s);
      return '<tr class="gr"><td class="nm">'+tit+'</td><td colspan="'+n+'"></td><td class="rt r1">'+t.v+'</td><td class="rt r2">'+t.s+'</td><td class="rt r3">'+(pc == null ? '–' : '<span class="pl '+(meta != null && pc >= meta ? 'ok' : 'no')+'">'+pf0(pc)+'</span>')+'</td><td class="rt r4">'+(meta != null ? pf0(meta) : '')+'</td></tr>'; };
    const linha = (p, meta, conf) => {
      const agg = p.id === 'teste', t = pdSoma([p.id], M, n), pc = pdPct(t.v, t.s); let tds = '';
      for (let d = 1; d <= n; d++){
        const c = (M[p.id] || {})[d], w = new Date(PD.ano, PD.mes, d).getDay() === 0, cf = conf && (agg ? CT[d] : C[p.u+'|'+d]);
        const dv = cf && pdIso(PD.ano, PD.mes, d) <= hj && (cf.visitas_planilha !== cf.visitas_corrida || cf.vendas_planilha !== cf.vendas_corrida);
        tds += '<td class="c'+(c ? '' : ' z')+(w ? ' dom' : '')+(ehHj(d) ? ' hj' : '')+(dv ? ' dv' : '')+'"'+(dv ? ' title="Corrida: '+cf.visitas_corrida+' visitas / '+cf.vendas_corrida+' vendas"' : '')+'>'+(c ? c[0]+' / '+c[1] : '·')+'</td>';
      }
      return '<tr class="'+(p.ativo ? '' : 'in')+(agg ? ' agg' : '')+(p.sub ? ' sub' : '')+'"><td class="nm" title="'+esc(p.nome)+'">'+(agg ? '<button type="button" class="pd-exp" data-teste="mes" aria-expanded="'+PD.testeMes+'" aria-label="Mostrar cada promotor de teste">'+(PD.testeMes ? '▾' : '▸')+'</button>' : '<span class="pd-tag'+(p.ativo ? ' a' : '')+'">'+(p.ativo ? 'A' : 'I')+'</span>')+esc(p.nome)+'</td>'+tds+'<td class="rt r1">'+(t.v || '–')+'</td><td class="rt r2">'+(t.v ? t.s : '–')+'</td><td class="rt r3">'+(pc == null ? '–' : '<span class="pl '+(meta != null && pc >= meta ? 'ok' : 'no')+'">'+pf0(pc)+'</span>')+'</td><td class="rt r4">'+(meta != null ? pf0(meta) : '–')+'</td></tr>';
    };
    const vis = a => PD.inativos ? a : a.filter(p => p.ativo);
    const teste = pes.filter(p => p.cargo === TESTE), CT = {};
    if (teste.length){ const mt = {}; for (let d = 1; d <= n; d++){ let v = 0, s = 0, v2 = 0, s2 = 0, tem = false;
        teste.forEach(p => { const c = (M[p.id] || {})[d], cf = C[p.u+'|'+d]; if (c){ v += c[0]; s += c[1]; tem = true; } if (cf){ v2 += cf.visitas_corrida; s2 += cf.vendas_corrida; } });
        if (tem) mt[d] = [v, s]; CT[d] = { visitas_planilha: v, vendas_planilha: s, visitas_corrida: v2, vendas_corrida: s2 }; } M.teste = mt; }
    h += grupo('Divulgadores', div, mdiv);
    vis(div).forEach(p => { h += linha(p, pdMetaDiv(pes, M, [p.id], n), false); });
    PD_ORDEM.forEach(cg => { const a = pes.filter(p => p.cargo === cg); if (!a.length) return; h += grupo(PD_ROT[cg], a, PD_META[cg]); vis(a).forEach(p => { h += linha(p, PD_META[cg], true); }); });
    if (teste.length){ h += linha({ id: 'teste', nome: 'Promotores de teste ('+teste.length+')', ativo: true }, 30, true);
      if (PD.testeMes) vis(teste).forEach(p => { h += linha(Object.assign({}, p, { sub: true }), 30, true); }); }
    const tot = (rot, arr) => { const t = pdSoma(ids(arr), M, n); let tds = '';
      for (let d = 1; d <= n; d++){ let v = 0, s = 0; arr.forEach(p => { const c = (M[p.id] || {})[d]; if (c){ v += c[0]; s += c[1]; } }); tds += '<td class="c'+(lanc[d] ? '' : ' z')+(new Date(PD.ano, PD.mes, d).getDay() === 0 ? ' dom' : '')+'">'+(lanc[d] ? v+' / '+s : '·')+'</td>'; }
      return '<tr class="tot"><td class="nm">'+rot+'</td>'+tds+'<td class="rt r1">'+t.v+'</td><td class="rt r2">'+t.s+'</td><td class="rt r3">'+pf0(pdPct(t.v, t.s))+'</td><td class="rt r4"></td></tr>'; };
    h += tot('Total divulgadores', div)+tot('Total promotores e teles', ou);
    h += '<tr class="tot"><td class="nm">Meta do divulgador no dia</td>';
    for (let d = 1; d <= n; d++){ const m = pdMetaDia(pes, M, d); h += '<td class="c'+(m == null ? ' z' : '')+(new Date(PD.ano, PD.mes, d).getDay() === 0 ? ' dom' : '')+'">'+(m == null ? '·' : pf0(m))+'</td>'; }
    h += '<td class="rt r1"></td><td class="rt r2"></td><td class="rt r3"></td><td class="rt r4">'+pf0(mdiv)+'</td></tr></tbody></table>';

    $('#area').innerHTML = '<div class="pd-card" style="padding:16px 18px"><div class="pd-bar"><div><h2 style="margin:0">Planilha do mês</h2><p class="sub" style="margin:2px 0 0">Visitas / vendas de início de cada pessoa, dia a dia.</p></div>'
      + '<div class="grp">'+pdSelClin()+'<div class="pd-mes"><button type="button" id="pd-ant" aria-label="Mês anterior">‹</button><b>'+new Date(PD.ano, PD.mes, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })+'</b><button type="button" id="pd-prox" aria-label="Próximo mês">›</button></div></div></div>'
      + placar+aviso+aviso2+'<div class="pd-card"><div class="pd-scroll">'+h+'</div><div class="pd-leg"><label class="chk" for="pd-ver-in" style="min-height:0;padding:6px 12px"><input type="checkbox" id="pd-ver-in"'+(PD.inativos ? ' checked' : '')+'><span>Mostrar inativos (I)</span></label><span>"·" = dia sem lançamento</span><span>Vermelho = diferente da corrida</span><span>Inativos continuam somando no %</span><span>Promotores de teste somam numa linha só: clique na seta para ver cada um</span></div></div>';
    const hojeD = hoje(); $('#pd-prox').disabled = PD.ano === Number(hojeD.slice(0, 4)) && PD.mes >= Number(hojeD.slice(5, 7)) - 1;
    $('#pd-clin').addEventListener('change', e => { PD.clin = Number(e.target.value); planCarregar(); });
    $('#pd-ant').addEventListener('click', () => { PD.mes--; if (PD.mes < 0){ PD.mes = 11; PD.ano--; } planCarregar(); });
    $('#pd-prox').addEventListener('click', () => { PD.mes++; if (PD.mes > 11){ PD.mes = 0; PD.ano++; } planCarregar(); });
    $('#pd-ver-in').addEventListener('change', e => { PD.inativos = e.target.checked; planDesenhar(); });
    const ex = $('[data-teste=mes]'); if (ex) ex.addEventListener('click', () => { PD.testeMes = !PD.testeMes; planDesenhar(); });
  }

  /* ----- lançamento diário ----- */
  async function diaCarregar(){
    pdMarcar(); $('#area').style.gridTemplateColumns = 'minmax(0,1fr)';
    $('#area').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const e0 = await pdBase(); if (e0){ pdErro(e0); return; }
    if (!PD.clin){ pdVazio(); return; }
    const dt = PD.data, tk = ++PD.tk;
    const rs = await Promise.all([sb.rpc('equipe_clinica', { p_clinica: PD.clin, p_de: dt, p_ate: dt }),
      sb.from('planilha_diaria').select('*').eq('clinica_id', PD.clin).eq('data_ref', dt),
      sb.rpc('conferencia_corrida', { p_clinica: PD.clin, p_de: dt, p_ate: dt }), pdExtras()]);
    if (tk !== PD.tk) return;
    const er = rs.slice(0, 3).map(r => r.error).find(Boolean); if (er){ pdErro(er); return; }
    const ex = {}; rs[1].data.forEach(r => { ex[pdChave(r.usuario_id, r.cargo)] = [r.visitas, r.vendas]; });
    PD.existe = rs[1].data.length > 0;
    PD.pessoas = pdExpandir(rs[0].data, rs[3]).filter(p => p.ativo || ex[p.id]);
    PD.r = {}; PD.pessoas.forEach(p => { PD.r[p.id] = ex[p.id] ? ex[p.id].slice() : [0, 0]; });
    PD.corr = {}; (rs[2].data || []).forEach(c => { PD.corr[c.usuario_id] = [c.visitas_corrida, c.vendas_corrida]; });
    diaDesenhar();
  }

  function pdLinha(p, comCorr){
    const v = PD.r[p.id];
    return '<div class="pd-row'+(comCorr ? '' : ' dv2')+'"><div style="min-width:0;font-weight:600">'+esc(p.nome)+(p.ativo ? '' : ' <span class="pd-tag">I</span>')+'</div>'
      + '<input type="number" min="0" inputmode="numeric" id="pd-v-'+p.id+'" data-p="'+p.id+'" data-i="0" value="'+v[0]+'" aria-label="Visitas de '+esc(p.nome)+'">'
      + '<input type="number" min="0" inputmode="numeric" id="pd-s-'+p.id+'" data-p="'+p.id+'" data-i="1" value="'+v[1]+'" aria-label="Vendas de '+esc(p.nome)+'">'
      + (comCorr ? '<span id="pd-c-'+p.id+'"></span>' : '')+'</div>';
  }

  function diaDesenhar(){

  function diaConf(){
    const div = PD.pessoas.filter(p => p.cargo === 'Divulgador'), ou = PD.pessoas.filter(p => p.cargo !== 'Divulgador');
    const S = a => a.reduce((t, p) => [t[0] + PD.r[p.id][0], t[1] + PD.r[p.id][1]], [0, 0]), a = S(ou), b = S(div);
    ou.forEach(p => { const el = $('#pd-c-'+p.id), c = PD.corr[p.u] || [0, 0], r = PD.r[p.id], ok = c[0] === r[0] && c[1] === r[1];
      if (el) el.innerHTML = ok ? (c[0] || c[1] ? '<span class="pl ok">Bate</span>' : '<span class="pl nd">—</span>') : '<span class="pl no" title="Lançado na corrida">'+c[0]+' vis. / '+c[1]+' ven.</span>'; });
    const tele = ou.filter(p => p.cargo === 'Tele BH' || p.cargo === 'Tele interno').reduce((t, p) => t + PD.r[p.id][0], 0), rua = a[0] - tele;
    const meta = a[0] > 0 ? (rua * 30 + tele * 45) / a[0] : null;
    const okV = a[0] === b[0], okS = a[1] === b[1], semDiv = !div.length && a[0] > 0;

    $('#pd-conf').innerHTML = '<div class="lin"><span>Promotores e teles: <b>'+a[0]+'</b> vis. / <b>'+a[1]+'</b> ven.</span><span>Divulgadores: <b>'+b[0]+'</b> vis. / <b>'+b[1]+'</b> ven.</span>'
      + (!difere ? '<span class="pl ok">Totais conferem</span>' : '<span class="pl no ex" title="Divulgadores e promotores/teles deveriam somar o mesmo. Pode salvar assim, mas o dia fica marcado com !"><b>!</b> '+(!okV ? 'Visitas '+dif(a[0], b[0]) : '')+(!okV && !okS ? ' · ' : '')+(!okS ? 'Vendas '+dif(a[1], b[1]) : '')+(semDiv ? 'Falta divulgador' : '')+'</span>')
      + '<span>Meta do divulgador hoje: <b>'+pf1(meta)+'</b></span>'

  /* ---------- ranking de vendas (vem da planilha diária) ---------- */
  const RK = { de: '', ate: '', per: 'mes', clin: '', teste: false, tk: 0 };

  const rkIso = d => d.toLocaleDateString('sv-SE');
  function rkPeriodo(k){
    const h = new Date(hoje()+'T12:00:00'), d = new Date(h);
    if (k === 'hoje') return [rkIso(h), rkIso(h)];
    if (k === 'ontem'){ d.setDate(d.getDate() - 1); return [rkIso(d), rkIso(d)]; }
    if (k === 'semana' || k === 'semana-ant'){ d.setDate(h.getDate() - ((h.getDay() + 6) % 7) - (k === 'semana-ant' ? 7 : 0)); const f = new Date(d); f.setDate(d.getDate() + 6); return [rkIso(d), k === 'semana' ? rkIso(h) : rkIso(f)]; }
    if (k === 'mes-ant') return [rkIso(new Date(h.getFullYear(), h.getMonth() - 1, 1)), rkIso(new Date(h.getFullYear(), h.getMonth(), 0))];
    return [rkIso(new Date(h.getFullYear(), h.getMonth(), 1)), rkIso(h)];
  }
  const RK_ROT = [['hoje', 'Hoje'], ['ontem', 'Ontem'], ['semana', 'Esta semana'], ['semana-ant', 'Semana passada'], ['mes', 'Este mês'], ['mes-ant', 'Mês passado']];

    const c = n === 2 ? ['#f7f9fb', '#aab4c0', '#6b7683', 'prata'] : ['#f0b27a', '#b36a2a', '#7a4417', 'bronze'];
    return '<svg class="vr-ic" viewBox="0 0 64 64" aria-label="Medalha de '+c[3]+'" role="img"><defs><linearGradient id="vrm'+n+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs>'

  async function rankCarregar(){
    $('#area').style.gridTemplateColumns = 'minmax(0,1fr)';
    $('#area').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const e0 = await pdBase(); if (e0){ pdErro(e0); return; }

    const set = (de, ate, per) => { RK.de = de; RK.ate = ate; RK.per = per; $('#rk-de').value = de; $('#rk-ate').value = ate; $$('#rk-q button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.per === per))); rankAtualizar(); };

  async function rankAtualizar(){
    const alvo = $('#rk-res'); if (!alvo) return;
    if (!RK.de || !RK.ate || RK.de > RK.ate){ alvo.innerHTML = '<div class="card"><div class="err">A data inicial precisa ser igual ou anterior à data final.</div></div>'; return; }
    const tk = ++RK.tk; alvo.innerHTML = '<div class="card"><p class="sub">Calculando...</p></div>';
    let rows = [];
    for (let de = 0; ; de += 1000){
      let q = sb.from('planilha_diaria').select('*').gte('data_ref', RK.de).lte('data_ref', RK.ate);
      if (RK.clin) q = q.eq('clinica_id', Number(RK.clin));
      const r = await q.order('data_ref').order('usuario_id').order('clinica_id').range(de, de + 999);
      if (tk !== RK.tk) return;
      if (r.error){ alvo.innerHTML = '<div class="card"><div class="err">'+esc(msgErro(r.error))+'</div></div>'; return; }
      rows = rows.concat(r.data || []);
      if (!r.data || r.data.length < 1000) break;
    }
    const [us, cs] = await Promise.all([sb.from('usuarios').select('id,nome,cargo,foto_url,ativo'), sb.from('clinicas').select('id,sigla')]);
    if (tk !== RK.tk) return;
    if (us.error){ alvo.innerHTML = '<div class="card"><div class="err">'+esc(msgErro(us.error))+'</div></div>'; return; }
    const U = {}; (us.data || []).forEach(u => { U[u.id] = u; });
    const SG = {}; (cs.data || []).forEach(c => { SG[c.id] = c.sigla; });
    const A = {};
    rows.forEach(r => { const u = U[r.usuario_id], cgl = r.cargo || (u && u.cargo); if (!u || !(RK_CARGOS.includes(cgl) || (RK.teste && cgl === TESTE))) return;
      const a = A[r.usuario_id] = A[r.usuario_id] || { u, v: 0, s: 0, cl: {} }; a.v += r.visitas; a.s += r.vendas; a.cl[r.clinica_id] = (a.cl[r.clinica_id] || 0) + r.visitas + r.vendas; });
    const lista = Object.values(A).filter(a => a.v > 0 || a.s > 0).map(a => Object.assign(a, { pc: a.v > 0 ? 100 * a.s / a.v : -1 }))
      .sort((x, y) => y.s - x.s || y.pc - x.pc || y.v - x.v || String(x.u.nome).localeCompare(String(y.u.nome), 'pt-BR'));
    const sub = a => Object.keys(a.cl).sort((x, y) => a.cl[y] - a.cl[x]).map(id => SG[id] || '#'+id).join(', ') + (a.u.cargo ? ' · '+a.u.cargo : '');
    const tv = lista.reduce((t, a) => t + a.v, 0), ts = lista.reduce((t, a) => t + a.s, 0);
    const per = dBR(RK.de) === dBR(RK.ate) ? dBR(RK.de) : dBR(RK.de)+' a '+dBR(RK.ate);
    if (!lista.length){ alvo.innerHTML = '<div class="card"><div class="empty">Sem lançamentos de vendas e visitas entre '+esc(per)+'.</div></div>'; return; }
    const card = (a, n) => '<div class="vr-card p'+n+'" data-pos="'+n+'">'+rkIcone(n)+rkAvatar(a.u, 'vr-av')+'<div class="vr-nm" title="'+esc(a.u.nome)+'">'+esc(a.u.nome)+'</div><div class="vr-sub">'+esc(sub(a))+'</div>'
      + '<div class="vr-big">'+a.s+'<small>vendas</small></div><div class="vr-mini"><span><b>'+(a.pc < 0 ? '—' : pf1(a.pc))+'</b> fechamento</span><span><b>'+a.v+'</b> visitas</span></div></div>';
    const topo = lista.slice(0, 3), ordem = [topo[1], topo[0], topo[2]], pos = [2, 1, 3];
    let h = '<div class="pd-card" style="padding:16px 18px"><p class="sub" style="margin:0 0 12px">'+esc(per)+' · '+lista.length+' pessoa'+(lista.length === 1 ? '' : 's')+' · '+ts+' vendas em '+tv+' visitas ('+(tv ? pf1(100 * ts / tv) : '—')+')</p>'
      + '<div class="vr-pod" id="rk-pod">'+ordem.map((a, i) => a ? card(a, pos[i]) : '').join('')+'</div></div>';
    if (lista.length > 3){
      h += '<div class="pd-card" style="padding:16px 18px;margin-top:14px"><div class="vr-row h"><span>#</span><span></span><span>Pessoa</span><span>Vendas</span><span>Visitas</span><span>%</span></div>'
        + lista.slice(3).map((a, i) => '<div class="vr-row" data-pos="'+(i + 4)+'"><span class="pos">'+(i + 4)+'º</span>'+rkAvatar(a.u, 'av2')+'<div style="min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.u.nome)+'</b><span class="vr-sub">'+esc(sub(a))+'</span></div><span class="n">'+a.s+'</span><span class="n">'+a.v+'</span><span class="n">'+(a.pc < 0 ? '—' : pf1(a.pc))+'</span></div>').join('')+'</div>';
    }
    alvo.innerHTML = h;
  }

  const DS = { ano: 0, mes: 0, tk: 0, base: null, geo: null, proj: null, filtro: null, vb: null, full: null, anim: 0, nomes: {} };

  const IBGE = 'https://servicodados.ibge.gov.br/api/';

  async function ibgeJson(u){ const r = await fetch(IBGE+u); if (!r.ok) throw new Error('IBGE '+r.status); return r.json(); }
  async function cacheado(chave, buscar){
    const l = lerLS(chave); if (l){ try { return JSON.parse(l); } catch (e) {} }

  }
  const arred = n => Math.round(n * 1000) / 1000;
  const polis = g => !g ? [] : g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
  const mgMunicipios = () => cacheado('mg-mun-v1', async () => (await ibgeJson('v1/localidades/estados/31/municipios')).map(m => {

  const compactar = fs => fs.map(f => ({ key: f.key, polys: f.polys.map(p => p.map(r => r.map(c => [arred(c[0]), arred(c[1])]))) }));
  async function malha(url){ const j = await ibgeJson(url); return (j.features || []).map(f => ({ key: String((f.properties || {}).codarea || ''), polys: polis(f.geometry) })); }
  /* Tenta o contorno pronto das regiões intermediárias; se o IBGE não entregar, monta as regiões juntando as cidades. */
  const mgContorno = () => cacheado('mg-geo-v2', async () => {
    const muns = await mgMunicipios(), rids = new Set(muns.map(m => String(m.rid)));
    const tentativas = ['v4/malhas/estados/31?intrarregiao=regiao-intermediaria&qualidade=minima&formato=application/vnd.geo+json', 'v3/malhas/estados/31?intrarregiao=intermediaria&qualidade=minima&formato=application/vnd.geo+json'];
    for (const u of tentativas){
      try { const f = await malha(u); if (f.length >= 2 && f.every(x => rids.has(x.key))) return compactar(f); } catch (e) { /* tenta a próxima */ }
    }
    const cid = await malha('v3/malhas/estados/31?intrarregiao=municipio&qualidade=minima&formato=application/vnd.geo+json');
    const porId = {}; muns.forEach(m => { porId[String(m.id)] = m; porId[String(m.id).slice(0, 6)] = m; });

    const lista = Object.values(reg); if (lista.length < 2) throw new Error('contorno indisponível');

  function centroideRing(r){ let a = 0, x = 0, y = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++){ const f = r[j][0] * r[i][1] - r[i][0] * r[j][1]; a += f; x += (r[j][0] + r[i][0]) * f; y += (r[j][1] + r[i][1]) * f; } a /= 2; return a ? [x / (6 * a), y / (6 * a)] : r[0]; }

  async function buscarPlanilha(de, ate){

  /* ---- projeção e geometria do mapa ---- */
  function mapaPreparar(){
    const pts = [], reg = DS.geo ? DS.geo.reg : [];
    reg.forEach(r => r.polys.forEach(p => p[0].forEach(c => pts.push(c))));
    DS.base.forEach(o => { if (o.c.latitude != null && o.c.longitude != null) pts.push([Number(o.c.longitude), Number(o.c.latitude)]); });

    pts.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    if (x1 - x0 < 1){ const m = (x0 + x1) / 2; x0 = m - .5; x1 = m + .5; } if (y1 - y0 < 1){ const m = (y0 + y1) / 2; y0 = m - .5; y1 = m + .5; }
    const k = Math.cos(((y0 + y1) / 2) * Math.PI / 180) * 100, W = (x1 - x0) * k, H = (y1 - y0) * 100, pad = Math.max(W, H) * .03;
    const px = lng => (lng - x0) * k + pad, py = lat => (y1 - lat) * 100 + pad;
    DS.proj = { px, py, W: W + 2 * pad, H: H + 2 * pad };

    DS.regs = reg.map(r => {
      const d = r.polys.map(p => p.map(a => 'M'+a.map(c => px(c[0]).toFixed(1)+','+py(c[1]).toFixed(1)).join('L')+'Z').join('')).join('');
      const todos = r.polys.reduce((t, p) => t.concat(p[0]), []).map(c => [px(c[0]), py(c[1])]);
      const bx = [Math.min(...todos.map(c => c[0])), Math.min(...todos.map(c => c[1])), Math.max(...todos.map(c => c[0])), Math.max(...todos.map(c => c[1]))];
      return { key: r.key, polys: r.polys, d, bbox: bx, nome: DS.nomes[r.key] || '' };
    });
    DS.base.forEach(o => {
      const c = o.c; o.x = o.y = null; o.reg = '';
      if (c.latitude == null || c.longitude == null) return;

  }

  const ptsDe = ids => DS.base.filter(o => o.x != null && (!ids || ids.has(o.c.id)));
  function caixa(pontos, minimo){
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; pontos.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[2] == null ? p[0] : p[2]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[3] == null ? p[1] : p[3]); });

  function mapaIr(box, instante){

  function mapaEventos(svg){

    };
    svg.addEventListener('pointerup', fim);
    svg.addEventListener('pointercancel', () => { ini = null; arrasto = false; $('#ds-sel').hidden = true; });
    document.addEventListener('keydown', function esc1(e){ if (!$('#ds-svg')){ document.removeEventListener('keydown', esc1); return; } if (e.key === 'Escape' && DS.filtro) filtrar(null); });
    window.addEventListener('resize', aplicarVb);
  }


  /* ---- números consolidados ao lado do mapa, de acordo com o que está em foco ---- */
  const nomeCurto = n => String(n || 'Região').replace(/^Região (Geográfica )?(Intermediária de )?/, '');
  function ladoDesenhar(){
    const el = $('#ds-lado'); if (!el) return; const f = DS.filtro;
    const em = DS.base.filter(o => !f || f.ids.has(o.c.id)), V = em.reduce((t, o) => t + o.v, 0), S = em.reduce((t, o) => t + o.s, 0), pc = pdPct(V, S);
    const titulo = !f ? 'Minas Gerais' : f.rotulo, sub = !f ? 'Todas as clínicas' : (f.tipo === 'regiao' ? 'Região em foco' : (f.ids.size === 1 ? 'Clínica em foco' : 'Clínicas selecionadas'));
    let lista = '';
    if (!f){
      const gr = {}; DS.base.forEach(o => { if (o.x == null || !o.reg) return; const g = gr[o.reg] = gr[o.reg] || { v: 0, s: 0, n: 0 }; g.v += o.v; g.s += o.s; g.n++; });
      const rows = Object.keys(gr).map(k => { const r = (DS.regs || []).find(x => x.key === k); return { k, nome: nomeCurto(r && r.nome), n: gr[k].n, v: gr[k].v, s: gr[k].s, pct: pdPct(gr[k].v, gr[k].s) }; }).sort((a, b) => b.v - a.v);
      lista = rows.length ? '<h3>Por região</h3><ul class="ds-li">'+rows.map(r => '<li><button type="button" data-lreg="'+esc(r.k)+'"><span class="n"><b>'+esc(r.nome)+'</b><small>'+r.n+' clínica'+(r.n === 1 ? '' : 's')+'</small></span><span class="v">'+r.v+' vis · '+r.s+' ven</span><span class="p">'+pf0(r.pct)+'</span></button></li>').join('')+'</ul>' : '';
    } else if (em.length > 1 || f.tipo === 'regiao'){
      const rows = em.slice().sort((a, b) => b.v - a.v);
      lista = '<h3>Clínicas</h3><ul class="ds-li">'+rows.map(o => '<li><button type="button" data-lcli="'+o.c.id+'"><span class="n"><b>'+esc(o.c.sigla)+'</b><small>'+esc(o.c.cidade || o.c.nome)+'</small></span><span class="v">'+o.v+' vis · '+o.s+' ven</span><span class="p">'+pf0(pdPct(o.v, o.s))+'</span></button></li>').join('')+'</ul>';
    }
    el.innerHTML = '<div class="ds-tot"><span class="eyebrow">'+esc(sub)+'</span><h3 class="ds-tt">'+esc(titulo)+'</h3>'
      + '<div class="ds-tg"><div><span>Visitas</span><b>'+V.toLocaleString('pt-BR')+'</b></div><div><span>Vendas</span><b>'+S.toLocaleString('pt-BR')+'</b></div></div>'
      + '<div class="ds-pc"><span>% de fechamento</span><b>'+pf1(pc)+'</b></div><small>'+em.length+' clínica'+(em.length === 1 ? '' : 's')+' · '+esc(new Date(DS.ano, DS.mes, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }))+'</small></div>'+lista;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('#ds-lado button'); if (!b) return;
    if (b.dataset.lreg){ const chave = b.dataset.lreg, ids = new Set(DS.base.filter(o => o.reg === chave).map(o => o.c.id)), r = (DS.regs || []).find(x => x.key === chave); filtrar({ tipo: 'regiao', chave, ids, rotulo: 'Região '+nomeCurto(r && r.nome) }); }
    else if (b.dataset.lcli){ const o = DS.base.find(x => String(x.c.id) === b.dataset.lcli); if (o) filtrar({ tipo: 'sel', ids: new Set([o.c.id]), rotulo: o.c.sigla+' · '+o.c.nome }); }
  });

  function inicioPaineis(){
    const f = DS.filtro, L = DS.base.filter(o => !f || f.ids.has(o.c.id)).map(o => { const dd = Object.keys(o.d).filter(k => o.d[k][0] > 0).length;
      return { c: o.c, v: o.v, s: o.s, dias: dd, mv: dsMedia(o.v, dd), ms: dsMedia(o.s, dd), pct: pdPct(o.v, o.s), d: o.d }; });
    const dias = {}; L.forEach(x => { Object.keys(x.d).forEach(k => { (dias[k] = dias[k] || [0, 0]); dias[k][0] += x.d[k][0]; dias[k][1] += x.d[k][1]; }); });
    const n = DS.n, V = L.reduce((t, x) => t + x.v, 0), S = L.reduce((t, x) => t + x.s, 0), dr = Object.keys(dias).filter(k => dias[k][0] > 0).length;
    const comDados = L.filter(x => x.pct != null), pmed = comDados.length ? comDados.reduce((t, x) => t + x.pct, 0) / comDados.length : null;
    const maxV = Math.max(1, ...Object.values(dias).map(x => x[0]));
    L.sort((a, b) => (b.pct == null ? -1 : b.pct) - (a.pct == null ? -1 : a.pct) || b.v - a.v);
    $('#ds-info').textContent = (f ? f.rotulo+': ' : 'Todas as clínicas ativas: ')+'dados da planilha diária. Divulgadores ficam de fora para não contar a mesma visita duas vezes.';
    const k = (rot, val, un, fo, dest) => '<div class="ds-k'+(dest ? ' destaque' : '')+'"><div class="k">'+rot+'</div><div class="v">'+val+(un ? '<small>'+un+'</small>' : '')+'</div><div class="f">'+fo+'</div></div>';
    let graf = '';
    for (let d = 1; d <= n; d++){ const x = dias[d] || [0, 0];
      graf += '<div class="ds-dia" title="Dia '+d+': '+x[0]+' visitas, '+x[1]+' vendas"><div class="cols"><i class="vi" style="height:'+(x[0] / maxV * 100)+'%"></i><i class="ve" style="height:'+(x[1] / maxV * 100)+'%"></i></div><span>'+(d === 1 || d % 5 === 0 ? d : '')+'</span></div>'; }
    $('#ds-paineis').innerHTML = '<div class="ds-kpis">'
      + k('Visitas das clínicas', V.toLocaleString('pt-BR'), '', L.filter(x => x.v > 0).length+' de '+L.length+' clínicas com lançamento')
      + k('Vendas de início', S.toLocaleString('pt-BR'), '', 'no mês')
      + k('Média de visitas por dia', dsNum(dsMedia(V, dr)), '', dr+' dia'+(dr === 1 ? '' : 's')+' com lançamento')
      + k('Média de vendas por dia', dsNum(dsMedia(S, dr)), '', dr+' dia'+(dr === 1 ? '' : 's')+' com lançamento')
      + k('% de fechamento médio', pf1(pdPct(V, S)).replace('%', ''), '%', 'Média entre as clínicas: '+pf1(pmed), true)
      + '</div>'
      + '<div class="card"><h2>Visitas e vendas por dia</h2><div class="ds-grafico" role="img" aria-label="Gráfico de visitas e vendas por dia">'+graf+'</div><div class="ds-leg"><span><b style="background:color-mix(in srgb,var(--accent) 32%,var(--surface-2))"></b>Visitas</span><span><b style="background:var(--accent)"></b>Vendas de início</span></div></div>'
      + '<div class="card"><h2>Por clínica</h2><div style="overflow-x:auto">'
      + (L.length ? '<table class="tab"><thead><tr><th>Clínica</th><th class="n">Visitas</th><th class="n">Vendas</th><th class="n">Visitas/dia</th><th class="n">Vendas/dia</th><th class="n">% de fechamento</th><th class="n">Dias</th></tr></thead><tbody>'
        + L.map(x => '<tr><td><b>'+esc(x.c.sigla)+'</b> · '+esc(x.c.nome)+'</td><td class="n">'+x.v+'</td><td class="n">'+x.s+'</td><td class="n">'+dsNum(x.mv)+'</td><td class="n">'+dsNum(x.ms)+'</td><td class="n"><span class="barra"><i style="width:'+Math.min(100, (x.pct || 0) / 60 * 100)+'%"></i></span> <b>'+pf1(x.pct)+'</b></td><td class="n">'+x.dias+'</td></tr>').join('')
        + '<tr class="tot"><td>'+(f ? 'Total da seleção' : 'Todas as clínicas')+'</td><td class="n">'+V+'</td><td class="n">'+S+'</td><td class="n">'+dsNum(dsMedia(V, dr))+'</td><td class="n">'+dsNum(dsMedia(S, dr))+'</td><td class="n"><b>'+pf1(pdPct(V, S))+'</b></td><td class="n">'+dr+'</td></tr></tbody></table>'
        : '<div class="empty">Nenhuma clínica ativa. Cadastre em Cadastros › Clínicas.</div>')
      + '</div></div>';
  }


  /* ---------- relatório externo (Looker Studio) dentro do painel ---------- */
  const LOOKER_LINK = 'https://datastudio.google.com/reporting/51710f3a-35d4-49ec-9c0f-37022a0c752c/page/p_td0t1ca4id';
  const lookerEmbed = u => u.replace(/^https:\/\/(datastudio|lookerstudio)\.google\.com\/reporting\//, 'https://lookerstudio.google.com/embed/reporting/');
  function externoCarregar(){
    marcarMenu(); $('#area').style.gridTemplateColumns = 'minmax(0,1fr)';
    $('#area').innerHTML = '<div class="card" style="padding:14px 16px"><div class="pd-bar"><div><h2 style="margin:0">Relatório NUV</h2><p class="sub" style="margin:2px 0 0">Seu relatório do Looker Studio, aberto aqui dentro. Precisa estar com o login do Google que tem acesso a ele.</p></div>'
      + '<div class="grp"><a class="btn ghost sm" href="'+esc(LOOKER_LINK)+'" target="_blank" rel="noopener">Abrir em outra aba</a></div></div>'
      + '<div class="ds-ext"><iframe id="ext-frame" title="Relatório NUV" src="'+esc(lookerEmbed(LOOKER_LINK))+'" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>'
      + '<p class="sub" style="margin:10px 0 0">Se a área acima aparecer em branco ou pedir login, abra em outra aba. Para aparecer aqui, no Looker Studio use <b>Compartilhar › Incorporar relatório › Ativar incorporação</b>.</p></div>';
  }

  /* ---------- entrar, sair, senha ---------- */
  let modoVisao = 'gestor';
  function aplicarModo(recarregar){
    const ger = modoVisao === 'gerente';
    $('#eyebrow').textContent = ger ? 'Painel da gerência' : (eu && eu.papel === 'assistente' ? 'Painel de suporte' : 'Painel do gestor');
    $$('#modo button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === modoVisao));
    $$('#nav button[data-r]').forEach(b => { b.hidden = ger && (b.dataset.r === 'campanhas' || b.dataset.r === 'agenda'); });
    if (ger && (recurso === 'campanhas' || recurso === 'agenda')) recurso = 'inicio';
    PD.clinicas = []; PD.ano = 0;
    if (recarregar) carregar();
  }
  $('#modo').addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (!b || b.dataset.m === modoVisao) return; modoVisao = b.dataset.m; aplicarModo(true); });

  async function aposLogin(){
    if (linkPendente){
      $('#c-titulo').textContent = linkTipo === 'invite' ? 'Bem-vindo! Vamos criar sua senha' : 'Vamos criar uma nova senha';
      view('confirmar'); return;
    }
    const { data: sess } = await sb.auth.getSession();
    if (!sess.session){ view('login'); if (linkVencido) $('#l-err').textContent = 'Este link já foi usado ou venceu. Toque em "Esqueci minha senha" para receber um novo.'; return; }
    if (definindoSenha){ view('senha'); return; }
    const { data, error } = await sb.from('usuarios').select('*').eq('auth_id', sess.session.user.id).maybeSingle();
    if (error || !data){
      await sb.auth.signOut(); view('login');
      $('#l-err').textContent = 'Seu login existe, mas ainda não foi cadastrado no sistema. Fale com o gestor.'; return;
    }
    if (!['gestor', 'gerente', 'assistente'].includes(data.papel)){ location.replace('app/'); return; }
    eu = data; $('#quem').textContent = data.nome; eu.minhas = null;
    if (data.papel === 'gerente'){
      const vv = await sb.from('vinculos_clinica').select('clinica_id,inicio,fim').eq('usuario_id', data.id);
      eu.minhas = (vv.data || []).filter(x => x.inicio <= hoje() && (!x.fim || x.fim >= hoje())).map(x => x.clinica_id);
    }
    $('#modo').hidden = data.papel === 'gerente'; modoVisao = data.papel === 'gerente' ? 'gerente' : 'gestor';
    aplicarModo(false);
    lateral(lerLS('menu-aberto') === '1' && window.innerWidth > 1000); if (!recurso) recurso = 'inicio';
    view('app'); carregar();
  }

  $('#c-ok').addEventListener('click', async () => {
    const b = $('#c-ok'); b.disabled = true; $('#c-err').textContent = '';
    const { error } = await sb.auth.verifyOtp({ token_hash: linkToken, type: linkTipo });
    if (error){
      b.disabled = false; $('#c-ok').hidden = true; $('#c-voltar').hidden = false;
      $('#c-err').textContent = 'Este link já foi usado ou venceu. Na tela de entrada, toque em "Esqueci minha senha" para receber um novo.'; return;
    }
    linkPendente = false; definindoSenha = true; history.replaceState(null, '', location.pathname);
    view('senha');
  });
  $('#c-voltar').addEventListener('click', () => { history.replaceState(null, '', location.pathname); location.reload(); });

  $('#f-login').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#l-email').value.trim(), senha = $('#l-senha').value;
    if (!email || !senha){ $('#l-err').textContent = 'Informe o e-mail e a senha.'; return; }
    $('#l-btn').disabled = true; $('#l-err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    $('#l-btn').disabled = false;
    if (error){ $('#l-err').textContent = msgErro(error); return; }
    $('#l-senha').value = ''; aposLogin();
  });

  $('#l-esqueci').addEventListener('click', async () => {
    const email = $('#l-email').value.trim();
    if (!email){ $('#l-err').textContent = 'Digite seu e-mail acima e toque em "Esqueci minha senha" de novo.'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: enderecoLimpo() });
    $('#l-err').textContent = '';
    toast(error ? msgErro(error) : 'Se o e-mail estiver cadastrado, enviamos um link para criar uma nova senha.');
  });

  $('#f-senha').addEventListener('submit', async e => {
    e.preventDefault();
    const a = $('#s-nova').value, b = $('#s-rep').value;
    if (a.length < 8){ $('#s-err').textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
    if (a !== b){ $('#s-err').textContent = 'As duas senhas não são iguais.'; return; }
    const { error } = await sb.auth.updateUser({ password: a });
    if (error){ $('#s-err').textContent = msgErro(error); return; }
    definindoSenha = false; history.replaceState(null, '', location.pathname);
    toast('Senha criada.'); aposLogin();
  });

  $('#sair').addEventListener('click', async () => { $('#v-app').classList.remove('sem-menu'); await sb.auth.signOut(); eu = null; view('login'); });
  document.addEventListener('keydown', e => {
    if (recurso !== 'agenda' || !$('#ag-palco') || e.target.closest('input, select, textarea') || document.querySelector('.ag-modal')) return;
    if (e.key === 'Escape' && $('#v-app').classList.contains('sem-menu')) agCheia(false);
    else if (e.key === 'ArrowLeft') agNavega(-1); else if (e.key === 'ArrowRight') agNavega(1);
  });

  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY'){ definindoSenha = true; } });
  aposLogin();
})();
</script>
</body>
</html>
