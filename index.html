<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrida de Prêmios OP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f2f4f7; --ink:#14171c; --muted:#59616b; --line:#d6dae0;
  --red:#c40500; --gold:#ffc93c; --gold-ink:#3a2a00; --ok:#1a7a47; --warn:#a85a00; --track:#1d2127;
  --font-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1114; --surface:#1a1d22; --surface-2:#23272e; --ink:#eef0f3; --muted:#9aa1ab; --line:#343a43;
    --red:#ff5a54; --gold:#f2b81f; --gold-ink:#2b1f00; --ok:#4cd08a; --warn:#ffb454; color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.band{height:10px;border-radius:6px;background:repeating-linear-gradient(45deg,#e10600 0 10px,#fff 10px 20px)}
h1{font:400 clamp(28px,6vw,40px)/1.05 var(--font-display);margin:0}
h2{font:400 22px/1.1 var(--font-display);margin:0 0 4px}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.sub,.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.who{color:var(--muted);font-size:13px}
.nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none}
.nav button{flex:none;border:0;background:transparent;color:var(--muted);font:800 14px var(--font-body);padding:9px 16px;border-radius:999px;min-height:40px;cursor:pointer;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav button[disabled]{opacity:.5;cursor:not-allowed}
.two{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:900px){.two{grid-template-columns:minmax(0,380px) minmax(0,1fr)}}
.form{display:grid;gap:12px}
.field{display:grid;gap:4px;font-weight:800;font-size:13px;min-width:0}
input,select{font:inherit;font-weight:700;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--ink);flex:none}
.chk{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;min-height:44px;cursor:pointer;font-weight:700}
.err{color:var(--red);font-weight:700;font-size:13px;min-height:1em}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:400 17px var(--font-display);border:0;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font:800 14px var(--font-body)}
.btn.sm{font:800 13px var(--font-body);min-height:36px;padding:6px 12px}
.btn[disabled]{opacity:.6;cursor:wait}
.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px;background:var(--surface-2);border-radius:12px}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}
.sigla{font:400 14px var(--font-display);background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:8px;letter-spacing:.04em}
.badge{font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.badge.ouro{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.badge.prata{background:#c9d0d9;color:#1f2933;border-color:#c9d0d9}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.off{color:var(--warn);border-color:var(--warn)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
.login{max-width:420px;margin:8vh auto 0;display:grid;gap:16px}
.login .card{display:grid;gap:14px}
.link{background:none;border:0;color:var(--muted);font:700 13px var(--font-body);text-decoration:underline;cursor:pointer;padding:6px 0;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:min(92vw,460px);
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="band"></div>

  <!-- carregando -->
  <div id="v-load" class="login"><h1>Corrida de Prêmios OP</h1><p class="sub">Carregando...</p></div>

  <!-- entrar -->
  <div id="v-login" class="login" hidden>
    <div><span class="eyebrow">Painel do gestor</span><h1>Corrida de Prêmios OP</h1></div>
    <form class="card" id="f-login" novalidate>
      <label class="field" for="l-email">E-mail<input id="l-email" type="email" autocomplete="username" inputmode="email"></label>
      <label class="field" for="l-senha">Senha<input id="l-senha" type="password" autocomplete="current-password"></label>
      <div class="err" id="l-err" role="alert"></div>
      <button class="btn" type="submit" id="l-btn">Entrar</button>
      <button class="link" type="button" id="l-esqueci">Esqueci minha senha</button>
    </form>
  </div>

  <!-- definir senha (convite ou recuperação) -->
  <div id="v-senha" class="login" hidden>
    <div><span class="eyebrow">Quase lá</span><h1>Crie sua senha</h1></div>
    <form class="card" id="f-senha" novalidate>
      <label class="field" for="s-nova">Nova senha<input id="s-nova" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label>
      <label class="field" for="s-rep">Repita a senha<input id="s-rep" type="password" autocomplete="new-password"></label>
      <div class="err" id="s-err" role="alert"></div>
      <button class="btn" type="submit">Salvar senha</button>
    </form>
  </div>

  <!-- painel -->
  <div id="v-app" hidden>
    <header class="top">
      <div><span class="eyebrow">Painel do gestor</span><h1>Corrida de Prêmios OP</h1></div>
      <div class="line"><span class="who" id="quem"></span><button class="btn ghost sm" type="button" id="sair">Sair</button></div>
    </header>
    <nav class="nav" id="nav" aria-label="Seções" style="margin-top:14px">
      <button type="button" data-r="clinicas">Clínicas</button>
      <button type="button" data-r="tipos">Tipos de lançamento</button>
      <button type="button" data-r="premios">Prêmios</button>
      <button type="button" disabled title="Em construção">Pessoas</button>
      <button type="button" disabled title="Em construção">Campanhas</button>
    </nav>
    <section class="two" id="area" style="margin-top:18px"></section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  'use strict';
  /* Chaves públicas do projeto. A chave "publishable" foi feita para ficar no navegador:
     quem protege os dados são as regras de acesso do banco. Nunca coloque a chave secreta aqui. */
  const SUPABASE_URL = 'https://fjroscujmyrjxatakcpo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ZuqKt7UHtpkiyQr95Ji67w_OQXS1nMV';

  const $ = (s, r) => (r||document).querySelector(s);
  const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const brl = n => Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  let toastTimer;
  function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4500); }

  /* Se o convite ou a recuperação de senha chegou pelo link do e-mail, o endereço traz "type=invite" ou "type=recovery". */
  const veioDeLink = /type=(invite|recovery)/.test(location.hash);
  let definindoSenha = veioDeLink;

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  let eu = null;           // linha da tabela usuarios
  let recurso = 'clinicas';
  let editId = null;
  let lista = [];

  const view = id => { ['load','login','senha','app'].forEach(v => { $('#v-'+v).hidden = v !== id; }); };
  const msgErro = e => {
    if (!e) return '';
    if (e.code === '23505') return 'Já existe um cadastro com esse valor. Use outro nome ou sigla.';
    if (e.code === '42501' || /row-level security|permission denied/i.test(e.message || '')) return 'Sem permissão para esta ação.';
    if (/Invalid login credentials/i.test(e.message || '')) return 'E-mail ou senha incorretos.';
    if (/Email not confirmed/i.test(e.message || '')) return 'Este e-mail ainda não foi confirmado.';
    if (/fetch|network/i.test(e.message || '')) return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
    return e.message || 'Algo deu errado. Tente de novo.';
  };

  /* ---------- cadastros ---------- */
  const CORES = [['#5b9bff','Azul'],['#ffa23a','Laranja'],['#ff7aa8','Rosa'],['#3ecf9a','Verde'],['#b58cff','Roxo'],['#ff7a6b','Coral']];
  const RECURSOS = {
    clinicas: {
      titulo: 'Clínica', plural: 'Clínicas', tabela: 'clinicas', ordem: 'nome', ativo: 'ativa',
      intro: 'Cada clínica é uma equipe na corrida. A sigla aparece no carro da clínica.',
      campos: [
        {k:'sigla', rot:'Sigla (2 a 4 letras)', tipo:'text', max:4, upper:true, obrig:true},
        {k:'nome', rot:'Nome da clínica', tipo:'text', obrig:true},
        {k:'cor', rot:'Cor do carro', tipo:'select', opcoes:CORES, padrao:'#5b9bff'},
        {k:'ativa', rot:'Clínica ativa', tipo:'check', padrao:true}
      ],
      validar: d => /^[A-Z0-9]{2,4}$/.test(d.sigla) ? '' : 'A sigla precisa ter de 2 a 4 letras ou números.',
      resumo: r => '<div class="line"><span class="dot" style="background:'+esc(r.cor||'#999')+'"></span><span class="sigla">'+esc(r.sigla)+'</span><b>'+esc(r.nome)+'</b>'+(r.ativa?'':'<span class="chip off">Inativa</span>')+'</div>'
    },
    tipos: {
      titulo: 'Tipo de lançamento', plural: 'Tipos de lançamento', tabela: 'tipos_lancamento', ordem: 'nome', ativo: 'ativo',
      intro: 'O que pode ser lançado: visita, venda de início, raspagem, clareamento... Cada campanha escolhe quais tipos aceita e como pontuam.',
      campos: [
        {k:'nome', rot:'Nome', tipo:'text', obrig:true},
        {k:'categoria', rot:'É uma visita ou uma venda?', tipo:'select', opcoes:[['visita','Visita'],['venda','Venda']], padrao:'venda'},
        {k:'usa_valor', rot:'Pede o valor em reais no lançamento', tipo:'check', padrao:false},
        {k:'base_fechamento', rot:'Entra no % de fechamento como', tipo:'select', opcoes:[['nenhum','Não entra'],['visita','Visita (divisor)'],['venda','Venda (dividendo)']], padrao:'nenhum'},
        {k:'ativo', rot:'Tipo ativo', tipo:'check', padrao:true}
      ],
      resumo: r => '<div class="line"><b>'+esc(r.nome)+'</b><span class="badge">'+(r.categoria==='visita'?'Visita':'Venda')+'</span>'+(r.usa_valor?'<span class="chip">pede valor</span>':'')+(r.base_fechamento!=='nenhum'?'<span class="chip">fechamento: '+(r.base_fechamento==='visita'?'visita':'venda')+'</span>':'')+(r.ativo?'':'<span class="chip off">Inativo</span>')+'</div>'
    },
    premios: {
      titulo: 'Prêmio', plural: 'Prêmios', tabela: 'premios', ordem: 'nome', ativo: 'ativo',
      intro: 'Ouro: só o primeiro que passar pela casa leva. Prata: todos que passarem levam.',
      campos: [
        {k:'nome', rot:'Nome do prêmio', tipo:'text', obrig:true},
        {k:'tipo', rot:'Tipo', tipo:'select', opcoes:[['ouro','Ouro (só o primeiro)'],['prata','Prata (todos que passarem)']], padrao:'prata'},
        {k:'custo', rot:'Custo de cada prêmio (R$)', tipo:'number', padrao:0},
        {k:'ativo', rot:'Prêmio ativo', tipo:'check', padrao:true}
      ],
      validar: d => d.custo >= 0 ? '' : 'O custo não pode ser negativo.',
      resumo: r => '<div class="line"><span class="badge '+esc(r.tipo)+'">'+esc(r.tipo)+'</span><b>'+esc(r.nome)+'</b><span class="chip">'+brl(r.custo)+'</span>'+(r.ativo?'':'<span class="chip off">Inativo</span>')+'</div>'
    }
  };

  function campoHtml(c, v){
    const id = 'f-'+c.k;
    if (c.tipo === 'check') return '<label class="chk" for="'+id+'"><input id="'+id+'" type="checkbox"'+(v?' checked':'')+'><span>'+esc(c.rot)+'</span></label>';
    if (c.tipo === 'select') return '<label class="field" for="'+id+'">'+esc(c.rot)+'<select id="'+id+'">'+c.opcoes.map(o => '<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></label>';
    if (c.tipo === 'number') return '<label class="field" for="'+id+'">'+esc(c.rot)+'<input id="'+id+'" type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(v)+'"></label>';
    return '<label class="field" for="'+id+'">'+esc(c.rot)+'<input id="'+id+'" type="text"'+(c.max?' maxlength="'+c.max+'"':'')+' autocomplete="off" value="'+esc(v)+'"></label>';
  }

  function desenhar(){
    const R = RECURSOS[recurso], atual = lista.find(r => r.id === editId) || null;
    $$('#nav button[data-r]').forEach(b => b.setAttribute('aria-current', b.dataset.r === recurso ? 'page' : 'false'));
    $('#area').innerHTML =
      '<div class="card"><h2>'+(atual ? 'Editar' : 'Novo')+' '+esc(R.titulo.toLowerCase())+'</h2><p class="sub">'+esc(R.intro)+'</p>'
      + '<form class="form" id="f-cad" novalidate>'+R.campos.map(c => campoHtml(c, atual ? atual[c.k] : c.padrao)).join('')
      + '<div class="err" id="c-err" role="alert"></div><div class="btns"><button class="btn" type="submit" id="c-btn">Salvar</button>'
      + (atual ? '<button class="btn ghost" type="button" id="c-cancel">Cancelar edição</button>' : '')+'</div></form></div>'
      + '<div class="card"><h2>'+esc(R.plural)+'</h2><p class="sub">'+lista.length+' cadastrad'+(recurso==='premios'||recurso==='tipos'?'o':'a')+(lista.length===1?'':'s')+'. Para tirar algo de uso, edite e desmarque "ativ'+(recurso==='clinicas'?'a':'o')+'". Nada é apagado.</p>'
      + '<ul class="items">'+(lista.map(r => '<li class="item"><div>'+R.resumo(r)+'</div><div><button type="button" class="btn ghost sm" data-ed="'+r.id+'">Editar</button></div></li>').join('') || '<li class="empty">Nada cadastrado ainda.</li>')+'</ul></div>';
    $('#f-cad').addEventListener('submit', salvar);
    const cancel = $('#c-cancel'); if (cancel) cancel.addEventListener('click', () => { editId = null; desenhar(); });
    $$('[data-ed]').forEach(b => b.addEventListener('click', () => { editId = Number(b.dataset.ed); desenhar(); const p = $('#f-cad input, #f-cad select'); if (p) p.focus(); }));
  }

  async function carregar(){
    const R = RECURSOS[recurso];
    $('#area').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const { data, error } = await sb.from(R.tabela).select('*').order(R.ordem);
    if (error){ $('#area').innerHTML = '<div class="card"><div class="err">'+esc(msgErro(error))+'</div></div>'; return; }
    lista = data; desenhar();
  }

  async function salvar(e){
    e.preventDefault();
    const R = RECURSOS[recurso], d = {};
    R.campos.forEach(c => {
      const el = $('#f-'+c.k);
      if (c.tipo === 'check') d[c.k] = el.checked;
      else if (c.tipo === 'number') d[c.k] = el.value === '' ? 0 : Number(el.value);
      else { let v = el.value.trim(); if (c.upper) v = v.toUpperCase(); d[c.k] = v; }
    });
    const falta = R.campos.find(c => c.obrig && !d[c.k]);
    const erro = falta ? 'Preencha: '+falta.rot.toLowerCase()+'.' : (R.validar ? R.validar(d) : '');
    if (erro){ $('#c-err').textContent = erro; return; }
    const btn = $('#c-btn'); btn.disabled = true;
    const q = editId ? sb.from(R.tabela).update(d).eq('id', editId) : sb.from(R.tabela).insert(d);
    const { error } = await q;
    btn.disabled = false;
    if (error){ $('#c-err').textContent = msgErro(error); return; }
    toast(editId ? R.titulo+' atualizado.' : R.titulo+' cadastrado.');
    editId = null; carregar();
  }

  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('button[data-r]'); if (!b) return;
    recurso = b.dataset.r; editId = null; carregar();
  });

  /* ---------- entrar, sair, senha ---------- */
  async function aposLogin(){
    const { data: sess } = await sb.auth.getSession();
    if (!sess.session){ view('login'); return; }
    if (definindoSenha){ view('senha'); return; }
    const { data, error } = await sb.from('usuarios').select('*').eq('auth_id', sess.session.user.id).maybeSingle();
    if (error || !data){
      await sb.auth.signOut(); view('login');
      $('#l-err').textContent = 'Seu login existe, mas ainda não foi cadastrado no sistema. Fale com o gestor.'; return;
    }
    if (data.papel !== 'gestor'){
      await sb.auth.signOut(); view('login');
      $('#l-err').textContent = 'Este painel é só do gestor. Gerentes e promotores usam o aplicativo do celular.'; return;
    }
    eu = data; $('#quem').textContent = data.nome; view('app'); carregar();
  }

  $('#f-login').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#l-email').value.trim(), senha = $('#l-senha').value;
    if (!email || !senha){ $('#l-err').textContent = 'Informe o e-mail e a senha.'; return; }
    $('#l-btn').disabled = true; $('#l-err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    $('#l-btn').disabled = false;
    if (error){ $('#l-err').textContent = msgErro(error); return; }
    $('#l-senha').value = ''; aposLogin();
  });

  $('#l-esqueci').addEventListener('click', async () => {
    const email = $('#l-email').value.trim();
    if (!email){ $('#l-err').textContent = 'Digite seu e-mail acima e toque em "Esqueci minha senha" de novo.'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    $('#l-err').textContent = '';
    toast(error ? msgErro(error) : 'Se o e-mail estiver cadastrado, enviamos um link para criar uma nova senha.');
  });

  $('#f-senha').addEventListener('submit', async e => {
    e.preventDefault();
    const a = $('#s-nova').value, b = $('#s-rep').value;
    if (a.length < 8){ $('#s-err').textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
    if (a !== b){ $('#s-err').textContent = 'As duas senhas não são iguais.'; return; }
    const { error } = await sb.auth.updateUser({ password: a });
    if (error){ $('#s-err').textContent = msgErro(error); return; }
    definindoSenha = false; history.replaceState(null, '', location.pathname);
    toast('Senha criada.'); aposLogin();
  });

  $('#sair').addEventListener('click', async () => { await sb.auth.signOut(); eu = null; view('login'); });

  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY'){ definindoSenha = true; } });
  aposLogin();
})();
</script>
</body>
</html>
