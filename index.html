      + '<div class="b" title="Escala de 0 a 60%"><i style="width:'+Math.min(100, (c[1] || 0) / 60 * 100)+'%"></i>'+(c[2] != null ? '<u style="left:calc('+Math.min(100, c[2] / 60 * 100)+'% - 1px)"></u>' : '')+'</div>'
      + '<div class="f">Meta '+(c[2] != null ? pf1(c[2]) : '—')+' · '+c[3].s+' vendas · '+c[3].v+' visitas</div></div>').join('')+'</div>';

    const dvs = [];
    Object.keys(C).forEach(k => { const c = C[k], d = Number(k.split('|')[1]); if (d >= 1 && d <= n && pdIso(PD.ano, PD.mes, d) <= hj && (c.visitas_planilha !== c.visitas_corrida || c.vendas_planilha !== c.vendas_corrida)) dvs.push({ p: pes.find(x => x.id === c.usuario_id), d, c }); });
    dvs.sort((a, b) => a.d - b.d);
    const aviso = '<div class="pd-card pd-div">'+(dvs.length
      ? '<details><summary><span class="pl no">'+dvs.length+' divergência'+(dvs.length === 1 ? '' : 's')+' com a corrida</span> A planilha e a corrida precisam mostrar os mesmos números de cada pessoa no dia.</summary><ul>'
        + dvs.map(x => '<li><b>'+esc(x.p ? x.p.nome : '#'+x.c.usuario_id)+'</b> em '+pd2(x.d)+'/'+pd2(PD.mes + 1)+': planilha '+x.c.visitas_planilha+' vis. / '+x.c.vendas_planilha+' ven., corrida '+x.c.visitas_corrida+' vis. / '+x.c.vendas_corrida+' ven.</li>').join('')+'</ul></details>'
      : '<span class="pl ok">Sem divergências</span> Planilha e corrida mostram os mesmos números neste mês.')+'</div>';

    const exd = {}; for (let d = 1; d <= n; d++){ if (!lanc[d]) continue; let a0 = 0, a1 = 0, b0 = 0, b1 = 0;
      pes.forEach(p => { const x = (M[p.id] || {})[d]; if (!x) return; if (p.cargo === 'Divulgador'){ b0 += x[0]; b1 += x[1]; } else { a0 += x[0]; a1 += x[1]; } });
      if (a0 !== b0 || a1 !== b1) exd[d] = 'Divulgadores: '+b0+' vis. / '+b1+' ven. · Promotores e teles: '+a0+' vis. / '+a1+' ven.'; }
    const nex = Object.keys(exd).length;
    const aviso2 = '<div class="pd-card pd-div">'+(nex ? '<details><summary><span class="pl no ex"><b>!</b> '+nex+' dia'+(nex === 1 ? '' : 's')+' com totais diferentes</span> Divulgadores e promotores/teles deveriam somar o mesmo. Corrija pelo Lançamento diário.</summary><ul>'
        + Object.keys(exd).map(d => '<li><b>'+pd2(d)+'/'+pd2(PD.mes + 1)+'</b>: '+esc(exd[d])+'</li>').join('')+'</ul></details>'
      : '<span class="pl ok">Totais iguais</span> Divulgadores e promotores/teles somam o mesmo em todos os dias lançados.')+'</div>';

    let h = '<table class="pd" style="width:'+(168 + n * 50 + 240)+'px"><colgroup><col style="width:168px">'+new Array(n + 1).join('<col style="width:50px">')+'<col style="width:54px"><col style="width:54px"><col style="width:70px"><col style="width:62px"></colgroup><thead><tr><th class="nm">Pessoa</th>';
    for (let d = 1; d <= n; d++){ const w = new Date(PD.ano, PD.mes, d).getDay(); h += '<th class="'+(w === 0 ? 'dom' : '')+(ehHj(d) ? ' hj' : '')+'"'+(exd[d] ? ' title="'+esc(exd[d])+'"' : '')+'>'+d+(exd[d] ? '<b class="exm">!</b>' : '')+'<small>'+SEM[w]+'</small></th>'; }
    h += '<th class="rt r1">Vis.</th><th class="rt r2">Ven.</th><th class="rt r3">%</th><th class="rt r4">Meta</th></tr></thead><tbody>';
    const grupo = (tit, arr, meta) => { const t = pdSoma(ids(arr), M, n), pc = pdPct(t.v, t.s);

    if (teste.length){ const mt = {}; for (let d = 1; d <= n; d++){ let v = 0, s = 0, v2 = 0, s2 = 0, tem = false;

    h += grupo('Divulgadores', div, mdiv);

    if (teste.length){ h += linha({ id: 'teste', nome: 'Promotores de teste ('+teste.length+')', ativo: true }, 30, true);
      if (PD.testeMes) vis(teste).forEach(p => { h += linha(Object.assign({}, p, { sub: true }), 30, true); }); }

  /* ----- lançamento diário ----- */
  async function diaCarregar(){
    pdMarcar(); $('#area').style.gridTemplateColumns = 'minmax(0,1fr)';
    $('#area').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const e0 = await pdBase(); if (e0){ pdErro(e0); return; }
    if (!PD.clin){ pdVazio(); return; }
    const dt = PD.data, tk = ++PD.tk;
    const rs = await Promise.all([sb.rpc('equipe_clinica', { p_clinica: PD.clin, p_de: dt, p_ate: dt }),
      sb.from('planilha_diaria').select('*').eq('clinica_id', PD.clin).eq('data_ref', dt),
      sb.rpc('conferencia_corrida', { p_clinica: PD.clin, p_de: dt, p_ate: dt })]);
    if (tk !== PD.tk) return;
    const er = rs.map(r => r.error).find(Boolean); if (er){ pdErro(er); return; }
    const ex = {}; rs[1].data.forEach(r => { ex[r.usuario_id] = [r.visitas, r.vendas]; });
    PD.existe = rs[1].data.length > 0;
    PD.pessoas = rs[0].data.filter(p => p.ativo || ex[p.id]);
    PD.r = {}; PD.pessoas.forEach(p => { PD.r[p.id] = ex[p.id] ? ex[p.id].slice() : [0, 0]; });
    PD.corr = {}; (rs[2].data || []).forEach(c => { PD.corr[c.usuario_id] = [c.visitas_corrida, c.vendas_corrida]; });
    diaDesenhar();
  }

  /* ---------- menu lateral e início (dashboard) ---------- */
  const TITULOS = { inicio: 'Início', corrida: 'Corrida', diario: 'Lançamento diário', planilha: 'Planilha do mês', lancamentos: 'Lançamentos', relatorios: 'Relatórios', externo: 'Relatório NUV',
    clinicas: 'Clínicas', tipos: 'Tipos de lançamento', premios: 'Prêmios', pessoas: 'Pessoas', campanhas: 'Campanhas' };
  const CADASTROS = ['clinicas', 'tipos', 'premios', 'pessoas', 'campanhas'];
  const lerLS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const gravarLS = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const GRUPOS = { cad: CADASTROS, camp: ['corrida', 'lancamentos'], vend: ['diario', 'planilha'] };

  const grupoCad = abrir => grupo('cad', abrir);

  const DS = { ano: 0, mes: 0, tk: 0, base: null, geo: null, proj: null, filtro: null, vb: null, full: null, anim: 0, nomes: {} };

  /* ---- dados do IBGE: lista de cidades, contorno das regiões e centro de cada cidade ---- */
  const IBGE = 'https://servicodados.ibge.gov.br/api/';
  const normTxt = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  async function ibgeJson(u){ const r = await fetch(IBGE+u); if (!r.ok) throw new Error('IBGE '+r.status); return r.json(); }
  async function cacheado(chave, buscar){
    const l = lerLS(chave); if (l){ try { return JSON.parse(l); } catch (e) {} }
    const v = await buscar(); gravarLS(chave, JSON.stringify(v)); return v;
  }
  const arred = n => Math.round(n * 1000) / 1000;
  const polis = g => !g ? [] : g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
  const mgMunicipios = () => cacheado('mg-mun-v1', async () => (await ibgeJson('v1/localidades/estados/31/municipios')).map(m => {
    const r = (m['regiao-imediata'] || {})['regiao-intermediaria'] || {}; return { id: m.id, nome: m.nome, rid: r.id || null, rnome: r.nome || '' }; }));
  const compactar = fs => fs.map(f => ({ key: f.key, polys: f.polys.map(p => p.map(r => r.map(c => [arred(c[0]), arred(c[1])]))) }));
  async function malha(url){ const j = await ibgeJson(url); return (j.features || []).map(f => ({ key: String((f.properties || {}).codarea || ''), polys: polis(f.geometry) })); }
  /* Tenta o contorno pronto das regiões intermediárias; se o IBGE não entregar, monta as regiões juntando as cidades. */
  const mgContorno = () => cacheado('mg-geo-v2', async () => {
    const muns = await mgMunicipios(), rids = new Set(muns.map(m => String(m.rid)));
    const tentativas = ['v4/malhas/estados/31?intrarregiao=regiao-intermediaria&qualidade=minima&formato=application/vnd.geo+json', 'v3/malhas/estados/31?intrarregiao=intermediaria&qualidade=minima&formato=application/vnd.geo+json'];
    for (const u of tentativas){
      try { const f = await malha(u); if (f.length >= 2 && f.every(x => rids.has(x.key))) return compactar(f); } catch (e) { /* tenta a próxima */ }
    }
    const cid = await malha('v3/malhas/estados/31?intrarregiao=municipio&qualidade=minima&formato=application/vnd.geo+json');
    const porId = {}; muns.forEach(m => { porId[String(m.id)] = m; porId[String(m.id).slice(0, 6)] = m; });
    const reg = {}; cid.forEach(c => { const m = porId[c.key] || porId[c.key.slice(0, 6)]; if (!m || !m.rid) return; (reg[m.rid] = reg[m.rid] || { key: String(m.rid), polys: [] }).polys.push(...c.polys); });
    const lista = Object.values(reg); if (lista.length < 2) throw new Error('contorno indisponível');
    return compactar(lista);
  });
  function centroideRing(r){ let a = 0, x = 0, y = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++){ const f = r[j][0] * r[i][1] - r[i][0] * r[j][1]; a += f; x += (r[j][0] + r[i][0]) * f; y += (r[j][1] + r[i][1]) * f; } a /= 2; return a ? [x / (6 * a), y / (6 * a)] : r[0]; }
  const mgCentro = id => cacheado('mg-cen-'+id, async () => {
    const j = await ibgeJson('v3/malhas/municipios/'+id+'?formato=application/vnd.geo+json&qualidade=minima');
    const ps = polis(((j.features ? j.features[0] : j) || {}).geometry); if (!ps.length) throw new Error('sem malha');
    const c = centroideRing(ps.map(p => p[0]).sort((a, b) => b.length - a.length)[0]); return [arred(c[0]), arred(c[1])];
  });
  function dentro(x, y, r){ let d = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++){ if (((r[i][1] > y) !== (r[j][1] > y)) && (x < (r[j][0] - r[i][0]) * (y - r[i][1]) / (r[j][1] - r[i][1]) + r[i][0])) d = !d; } return d; }

  async function buscarPlanilha(de, ate){
    let tudo = [];
    for (let i = 0; ; i += 1000){
      const { data, error } = await sb.from('planilha_diaria').select('*').gte('data_ref', de).lte('data_ref', ate).order('data_ref').order('usuario_id').range(i, i + 999);
      if (error) return { error };
      tudo = tudo.concat(data);
      if (data.length < 1000 || tudo.length >= 50000) break;
    }
    return { data: tudo };
  }

  async function inicioCarregar(){

    if (!DS.ano){ const h = hoje(); DS.ano = Number(h.slice(0, 4)); DS.mes = Number(h.slice(5, 7)) - 1; }
    const n = pdN(DS.ano, DS.mes), de = pdIso(DS.ano, DS.mes, 1), ate = pdIso(DS.ano, DS.mes, n), tk = ++DS.tk;

    rs[2].data.forEach(r => {

    });
    DS.base = Object.values(base); DS.n = n; DS.filtro = null; DS.geo = rs[3] ? { reg: rs[3][0] } : null;

  }

  /* ---- projeção e geometria do mapa ---- */
  function mapaPreparar(){
    const pts = [], reg = DS.geo ? DS.geo.reg : [];
    reg.forEach(r => r.polys.forEach(p => p[0].forEach(c => pts.push(c))));
    DS.base.forEach(o => { if (o.c.latitude != null && o.c.longitude != null) pts.push([Number(o.c.longitude), Number(o.c.latitude)]); });
    if (!pts.length){ DS.proj = null; return; }
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    pts.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
    if (x1 - x0 < 1){ const m = (x0 + x1) / 2; x0 = m - .5; x1 = m + .5; } if (y1 - y0 < 1){ const m = (y0 + y1) / 2; y0 = m - .5; y1 = m + .5; }
    const k = Math.cos(((y0 + y1) / 2) * Math.PI / 180) * 100, W = (x1 - x0) * k, H = (y1 - y0) * 100, pad = Math.max(W, H) * .03;
    const px = lng => (lng - x0) * k + pad, py = lat => (y1 - lat) * 100 + pad;
    DS.proj = { px, py, W: W + 2 * pad, H: H + 2 * pad };
    DS.full = [0, 0, DS.proj.W, DS.proj.H];
    DS.regs = reg.map(r => {
      const d = r.polys.map(p => p.map(a => 'M'+a.map(c => px(c[0]).toFixed(1)+','+py(c[1]).toFixed(1)).join('L')+'Z').join('')).join('');
      const todos = r.polys.reduce((t, p) => t.concat(p[0]), []).map(c => [px(c[0]), py(c[1])]);
      const bx = [Math.min(...todos.map(c => c[0])), Math.min(...todos.map(c => c[1])), Math.max(...todos.map(c => c[0])), Math.max(...todos.map(c => c[1]))];
      return { key: r.key, polys: r.polys, d, bbox: bx, nome: DS.nomes[r.key] || '' };
    });
    DS.base.forEach(o => {
      const c = o.c; o.x = o.y = null; o.reg = '';
      if (c.latitude == null || c.longitude == null) return;
      o.x = px(Number(c.longitude)); o.y = py(Number(c.latitude));
      const h = DS.regs.find(r => r.polys.some(p => dentro(Number(c.longitude), Number(c.latitude), p[0])));
      o.reg = h ? h.key : (c.regiao_id ? String(c.regiao_id) : '');
      if (h && !h.nome && c.regiao) h.nome = c.regiao;
    });
  }

  const ptsDe = ids => DS.base.filter(o => o.x != null && (!ids || ids.has(o.c.id)));
  function caixa(pontos, minimo){
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; pontos.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[2] == null ? p[0] : p[2]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[3] == null ? p[1] : p[3]); });

    if (w < mn){ x0 -= (mn - w) / 2; w = mn; } if (h < mn * .7){ y0 -= (mn * .7 - h) / 2; h = mn * .7; }
    return [x0, y0, w, h];
  }

  /* ---- tela: barra, mapa e painéis ---- */

  function mapaDesenhar(){
    const svg = $('#ds-svg'), P = DS.proj;
    const regsPorKey = {}; DS.base.forEach(o => { if (o.x != null && o.reg){ const r = regsPorKey[o.reg] = regsPorKey[o.reg] || { v: 0, s: 0, n: 0 }; r.v += o.v; r.s += o.s; r.n++; } });

    svg.innerHTML = '<g class="regs">'+regs+'</g><g class="bds">'+bds+'</g><g class="mks">'+mks+'</g><rect id="ds-sel" class="selr" hidden></rect>';

  }

  function aplicarVb(){

  function mapaIr(box, instante){

  }
  function filtrar(f){

  function filtroBarra(){

  function mapaEventos(svg){

  /* ---- números consolidados ao lado do mapa, de acordo com o que está em foco ---- */

      + k('% de fechamento médio', pf1(pdPct(V, S)).replace('%', ''), '%', 'Média entre as clínicas: '+pf1(pmed), true)
      + '</div>'
      + '<div class="card"><h2>Visitas e vendas por dia</h2><div class="ds-grafico" role="img" aria-label="Gráfico de visitas e vendas por dia">'+graf+'</div><div class="ds-leg"><span><b style="background:color-mix(in srgb,var(--accent) 32%,var(--surface-2))"></b>Visitas</span><span><b style="background:var(--accent)"></b>Vendas de início</span></div></div>'
      + '<div class="card"><h2>Por clínica</h2><div style="overflow-x:auto">'
      + (L.length ? '<table class="tab"><thead><tr><th>Clínica</th><th class="n">Visitas</th><th class="n">Vendas</th><th class="n">Visitas/dia</th><th class="n">Vendas/dia</th><th class="n">% de fechamento</th><th class="n">Dias</th></tr></thead><tbody>'
        + L.map(x => '<tr><td><b>'+esc(x.c.sigla)+'</b> · '+esc(x.c.nome)+'</td><td class="n">'+x.v+'</td><td class="n">'+x.s+'</td><td class="n">'+dsNum(x.mv)+'</td><td class="n">'+dsNum(x.ms)+'</td><td class="n"><span class="barra"><i style="width:'+Math.min(100, (x.pct || 0) / 60 * 100)+'%"></i></span> <b>'+pf1(x.pct)+'</b></td><td class="n">'+x.dias+'</td></tr>').join('')
        + '<tr class="tot"><td>'+(f ? 'Total da seleção' : 'Todas as clínicas')+'</td><td class="n">'+V+'</td><td class="n">'+S+'</td><td class="n">'+dsNum(dsMedia(V, dr))+'</td><td class="n">'+dsNum(dsMedia(S, dr))+'</td><td class="n"><b>'+pf1(pdPct(V, S))+'</b></td><td class="n">'+dr+'</td></tr></tbody></table>'
        : '<div class="empty">Nenhuma clínica ativa. Cadastre em Cadastros › Clínicas.</div>')
      + '</div></div>';
  }


  /* ---------- relatório externo (Looker Studio) dentro do painel ---------- */
  const LOOKER_LINK = 'https://datastudio.google.com/reporting/51710f3a-35d4-49ec-9c0f-37022a0c752c/page/p_td0t1ca4id';
  const lookerEmbed = u => u.replace(/^https:\/\/(datastudio|lookerstudio)\.google\.com\/reporting\//, 'https://lookerstudio.google.com/embed/reporting/');
  function externoCarregar(){
    marcarMenu(); $('#area').style.gridTemplateColumns = 'minmax(0,1fr)';
    $('#area').innerHTML = '<div class="card" style="padding:14px 16px"><div class="pd-bar"><div><h2 style="margin:0">Relatório NUV</h2><p class="sub" style="margin:2px 0 0">Seu relatório do Looker Studio, aberto aqui dentro. Precisa estar com o login do Google que tem acesso a ele.</p></div>'
      + '<div class="grp"><a class="btn ghost sm" href="'+esc(LOOKER_LINK)+'" target="_blank" rel="noopener">Abrir em outra aba</a></div></div>'
      + '<div class="ds-ext"><iframe id="ext-frame" title="Relatório NUV" src="'+esc(lookerEmbed(LOOKER_LINK))+'" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>'
      + '<p class="sub" style="margin:10px 0 0">Se a área acima aparecer em branco ou pedir login, abra em outra aba. Para aparecer aqui, no Looker Studio use <b>Compartilhar › Incorporar relatório › Ativar incorporação</b>.</p></div>';
  }

  /* ---------- entrar, sair, senha ---------- */
  let modoVisao = 'gestor';
  function aplicarModo(recarregar){
    const ger = modoVisao === 'gerente';
    $('#eyebrow').textContent = ger ? 'Painel da gerência' : (eu && eu.papel === 'assistente' ? 'Painel de suporte' : 'Painel do gestor');
    $$('#modo button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === modoVisao));
    $$('#nav button[data-r]').forEach(b => { b.hidden = ger && !['diario', 'planilha'].includes(b.dataset.r); });
    $$('#nav .sep').forEach(x => { x.hidden = ger; });
    Object.keys(GRUPOS).forEach(k => { const esc_ = ger && k !== 'vend'; $('#g-'+k+'-btn').hidden = esc_; if (esc_) grupo(k, false); });
    if (ger) grupo('vend', true);
    if (ger && !['diario', 'planilha'].includes(recurso)) recurso = 'diario';
    if (!ger && ['diario', 'planilha'].includes(recurso) && recarregar) recurso = 'inicio';
    PD.clinicas = []; PD.ano = 0;
    if (recarregar) carregar();
  }
  $('#modo').addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (!b || b.dataset.m === modoVisao) return; modoVisao = b.dataset.m; aplicarModo(true); });

  async function aposLogin(){
    const { data: sess } = await sb.auth.getSession();
    if (!sess.session){ view('login'); return; }
    if (definindoSenha){ view('senha'); return; }
    const { data, error } = await sb.from('usuarios').select('*').eq('auth_id', sess.session.user.id).maybeSingle();
    if (error || !data){
      await sb.auth.signOut(); view('login');
      $('#l-err').textContent = 'Seu login existe, mas ainda não foi cadastrado no sistema. Fale com o gestor.'; return;
    }
    if (!['gestor', 'gerente', 'assistente'].includes(data.papel)){ location.replace('app/'); return; }
    eu = data; $('#quem').textContent = data.nome;
    $('#modo').hidden = data.papel === 'gerente'; modoVisao = data.papel === 'gerente' ? 'gerente' : 'gestor';
    aplicarModo(false);
    lateral(lerLS('menu-aberto') === '1' && window.innerWidth > 1000); if (data.papel !== 'gerente' && !recurso) recurso = 'inicio';
    view('app'); carregar();
  }

  $('#f-login').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#l-email').value.trim(), senha = $('#l-senha').value;
    if (!email || !senha){ $('#l-err').textContent = 'Informe o e-mail e a senha.'; return; }
    $('#l-btn').disabled = true; $('#l-err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    $('#l-btn').disabled = false;
    if (error){ $('#l-err').textContent = msgErro(error); return; }
    $('#l-senha').value = ''; aposLogin();
  });

  $('#l-esqueci').addEventListener('click', async () => {
    const email = $('#l-email').value.trim();
    if (!email){ $('#l-err').textContent = 'Digite seu e-mail acima e toque em "Esqueci minha senha" de novo.'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    $('#l-err').textContent = '';
    toast(error ? msgErro(error) : 'Se o e-mail estiver cadastrado, enviamos um link para criar uma nova senha.');
  });

  $('#f-senha').addEventListener('submit', async e => {
    e.preventDefault();
    const a = $('#s-nova').value, b = $('#s-rep').value;
    if (a.length < 8){ $('#s-err').textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
    if (a !== b){ $('#s-err').textContent = 'As duas senhas não são iguais.'; return; }
    const { error } = await sb.auth.updateUser({ password: a });
    if (error){ $('#s-err').textContent = msgErro(error); return; }
    definindoSenha = false; history.replaceState(null, '', location.pathname);
    toast('Senha criada.'); aposLogin();
  });

  $('#sair').addEventListener('click', async () => { await sb.auth.signOut(); eu = null; view('login'); });

  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY'){ definindoSenha = true; } });
  aposLogin();
})();
</script>
</body>
</html>
