<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#ea580c">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f5; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea;
  --accent:#d95300; --accent-2:#ff8a1f; --accent-soft:#fff1e5; --on-accent:#ffffff;
  --red:#d70015; --ok:#248a3d; --warn:#b25000;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
    --accent:#ff9f0a; --accent-2:#ff6a00; --accent-soft:#3a2308; --on-accent:#1a0e00;
    --red:#ff6961; --ok:#30d158; --warn:#ffb340; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
h1{font:700 26px/1.1 var(--font);letter-spacing:-.03em;margin:0}
h2{font:650 18px/1.2 var(--font);letter-spacing:-.02em;margin:0 0 4px}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.meta{color:var(--muted);font-size:13px;margin:0}
.card{background:var(--surface);border-radius:22px;padding:18px;min-width:0;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.form{display:grid;gap:12px}
.field{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--muted);min-width:0}
input,select{font:inherit;font-weight:500;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:10px 14px;min-height:48px;width:100%}
input:focus,select:focus{outline:none;background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.g2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.err{color:var(--red);font-weight:500;font-size:13px;min-height:1em}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 16px var(--font);border:0;border-radius:999px;padding:10px 22px;min-height:48px;cursor:pointer;color:var(--on-accent);
  background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;font-size:14px}
.btn.sm{font-size:13px;min-height:38px;padding:6px 16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.6}
.link{background:none;border:0;color:var(--accent);font:600 14px var(--font);cursor:pointer;padding:8px 0;text-align:center}
.items{list-style:none;margin:0;padding:0}
.item{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.item:first-child{border-top:0}
.empty{padding:18px;background:var(--surface-2);border-radius:14px;color:var(--muted);text-align:center;list-style:none}
.sigla{font:700 12px var(--font);background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:8px;letter-spacing:.04em}
.badge{font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.ouro{background:linear-gradient(180deg,#ffd35c,#ffb400);color:#3a2a00}
.badge.prata{background:linear-gradient(180deg,#e4e6ea,#c3c7ce);color:#1f2933}
.chip{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.off{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.login{max-width:420px;margin:7vh auto 0;display:grid;gap:20px}
.login .card{display:grid;gap:14px;padding:24px}
.logo{width:64px;height:64px;border-radius:16px;box-shadow:var(--shadow)}
/* avatar */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 15px var(--font);flex:none;overflow:hidden}
.av.xl{width:120px;height:120px;font-size:38px;margin:0 auto}
/* barra de abas */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);z-index:10}
.tabs button{flex:1;max-width:140px;border:0;background:transparent;color:var(--muted);font:600 11px var(--font);padding:6px 4px;border-radius:12px;display:grid;justify-items:center;gap:2px;min-height:52px;cursor:pointer;position:relative}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .n{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font:700 10px var(--font);min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* corrida */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--font);padding:7px 14px;border-radius:999px;min-height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pista{position:relative;border-radius:16px;overflow:hidden;background:#2a2d33;padding:4px}
.pgrid{display:grid;gap:3px}
.casa{aspect-ratio:1;border-radius:7px;background:#3a3e46;color:#aeb4bf;font:600 10px var(--font);display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;min-width:0;overflow:hidden}
.casa.ouro{background:linear-gradient(135deg,#ffd35c,#e8a400);color:#3a2a00}
.casa.prata{background:linear-gradient(135deg,#e4e6ea,#aeb4bd);color:#1f2933}
.casa.largada{background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/12px 12px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.carros{position:absolute;inset:4px;pointer-events:none}
.carro{position:absolute;display:grid;place-items:center;transition:left .9s cubic-bezier(.5,0,.2,1),top .9s cubic-bezier(.5,0,.2,1)}
.carro .in{transform:translateX(var(--dx,0px));display:grid;justify-items:center;gap:0}
.carro .tag{font:700 9px var(--font);color:#fff;background:rgba(0,0,0,.72);padding:1px 4px;border-radius:6px;white-space:nowrap}
.carro.eu{z-index:3}.carro.eu .tag{background:var(--accent);box-shadow:0 0 0 2px #fff}
@media (prefers-reduced-motion:reduce){.carro{transition:none}}
.rk{display:grid;grid-template-columns:32px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk.eu{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:12px;border-top-color:transparent}
.rk .pos{font:700 17px var(--font);text-align:center}
.rk .pts{font:700 17px var(--font);text-align:right}
.rk .av{width:40px;height:40px;font-size:13px}
.hero{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--on-accent);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.hero b{font:700 28px/1.1 var(--font);display:block;letter-spacing:-.03em}
.hero p{margin:4px 0 0;opacity:.92;font-size:14px}
.nt{padding:12px 0;border-top:1px solid var(--line)}
.nt:first-child{border-top:0}
.nt.novo{background:var(--accent-soft);margin:0 -10px;padding:12px 10px;border-radius:12px;border-top-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:min(92vw,460px);
  background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);padding:13px 16px;border-radius:16px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div id="v-load" class="login"><h1>Corrida de Prêmios OP</h1><p class="sub">Carregando...</p></div>

  <div id="v-login" class="login" hidden>
    <div><img class="logo" src="icon-192.png" alt="" width="64" height="64"><div style="margin-top:14px"><span class="eyebrow">Bem-vindo</span><h1>Corrida de Prêmios OP</h1></div></div>
    <form class="card" id="f-login" novalidate>
      <label class="field" for="l-email">E-mail<input id="l-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off"></label>
      <label class="field" for="l-senha">Senha<input id="l-senha" type="password" autocomplete="current-password"></label>
      <div class="err" id="l-err" role="alert"></div>
      <button class="btn block" type="submit" id="l-btn">Entrar</button>
      <button class="link" type="button" id="l-esqueci">Esqueci minha senha</button>
    </form>
  </div>

  <div id="v-foto" class="login" hidden>
    <div><span class="eyebrow">Quase pronto</span><h1>Coloque sua foto</h1><p class="sub">Ela aparece na corrida, junto do seu carro.</p></div>
    <div class="card">
      <div class="av xl" id="o-av">?</div>
      <div class="err" id="o-err" role="alert" style="text-align:center"></div>
      <label class="btn block" style="text-align:center;display:block;line-height:28px">Tirar foto agora<input type="file" accept="image/*" capture="user" id="o-cam" hidden></label>
      <label class="btn ghost block" style="text-align:center;display:block;line-height:32px">Escolher da galeria<input type="file" accept="image/*" id="o-gal" hidden></label>
      <button class="link" type="button" id="o-pular">Pular por enquanto</button>
    </div>
  </div>

  <div id="v-app" hidden>
    <header class="top" style="margin-bottom:14px"><div><span class="eyebrow" id="h-papel"></span><h1 id="h-nome"></h1></div><div id="h-av"></div></header>
    <main id="main" style="display:grid;gap:14px"></main>
  </div>
</div>
<nav class="tabs" id="tabs" hidden aria-label="Seções"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  'use strict';
  const SUPABASE_URL = 'https://fjroscujmyrjxatakcpo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_ZuqKt7UHtpkiyQr95Ji67w_OQXS1nMV';

  const $ = (s, r) => (r||document).querySelector(s);
  const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const brl = n => n == null ? '' : Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const num = v => Number(String(v).replace(',', '.'));
  const hoje = () => new Date().toLocaleDateString('sv-SE');
  const dBR = d => d ? d.split('-').reverse().join('/') : '';
  const iniciais = n => { const p = String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0] + (p.length > 1 ? p[p.length-1][0] : (p[0]||'')[1] || '')).toUpperCase(); };
  const avatar = (u, cls) => u && u.foto_url ? '<img class="av '+(cls||'')+'" src="'+esc(u.foto_url)+'" alt="">' : '<div class="av '+(cls||'')+'">'+esc(iniciais(u && u.nome))+'</div>';
  let toastTimer;
  function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4500); }
  const msgErro = e => {
    const m = (e && e.message) || '';
    if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/fetch|network/i.test(m)) return 'Sem conexão. Verifique a internet e tente de novo.';
    return m || 'Algo deu errado. Tente de novo.';
  };
  const guarda = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  let definindoSenha = /type=(invite|recovery)/.test(location.hash);
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const urlPainel = new URL('../', location.href).href;

  let eu = null, authUid = null, minhasClin = [], aba = 'corrida', timer = null;
  const view = id => { ['load','login','foto','app'].forEach(v => { $('#v-'+v).hidden = v !== id; }); $('#tabs').hidden = id !== 'app'; };

  /* ---------- entrada ---------- */
  async function iniciar(){
    const { data: sess } = await sb.auth.getSession();
    if (!sess.session){ view('login'); return; }
    if (definindoSenha){ location.replace(urlPainel + location.hash); return; }
    authUid = sess.session.user.id;
    const { data, error } = await sb.from('usuarios').select('*').eq('auth_id', authUid).maybeSingle();
    if (error || !data){ await sb.auth.signOut(); view('login'); $('#l-err').textContent = 'Seu login existe, mas ainda não foi cadastrado. Fale com o gestor.'; return; }
    if (!data.ativo){ await sb.auth.signOut(); view('login'); $('#l-err').textContent = 'Seu acesso está desativado. Fale com o gestor.'; return; }
    if (data.papel === 'gestor'){ location.replace(urlPainel); return; }
    eu = data;
    const v = await sb.from('vinculos_clinica').select('*').eq('usuario_id', eu.id);
    minhasClin = (v.data || []).filter(x => !x.fim).map(x => x.clinica_id);
    if (!eu.foto_url && !guarda.get('pulou-foto-'+eu.id)){ $('#o-av').innerHTML = esc(iniciais(eu.nome)); view('foto'); return; }
    abrirApp();
  }

  $('#f-login').addEventListener('submit', async e => {
    e.preventDefault();
    const email = $('#l-email').value.trim(), senha = $('#l-senha').value;
    if (!email || !senha){ $('#l-err').textContent = 'Informe o e-mail e a senha.'; return; }
    $('#l-btn').disabled = true; $('#l-err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    $('#l-btn').disabled = false;
    if (error){ $('#l-err').textContent = msgErro(error); return; }
    $('#l-senha').value = ''; iniciar();
  });
  $('#l-esqueci').addEventListener('click', async () => {
    const email = $('#l-email').value.trim();
    if (!email){ $('#l-err').textContent = 'Digite seu e-mail acima e toque em "Esqueci minha senha" de novo.'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: urlPainel });
    $('#l-err').textContent = '';
    toast(error ? msgErro(error) : 'Se o e-mail estiver cadastrado, enviamos um link para criar uma nova senha.');
  });

  /* ---------- foto ---------- */
  function reduzirFoto(file){
    return new Promise((ok, fail) => {
      const img = new Image(), u = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = 320;
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 320, 320);
        URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : fail(new Error('Não foi possível ler a foto.')), 'image/jpeg', .85);
      };
      img.onerror = () => fail(new Error('Não foi possível abrir esta imagem.'));
      img.src = u;
    });
  }
  async function enviarFoto(file){
    const blob = await reduzirFoto(file), path = authUid+'/perfil.jpg';
    const up = await sb.storage.from('fotos').upload(path, blob, { upsert: true, contentType: 'image/jpeg', cacheControl: '3600' });
    if (up.error) throw up.error;
    const url = sb.storage.from('fotos').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    const r = await sb.rpc('atualizar_meu_perfil', { p_nome: null, p_telefone: null, p_foto_url: url });
    if (r.error) throw r.error;
    eu.foto_url = url; return url;
  }
  async function escolheuFoto(inp, erroEl, depois){
    const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
    erroEl.textContent = '';
    try { await enviarFoto(f); depois(); } catch(e){ erroEl.textContent = msgErro(e); }
  }
  $('#o-cam').addEventListener('change', e => escolheuFoto(e.target, $('#o-err'), () => { toast('Foto salva.'); abrirApp(); }));
  $('#o-gal').addEventListener('change', e => escolheuFoto(e.target, $('#o-err'), () => { toast('Foto salva.'); abrirApp(); }));
  $('#o-pular').addEventListener('click', () => { guarda.set('pulou-foto-'+eu.id, '1'); abrirApp(); });

  /* ---------- casca do app ---------- */
  const ICONES = {
    corrida: '<svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5"/></svg>',
    lancar: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
    avisos: '<svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 20a2 2 0 004 0"/></svg>',
    perfil: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>'
  };
  let naoLidas = 0;
  function abrirApp(){
    $('#h-papel').textContent = eu.papel === 'gerente' ? 'Gerente' : (eu.cargo || 'Promotor');
    $('#h-nome').textContent = eu.nome.split(' ')[0];
    $('#h-av').innerHTML = avatar(eu);
    view('app'); desenharAbas(); mostrar(aba === 'lancar' && eu.papel !== 'gerente' ? 'corrida' : aba);
    contarAvisos();
    clearInterval(timer); timer = setInterval(() => { if (!document.hidden && $('#v-app').hidden === false){ if (aba === 'corrida') corridaAtualizar(); contarAvisos(); } }, 15000);
  }
  function desenharAbas(){
    const abas = [['corrida','Corrida']].concat(eu.papel === 'gerente' ? [['lancar','Lançar']] : [], [['avisos','Avisos'],['perfil','Perfil']]);
    $('#tabs').innerHTML = abas.map(a => '<button type="button" data-aba="'+a[0]+'" aria-current="'+(a[0]===aba?'page':'false')+'">'+ICONES[a[0]]+'<span>'+a[1]+'</span>'+(a[0]==='avisos'&&naoLidas?'<span class="n">'+naoLidas+'</span>':'')+'</button>').join('');
  }
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-aba]'); if (b) mostrar(b.dataset.aba); });
  function mostrar(a){
    aba = a; desenharAbas();
    ({ corrida: corridaCarregar, lancar: lancCarregar, avisos: avisosCarregar, perfil: perfilCarregar })[a]();
    window.scrollTo(0, 0);
  }
  async function contarAvisos(){
    const r = await sb.from('notificacoes').select('*').eq('usuario_id', eu.id);
    if (r.error) return;
    const n = r.data.filter(x => !x.lida_em).length;
    if (n !== naoLidas){ naoLidas = n; desenharAbas(); }
  }

  /* ---------- corrida ---------- */
  const K = { camps: [], sel: null, modo: 'promotor', tk: 0, key: '', cars: {} };
  const PALETA = ['#e10600','#ff8700','#00a6ff','#34c759','#af52de','#ffd60a','#ff375f','#5ac8fa','#a2845e','#8e8e93'];
  const statusCamp = c => { const h = hoje(); return h < c.inicio ? 'Agendada' : h > c.fim ? 'Encerrada' : 'Ativa'; };

  async function corridaCarregar(){
    $('#main').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const { data, error } = await sb.from('campanhas').select('*');
    if (error){ $('#main').innerHTML = '<div class="card"><div class="err">'+esc(msgErro(error))+'</div></div>'; return; }
    K.camps = data.slice().sort((a, b) => a.inicio < b.inicio ? 1 : -1);
    if (!K.camps.some(c => c.id === K.sel)){ const a = K.camps.find(c => statusCamp(c) === 'Ativa'); K.sel = (a || K.camps[0] || {}).id || null; }
    if (!K.sel){ $('#main').innerHTML = '<div class="card"><h2>Corrida</h2><div class="empty">Você ainda não está em nenhuma campanha.</div></div>'; return; }
    if (eu.papel === 'gerente' && !K.modoEscolhido) K.modo = 'clinica';
    K.key = ''; K.cars = {};
    $('#main').innerHTML =
      '<div class="card"><div class="top"><select id="k-camp" aria-label="Campanha" style="width:100%">'+K.camps.map(c => '<option value="'+c.id+'"'+(c.id===K.sel?' selected':'')+'>'+esc(c.nome)+' ('+statusCamp(c)+')</option>').join('')+'</select>'
      + '<div class="seg" role="group" aria-label="Tipo de corrida"><button type="button" data-modo="promotor" aria-pressed="'+(K.modo==='promotor')+'">Promotores</button><button type="button" data-modo="clinica" aria-pressed="'+(K.modo==='clinica')+'">Clínicas</button></div>'
      + '<span class="meta" id="k-hora"></span></div></div>'
      + '<div id="k-hero"></div><div class="card"><div class="pista" id="k-pista"></div></div>'
      + '<div class="card"><h2>Classificação</h2><div id="k-rank"></div></div><div class="card"><h2>Prêmios</h2><div id="k-prem"></div></div>';
    $('#k-camp').addEventListener('change', e => { K.sel = Number(e.target.value); K.key = ''; corridaAtualizar(); });
    $$('[data-modo]').forEach(b => b.addEventListener('click', () => { K.modo = b.dataset.modo; K.modoEscolhido = true; K.key = ''; $$('[data-modo]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); corridaAtualizar(); }));
    await corridaAtualizar();
  }

  async function corridaAtualizar(){
    const c = K.camps.find(x => x.id === K.sel); if (!c || !$('#k-pista')) return;
    const tk = ++K.tk, modo = K.modo, view = modo === 'promotor' ? 'ranking_promotores' : 'ranking_clinicas', idCol = modo === 'promotor' ? 'promotor_id' : 'clinica_id';
    const rs = await Promise.all([
      sb.from(view).select('*').eq('campanha_id', c.id).order('ordem'),
      sb.from('casas_premio').select('*').eq('campanha_id', c.id).eq('para', modo),
      sb.from('premios').select('*'), sb.from('participantes').select('*'), sb.from('clinicas').select('*')]);
    if (tk !== K.tk || !$('#k-pista')) return;
    const er = rs.map(r => r.error).find(Boolean);
    if (er){ $('#k-rank').innerHTML = '<div class="err">'+esc(msgErro(er))+'</div>'; return; }
    const rank = rs[0].data, casasP = rs[1].data, premios = rs[2].data, pessoas = rs[3].data, cls = rs[4].data;
    let gan = [];
    if (casasP.length){ const g = await sb.from('ganhadores').select('*').in('casa_premio_id', casasP.map(x => x.id)); if (tk !== K.tk) return; if (!g.error) gan = g.data; }

    const meuAlvo = modo === 'promotor' ? (eu.papel === 'promotor' ? eu.id : null) : (minhasClin.length ? minhasClin[0] : null);
    const ehMeu = id => modo === 'promotor' ? id === eu.id : minhasClin.includes(id);
    const ents = {};
    rank.forEach((r, i) => {
      const id = r[idCol];
      if (modo === 'promotor'){ const u = pessoas.find(x => x.id === id) || {}; ents[id] = { nome: u.nome || 'Participante', tag: iniciais(u.nome), sub: u.cargo || '', cor: PALETA[i % PALETA.length], foto_url: u.foto_url }; }
      else { const cl = cls.find(x => x.id === id) || {}; ents[id] = { nome: cl.nome || 'Clínica', tag: cl.sigla || '?', sub: cl.sigla || '', cor: cl.cor || PALETA[i % PALETA.length], foto_url: null }; }
    });

    // resumo pessoal
    const meu = rank.find(r => ehMeu(r[idCol]));
    if (meu){
      const N = c.casas, pos = meu.casa_na_volta % N;
      const prox = casasP.map(x => x.casa).filter(k => k > pos && k < N + 1).sort((a, b) => a - b)[0];
      const pr = prox && premios.find(p => p.id === (casasP.find(x => x.casa === prox) || {}).premio_id);
      $('#k-hero').innerHTML = '<div class="hero"><p style="margin:0">'+(modo==='promotor'?'Você':'Sua clínica')+' está em</p><b>'+meu.posicao+'º lugar</b><p>'+meu.pontos+' pontos · volta '+meu.volta+', casa '+meu.casa_na_volta
        +(prox ? ' · faltam '+(prox - pos)+' para a casa '+prox+(pr ? ' ('+esc(pr.nome)+')' : '') : '')+'</p></div>';
    } else $('#k-hero').innerHTML = '';

    const N = c.casas, cols = 6, rows = Math.ceil(N / cols);
    const key = [c.id, modo, N, casasP.map(x => x.casa+':'+x.premio_id).join(',')].join('|');
    const pos = i => { const r = Math.floor(i / cols); let col = i % cols; if (r % 2) col = cols - 1 - col; return { r, col }; };
    if (key !== K.key){
      K.key = key; K.cars = {};
      const pm = {}; casasP.forEach(x => { const pr = premios.find(p => p.id === x.premio_id); if (pr) pm[x.casa % N] = pr; });
      let cells = '';
      for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++){
        const col = r % 2 ? cols - 1 - k : k, i = r * cols + col;
        if (i >= N){ cells += '<div></div>'; continue; }
        const pr = pm[i];
        cells += '<div class="casa'+(i===0?' largada':'')+(pr?' '+pr.tipo:'')+'"><span>'+(i===0?'Largada':i)+'</span>'+(pr?'<span>★</span>':'')+'</div>';
      }
      $('#k-pista').innerHTML = '<div class="pgrid" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+cells+'</div><div class="carros" id="k-carros"></div>';
    }
    const grupos = {}; rank.forEach(r => { const i = (r.casa_na_volta || 0) % N; (grupos[i] = grupos[i] || []).push(r[idCol]); });
    const camada = $('#k-carros'), vivos = new Set();
    Object.keys(grupos).forEach(ci => grupos[ci].forEach((id, j, arr) => {
      const e = ents[id], p = pos(Number(ci)); vivos.add(id);
      let el = K.cars[id];
      if (!el){ el = document.createElement('div'); el.className = 'carro'; camada.appendChild(el); K.cars[id] = el;
        el.innerHTML = '<div class="in"><span class="tag"></span><svg viewBox="0 0 40 20" width="30" height="15" aria-hidden="true"><rect x="4" y="6" width="26" height="8" rx="4" fill="'+esc(e.cor)+'"/><rect x="28" y="8" width="10" height="4" rx="2" fill="'+esc(e.cor)+'"/><rect x="1" y="3" width="4" height="14" rx="1.5" fill="#111"/><rect x="26" y="2" width="5" height="16" rx="2" fill="#111"/><circle cx="17" cy="10" r="3" fill="#fff" opacity=".85"/></svg></div>'; }
      el.classList.toggle('eu', ehMeu(id));
      $('.tag', el).textContent = e.tag; el.title = e.nome;
      el.style.width = (100 / cols)+'%'; el.style.height = (100 / rows)+'%';
      el.style.left = (p.col * 100 / cols)+'%'; el.style.top = (p.r * 100 / rows)+'%';
      el.style.setProperty('--dx', ((j - (arr.length - 1) / 2) * 12)+'px');
    }));
    Object.keys(K.cars).forEach(id => { if (!vivos.has(Number(id))){ K.cars[id].remove(); delete K.cars[id]; } });

    $('#k-rank').innerHTML = rank.map(r => { const e = ents[r[idCol]];
      return '<div class="rk'+(ehMeu(r[idCol])?' eu':'')+'"><span class="pos">'+r.posicao+'º</span>'+(modo==='promotor'?avatar({nome:e.nome,foto_url:e.foto_url}):'<span class="av" style="background:'+esc(e.cor)+';color:#fff">'+esc(e.tag)+'</span>')+'<div style="min-width:0"><b>'+esc(e.nome)+'</b><p class="meta">'+esc(e.sub)+' · volta '+r.volta+', casa '+r.casa_na_volta+'</p></div><span class="pts">'+r.pontos+'</span></div>'; }).join('')
      || '<div class="empty">Ninguém participa desta corrida ainda.</div>';

    $('#k-prem').innerHTML = casasP.slice().sort((a, b) => a.casa - b.casa).map(x => {
      const pr = premios.find(p => p.id === x.premio_id) || { nome: '?', tipo: 'prata' };
      const meus = gan.filter(g => g.casa_premio_id === x.id && ehMeu(g.alvo_id));
      return '<div class="item"><div class="line"><span class="badge '+esc(pr.tipo)+'">'+esc(pr.tipo)+'</span><b>Casa '+x.casa+'</b><span>'+esc(pr.nome)+'</span></div>'
        + (meus.length ? '<div class="line">'+meus.map(g => '<span class="chip ok">'+(modo==='promotor'?'Você ganhou':'Sua clínica ganhou')+(g.volta>1?' (volta '+g.volta+')':'')+'</span>'+(g.entregue_em?'<span class="chip">Entregue</span>':'')).join('')+'</div>' : '')+'</div>'; }).join('')
      || '<div class="empty">Esta campanha não tem casas premiadas para '+(modo==='promotor'?'promotores':'clínicas')+'.</div>';
    $('#k-hora').textContent = 'Atualizado às '+new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  /* ---------- lançar (gerente) ---------- */
  const L = { tipos: [], clin: [], pess: [], camps: [], rows: [], lcs: [], acao: null, hist: [] };
  async function lancCarregar(){
    $('#main').innerHTML = '<div class="card"><p class="sub">Carregando...</p></div>';
    const rs = await Promise.all([sb.from('tipos_lancamento').select('*').order('nome'), sb.from('clinicas').select('*').order('nome'), sb.from('participantes').select('*').order('nome'), sb.from('campanhas').select('*')]);
    const er = rs.map(r => r.error).find(Boolean);
    if (er){ $('#main').innerHTML = '<div class="card"><div class="err">'+esc(msgErro(er))+'</div></div>'; return; }
    L.tipos = rs[0].data.filter(t => t.ativo); L.clin = rs[1].data.filter(c => minhasClin.includes(c.id));
    L.pess = rs[2].data.filter(p => p.papel === 'promotor'); L.camps = rs[3].data; L.acao = null;
    if (!L.clin.length){ $('#main').innerHTML = '<div class="card"><h2>Lançar</h2><div class="empty">Você ainda não está vinculado a uma clínica. Fale com o gestor.</div></div>'; return; }
    $('#main').innerHTML =
      '<div class="card"><h2>Novo lançamento</h2><p class="sub">Conta em todas as campanhas em que o promotor e a clínica participam.</p><form class="form" id="f-lanc" novalidate>'
      + (L.clin.length > 1 ? '<label class="field" for="n-clin">Clínica<select id="n-clin">'+L.clin.map(c => '<option value="'+c.id+'">'+esc(c.sigla)+' · '+esc(c.nome)+'</option>').join('')+'</select></label>' : '<input type="hidden" id="n-clin" value="'+L.clin[0].id+'">')
      + '<label class="field" for="n-prom">Promotor<select id="n-prom"><option value="">Escolha...</option>'+L.pess.map(p => '<option value="'+p.id+'">'+esc(p.nome)+(p.cargo?' · '+esc(p.cargo):'')+'</option>').join('')+'</select></label>'
      + '<label class="field" for="n-tipo">O que foi feito<select id="n-tipo"><option value="">Escolha...</option>'+L.tipos.map(t => '<option value="'+t.id+'" data-v="'+(t.usa_valor?1:0)+'">'+esc(t.nome)+'</option>').join('')+'</select></label>'
      + '<div class="g2"><label class="field" for="n-qtd">Quantidade<input id="n-qtd" type="number" inputmode="decimal" min="0.01" step="any" value="1"></label>'
      + '<label class="field" for="n-data">Data<input id="n-data" type="date" value="'+hoje()+'" max="'+hoje()+'"></label></div>'
      + '<label class="field" for="n-valor" id="w-valor" hidden>Valor da venda (R$)<input id="n-valor" type="number" inputmode="decimal" min="0.01" step="0.01"></label>'
      + '<div class="err" id="n-err" role="alert"></div><button class="btn block" type="submit" id="n-btn">Lançar</button></form></div>'
      + '<div class="card"><h2>Lançamentos da clínica</h2><p class="sub">Últimos 30 dias. Correções só até 7 dias depois da data do lançamento.</p><div id="l-lista"><p class="sub">Carregando...</p></div></div>';
    $('#n-tipo').addEventListener('change', e => { const o = e.target.selectedOptions[0]; $('#w-valor').hidden = !(o && o.dataset.v === '1'); });
    $('#f-lanc').addEventListener('submit', lancarSalvar);
    $('#l-lista').addEventListener('click', lancClique);
    lancLista();
  }

  async function lancarSalvar(e){
    e.preventDefault();
    const clinica = Number($('#n-clin').value), prom = Number($('#n-prom').value), tipo = Number($('#n-tipo').value), qtd = num($('#n-qtd').value);
    const t = L.tipos.find(x => x.id === tipo), valor = $('#n-valor').value === '' ? null : num($('#n-valor').value);
    const erro = !prom ? 'Escolha o promotor.' : !tipo ? 'Escolha o que foi feito.' : !(qtd > 0) ? 'A quantidade precisa ser maior que zero.'
      : (t.usa_valor && !(valor > 0)) ? 'Este tipo exige o valor da venda.' : !$('#n-data').value ? 'Informe a data.' : '';
    if (erro){ $('#n-err').textContent = erro; return; }
    const btn = $('#n-btn'); btn.disabled = true; $('#n-err').textContent = '';
    const { error } = await sb.rpc('lancar', { p_promotor: prom, p_clinica: clinica, p_tipo: tipo, p_quantidade: qtd, p_valor: t.usa_valor ? valor : null, p_data: $('#n-data').value });
    btn.disabled = false;
    if (error){ $('#n-err').textContent = msgErro(error); return; }
    toast('Lançamento registrado.'); $('#n-qtd').value = '1'; $('#n-valor').value = ''; lancLista();
  }

  async function lancLista(){
    const alvo = $('#l-lista'); if (!alvo) return;
    const desde = new Date(Date.now() - 30 * 864e5).toLocaleDateString('sv-SE');
    const { data, error } = await sb.from('lancamentos').select('*').gte('data_ref', desde).order('criado_em', { ascending: false }).limit(100);
    if (error){ alvo.innerHTML = '<div class="err">'+esc(msgErro(error))+'</div>'; return; }
    L.rows = data; L.lcs = [];
    if (data.length){ const r = await sb.from('lancamento_campanhas').select('*').in('lancamento_id', data.map(x => x.id)); if (!r.error) L.lcs = r.data; }
    lancRender();
  }

  function lancRender(){
    const alvo = $('#l-lista'); if (!alvo) return;
    alvo.innerHTML = '<ul class="items">'+(L.rows.map(r => {
      const u = L.pess.find(x => x.id === r.promotor_id) || { nome: 'Promotor' }, t = L.tipos.find(x => x.id === r.tipo_id) || { nome: 'Tipo #'+r.tipo_id };
      const lcs = L.lcs.filter(x => x.lancamento_id === r.id), validos = lcs.filter(x => x.status === 'valido');
      const st = !lcs.length ? '' : !validos.length ? '<span class="chip off">Cancelado</span>' : validos.length < lcs.length ? '<span class="chip off">Cancelado em parte</span>' : '';
      const aberto = L.acao && L.acao.id === r.id ? L.acao.tipo : null;
      return '<li class="item"><div><div class="line"><b>'+esc(u.nome)+'</b>'+st+'</div><p class="meta">'+esc(t.nome)+' · '+dBR(r.data_ref)+' · qtd '+Number(r.quantidade)+(r.valor != null ? ' · '+brl(r.valor) : '')+'</p>'
        + '<p class="meta">'+lcs.map(x => esc((L.camps.find(k => k.id === x.campanha_id) || {}).nome || 'Campanha')+(x.status==='valido'?'':' (cancelado)')).join(' · ')+'</p></div>'
        + '<div class="btns"><button type="button" class="btn ghost sm" data-a="hi" data-id="'+r.id+'">Histórico</button>'
        + (validos.length ? '<button type="button" class="btn ghost sm" data-a="ed" data-id="'+r.id+'">Corrigir</button><button type="button" class="btn ghost sm" data-a="ca" data-id="'+r.id+'">Cancelar</button>' : '')+'</div>'
        + (aberto ? lancPainel(r, aberto, validos, t) : '')+'</li>'; }).join('') || '<li class="empty">Nenhum lançamento neste período.</li>')+'</ul>';
  }

  function lancPainel(r, tipo, validos, t){
    const caixa = 'style="padding:12px;background:var(--surface-2);border-radius:14px"';
    if (tipo === 'ed') return '<div class="form" '+caixa+'><div class="g2"><label class="field">Quantidade<input id="a-qtd" type="number" step="any" min="0.01" value="'+Number(r.quantidade)+'"></label>'
      + (t.usa_valor ? '<label class="field">Valor (R$)<input id="a-valor" type="number" step="0.01" min="0.01" value="'+(r.valor != null ? Number(r.valor) : '')+'"></label>' : '')+'</div>'
      + '<label class="field">Motivo da correção<input id="a-motivo" type="text" autocomplete="off" placeholder="Ex.: digitei o valor errado"></label><div class="err" id="a-err" role="alert"></div>'
      + '<div class="btns"><button type="button" class="btn sm" data-a="ok-ed" data-id="'+r.id+'">Salvar correção</button><button type="button" class="btn ghost sm" data-a="fechar">Fechar</button></div></div>';
    if (tipo === 'ca') return '<div class="form" '+caixa+'><label class="field">Cancelar em<select id="a-camp"><option value="">Todas as campanhas</option>'
      + validos.map(x => '<option value="'+x.campanha_id+'">'+esc((L.camps.find(k => k.id === x.campanha_id) || {}).nome || 'Campanha')+'</option>').join('')+'</select></label>'
      + '<label class="field">Motivo do cancelamento<input id="a-motivo" type="text" autocomplete="off" placeholder="Ex.: lançado em duplicidade"></label><div class="err" id="a-err" role="alert"></div>'
      + '<div class="btns"><button type="button" class="btn sm" data-a="ok-ca" data-id="'+r.id+'">Confirmar cancelamento</button><button type="button" class="btn ghost sm" data-a="fechar">Fechar</button></div></div>';
    const nome = id => (id === eu.id ? 'você' : ((L.pess.find(x => x.id === id) || {}).nome || 'o gestor'));
    return '<div '+caixa+'>'+(L.hist.length ? L.hist.map(a => {
      const det = a.acao === 'editar' && a.antes && a.depois ? ' · qtd '+Number(a.antes.quantidade)+' → '+Number(a.depois.quantidade)+(a.antes.valor != null || a.depois.valor != null ? ' · valor '+brl(a.antes.valor)+' → '+brl(a.depois.valor) : '') : '';
      return '<p class="meta" style="margin:4px 0"><b>'+({criar:'Criado',editar:'Corrigido',cancelar:'Cancelado'}[a.acao]||esc(a.acao))+'</b> por '+esc(nome(a.usuario_id))+' em '+new Date(a.quando).toLocaleString('pt-BR')+esc(det)+(a.motivo ? ' · motivo: '+esc(a.motivo) : '')+'</p>'; }).join('') : '<p class="meta">Sem histórico.</p>')
      + '<div class="btns" style="margin-top:8px"><button type="button" class="btn ghost sm" data-a="fechar">Fechar</button></div></div>';
  }

  async function lancClique(e){
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, id = Number(b.dataset.id);
    if (a === 'fechar'){ L.acao = null; lancRender(); return; }
    if (a === 'ed' || a === 'ca'){ L.acao = { id, tipo: a }; lancRender(); return; }
    if (a === 'hi'){
      const { data, error } = await sb.from('auditoria').select('*').eq('lancamento_id', id).order('quando', { ascending: false });
      L.hist = error ? [] : data; L.acao = { id, tipo: 'hi' }; lancRender(); return;
    }
    const motivo = ($('#a-motivo') || {}).value || '';
    if (motivo.trim().length < 3){ $('#a-err').textContent = 'Informe o motivo (mínimo 3 letras).'; return; }
    b.disabled = true;
    let r;
    if (a === 'ok-ed'){
      const qtd = num($('#a-qtd').value), v = $('#a-valor') ? ($('#a-valor').value === '' ? null : num($('#a-valor').value)) : null;
      if (!(qtd > 0)){ b.disabled = false; $('#a-err').textContent = 'A quantidade precisa ser maior que zero.'; return; }
      r = await sb.rpc('editar_lancamento', { p_id: id, p_quantidade: qtd, p_valor: v, p_motivo: motivo.trim() });
    } else {
      const c = $('#a-camp').value;
      r = await sb.rpc('cancelar_lancamento', { p_id: id, p_motivo: motivo.trim(), p_campanha: c ? Number(c) : null });
    }
    b.disabled = false;
    if (r.error){ $('#a-err').textContent = msgErro(r.error); return; }
    toast(a === 'ok-ed' ? 'Lançamento corrigido.' : 'Lançamento cancelado.'); L.acao = null; lancLista();
  }

  /* ---------- perfil ---------- */
  const fmtTel = v => { const d = String(v||'').replace(/\D/g,''); return d.length === 11 ? '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7) : d.length === 10 ? '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6) : d; };
  async function perfilCarregar(){
    const cl = await sb.from('clinicas').select('*');
    const minhas = (cl.data || []).filter(c => minhasClin.includes(c.id));
    $('#main').innerHTML =
      '<div class="card" style="text-align:center"><div id="p-av">'+avatar(eu, 'xl')+'</div><h2 style="margin-top:10px">'+esc(eu.nome)+'</h2>'
      + '<p class="meta">'+esc(eu.email || '')+'</p><p class="meta">'+(eu.papel==='gerente'?'Gerente':esc(eu.cargo||'Promotor'))+(minhas.length?' · '+minhas.map(c => esc(c.sigla)).join(', '):'')+'</p>'
      + '<div class="err" id="p-ferr" role="alert"></div><div class="btns" style="justify-content:center"><label class="btn sm" style="line-height:24px">Tirar foto<input type="file" accept="image/*" capture="user" id="p-cam" hidden></label>'
      + '<label class="btn ghost sm" style="line-height:26px">Escolher da galeria<input type="file" accept="image/*" id="p-gal" hidden></label></div></div>'
      + '<div class="card"><h2>Meus dados</h2><form class="form" id="f-perfil" novalidate><label class="field" for="p-nome">Nome<input id="p-nome" type="text" autocomplete="name" value="'+esc(eu.nome)+'"></label>'
      + '<label class="field" for="p-tel">Telefone com DDD<input id="p-tel" type="tel" inputmode="numeric" autocomplete="tel" value="'+esc(fmtTel(eu.telefone))+'"></label>'
      + '<p class="meta">Clínica e cargo só o gestor altera.</p><div class="err" id="p-err" role="alert"></div><button class="btn block" type="submit">Salvar dados</button></form></div>'
      + '<div class="card"><h2>Trocar senha</h2><form class="form" id="f-senha" novalidate><label class="field" for="s-nova">Nova senha<input id="s-nova" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label>'
      + '<label class="field" for="s-rep">Repita a senha<input id="s-rep" type="password" autocomplete="new-password"></label><div class="err" id="s-err" role="alert"></div><button class="btn block" type="submit">Trocar senha</button></form></div>'
      + '<button class="btn ghost block" type="button" id="p-sair">Sair</button>';
    const depois = () => { toast('Foto atualizada.'); $('#p-av').innerHTML = avatar(eu, 'xl'); $('#h-av').innerHTML = avatar(eu); };
    $('#p-cam').addEventListener('change', e => escolheuFoto(e.target, $('#p-ferr'), depois));
    $('#p-gal').addEventListener('change', e => escolheuFoto(e.target, $('#p-ferr'), depois));
    $('#f-perfil').addEventListener('submit', async e => {
      e.preventDefault();
      const nome = $('#p-nome').value.trim(), tel = $('#p-tel').value.replace(/\D/g, '');
      if (!nome){ $('#p-err').textContent = 'Informe o nome.'; return; }
      if (tel && !/^[0-9]{10,11}$/.test(tel)){ $('#p-err').textContent = 'Telefone com DDD, 10 ou 11 números.'; return; }
      const { error } = await sb.rpc('atualizar_meu_perfil', { p_nome: nome, p_telefone: tel || null, p_foto_url: null });
      if (error){ $('#p-err').textContent = msgErro(error); return; }
      eu.nome = nome; if (tel) eu.telefone = tel; $('#p-err').textContent = ''; $('#h-nome').textContent = nome.split(' ')[0]; toast('Dados salvos.');
    });
    $('#f-senha').addEventListener('submit', async e => {
      e.preventDefault();
      const a = $('#s-nova').value, b = $('#s-rep').value;
      if (a.length < 8){ $('#s-err').textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
      if (a !== b){ $('#s-err').textContent = 'As duas senhas não são iguais.'; return; }
      const { error } = await sb.auth.updateUser({ password: a });
      if (error){ $('#s-err').textContent = msgErro(error); return; }
      $('#s-err').textContent = ''; $('#s-nova').value = ''; $('#s-rep').value = ''; toast('Senha trocada.');
    });
    $('#p-sair').addEventListener('click', async () => { clearInterval(timer); await sb.auth.signOut(); eu = null; view('login'); });
  }

  iniciar();
})();
</script>
</body>
</html>
