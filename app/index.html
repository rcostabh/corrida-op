<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrida de Prêmios OP</title>
<meta name="theme-color" content="#14141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corrida OP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f5; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea;
  --accent:#d95300; --accent-2:#ff8a1f; --accent-soft:#fff1e5; --on-accent:#ffffff;
  --red:#d70015; --ok:#248a3d; --warn:#b25000;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c;
    --accent:#ff9f0a; --accent-2:#ff6a00; --accent-soft:#3a2308; --on-accent:#1a0e00;
    --red:#ff6961; --ok:#30d158; --warn:#ffb340; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
h1{font:700 26px/1.1 var(--font);letter-spacing:-.03em;margin:0}
h2{font:650 18px/1.2 var(--font);letter-spacing:-.02em;margin:0 0 4px}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.meta{color:var(--muted);font-size:13px;margin:0}
.card{background:var(--surface);border-radius:22px;padding:18px;min-width:0;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.form{display:grid;gap:12px}
.field{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--muted);min-width:0}
input,select{font:inherit;font-weight:500;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:10px 14px;min-height:48px;width:100%}
input:focus,select:focus{outline:none;background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.g2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.err{color:var(--red);font-weight:500;font-size:13px;min-height:1em}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 16px var(--font);border:0;border-radius:999px;padding:10px 22px;min-height:48px;cursor:pointer;color:var(--on-accent);
  background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;font-size:14px}
.btn.sm{font-size:13px;min-height:38px;padding:6px 16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.6}
.link{background:none;border:0;color:var(--accent);font:600 14px var(--font);cursor:pointer;padding:8px 0;text-align:center}
.items{list-style:none;margin:0;padding:0}
.item{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:8px}
.item:first-child{border-top:0}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-top h2{margin:0;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .sm{text-align:center;font:600 11px var(--font);color:var(--muted);padding:4px 0;text-transform:uppercase;letter-spacing:.04em}
.dia{border:0;background:transparent;color:var(--ink);border-radius:12px;min-height:46px;display:grid;justify-items:center;align-content:center;gap:2px;font:600 15px var(--font);cursor:pointer;padding:4px 0}
.dia b{font-weight:600}
.dia i{width:6px;height:6px;border-radius:50%;display:block}
.dia i.pt{background:var(--accent)}
.dia i.pt.ok{background:#1f9d4c}
.okc{color:#14753a;font-weight:700}
.okc.fe{color:#0b6a2e}.nfc{color:#b3200f;font-weight:700}.atc{color:#075e6b;font-weight:700}
.rs{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}.rs .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rs .nfb{display:grid;gap:10px}.rs [hidden]{display:none}
.btn.verde.fe{background:linear-gradient(180deg,#14a04d,#0b7f3a)}.btn.verm{background:linear-gradient(180deg,#e0473c,#c4271c);color:#fff}
.btn.verde{background:linear-gradient(180deg,#2bb35e,#1f9d4c);color:#fff}
.dia.hj{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dia.sel{background:var(--accent);color:var(--on-accent)}
.dia.sel i.pt{background:var(--on-accent)}
.ag-i{width:100%;border:0;background:transparent;color:var(--ink);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;font:500 15px var(--font);cursor:pointer}
li:first-child>.ag-i{border-top:0}
.ag-n{display:grid;min-width:0}.ag-n small{color:var(--muted);font-size:12.5px}.ag-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(10,10,20,.6);display:flex;align-items:flex-end;justify-content:center}
.sh-c{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sh-c .cv{width:100%;height:auto;border-radius:14px;display:block}
.gc{padding:12px}
.gc .field{font-size:11px;gap:3px}
.gc .field input,.gc .field select{min-height:38px;font-size:13px}
.gc .g2{gap:8px}
.tiles.gt{gap:8px}
.gt .tl{padding:10px 12px;border-radius:14px}
.gt .tl-r{font-size:10.5px}.gt .tl-v{font-size:22px}.gt .tl-n{font-size:11px}
.gg-w{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:62vh;-webkit-overflow-scrolling:touch}
.gg{display:grid;min-width:max-content;width:100%}
.gg-h{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:2px solid var(--c,var(--line));padding:8px 8px;font:700 13px var(--font)}
.gg-t{position:sticky;left:0;z-index:1;background:var(--surface);border-top:1px solid var(--line);padding:8px 4px;font:600 11px var(--font);color:var(--muted)}
.gg-x{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:3px;display:grid;gap:3px;align-content:start;min-height:40px}
.gg-c{border:0;text-align:left;border-radius:8px;padding:5px 7px;display:grid;gap:0;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-left:3px solid var(--c);color:var(--ink);font:500 12px var(--font);cursor:pointer}
.gg-c.ok{background:color-mix(in srgb,#1f9d4c 16%,var(--surface));border-left-color:#1f9d4c}
.gg-c.at{background:color-mix(in srgb,#0a7c8c 22%,var(--surface));border-left-color:#0a7c8c}
.gg-c.fe{background:color-mix(in srgb,#0f8a3c 34%,var(--surface));border-left-color:#0f8a3c}.gg-c.nf{background:color-mix(in srgb,#d4271c 15%,var(--surface));border-left-color:#d4271c}
.gg-c b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gg-c small{color:var(--muted);font-size:10.5px}
.ag-lg{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
.ag-lg span{color:var(--muted);font-weight:600;margin-right:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{background:var(--surface-2);border-radius:18px;padding:14px;display:grid;gap:2px;min-width:0;align-content:start}
.tl-r{font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tl-v{font:800 28px/1.1 var(--font);color:var(--ink)}
.tl-n{font-size:12px;color:var(--muted)}
.fns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fn{border:0;background:var(--surface-2);color:var(--ink);border-radius:18px;padding:16px 10px;min-height:92px;display:grid;justify-items:center;align-content:center;gap:8px;font:600 14px var(--font);cursor:pointer;text-align:center}
.fn:active{transform:scale(.97)}
.fn svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:18px;background:var(--surface-2);border-radius:14px;color:var(--muted);text-align:center;list-style:none}
.sigla{font:700 12px var(--font);background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:8px;letter-spacing:.04em}
.badge{font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.ouro{background:linear-gradient(180deg,#ffd35c,#ffb400);color:#3a2a00}
.badge.prata{background:linear-gradient(180deg,#e4e6ea,#c3c7ce);color:#1f2933}
.chip{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip.off{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.login{max-width:420px;margin:7vh auto 0;display:grid;gap:20px}
.login .card{display:grid;gap:14px;padding:24px}
.boas{text-align:center}
.palco{position:relative;display:grid;place-items:center;margin:0 auto 8px;width:min(70vw,260px)}
.palco::before{content:"";position:absolute;inset:6% 2% 2%;border-radius:50%;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent-2) 36%,transparent),transparent 68%)}
.mascote{position:relative;width:100%;height:auto;max-height:min(38vh,330px);object-fit:contain;filter:drop-shadow(0 14px 16px rgba(217,83,0,.28))}
.login{margin-top:max(2vh,8px)}
/* avatar */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 15px var(--font);flex:none;overflow:hidden}
.av.xl{width:120px;height:120px;font-size:38px;margin:0 auto}
/* barra de abas */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);z-index:10}
.tabs button{flex:1;max-width:140px;border:0;background:transparent;color:var(--muted);font:600 11px var(--font);padding:6px 4px;border-radius:12px;display:grid;justify-items:center;gap:2px;min-height:52px;cursor:pointer;position:relative}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs .n{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font:700 10px var(--font);min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* corrida */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--font);padding:7px 14px;border-radius:999px;min-height:34px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
/* mapa de jogo */
.sndbtn{border:0;background:var(--surface-2);color:var(--ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.sndbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sndbtn[aria-pressed="false"]{color:var(--muted)}
.mapa{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#7fd0ff 0%,#b9ecff 22%,#c9f2b8 55%,#8fdc74 100%);box-shadow:var(--shadow);touch-action:pan-y}
.mapa .nuvem{position:absolute;width:90px;height:30px;border-radius:30px;background:#fff;opacity:.85;filter:blur(.4px)}
.mapa .nuvem::before,.mapa .nuvem::after{content:"";position:absolute;background:#fff;border-radius:50%}
.mapa .nuvem::before{width:38px;height:38px;left:14px;top:-18px}.mapa .nuvem::after{width:30px;height:30px;left:46px;top:-12px}
.mapa svg.estrada{position:absolute;left:0;top:0;pointer-events:none}
.t{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 17px var(--font);text-shadow:0 1px 2px rgba(0,0,0,.35);
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.85) 0 11%,rgba(255,255,255,0) 12%),radial-gradient(circle at 50% 38%,var(--c),color-mix(in srgb,var(--c) 68%,#000));
  box-shadow:0 5px 0 rgba(0,0,0,.22),inset 0 -5px 8px rgba(0,0,0,.18),inset 0 3px 4px rgba(255,255,255,.35)}
.t.ini{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.85) 0 11%,rgba(255,255,255,0) 12%),radial-gradient(circle at 50% 38%,#4bdc7a,#1f9d4c);font-size:13px}
.t.fim{width:58px;height:58px;margin:-29px 0 0 -29px;background:repeating-conic-gradient(#fff 0 25%,#1b1b1f 0 50%) 0 0/16px 16px;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.t.bau{width:60px;height:60px;margin:-30px 0 0 -30px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 4px rgba(255,255,255,.75);transition:transform .25s}
.t.bau.ouro{--c:#ffc400}.t.bau.prata{--c:#b8c2cc}
.t.bau svg{width:36px;height:36px;margin-top:-2px}
.t.bau .tampa{transform-box:fill-box;transform-origin:0% 100%;transition:transform .35s}
.t.bau.aberto .tampa{transform:rotate(-62deg)}
.t.bau.aberto{animation:balanca .5s}
@keyframes balanca{20%{transform:rotate(-10deg) scale(1.12)}50%{transform:rotate(8deg) scale(1.16)}80%{transform:rotate(-4deg) scale(1.08)}}
.rot{position:absolute;transform:translate(-50%,0);font:700 10px var(--font);background:#fff;color:#3a2a00;border-radius:999px;padding:1px 8px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tk{position:absolute;left:0;top:0;z-index:5;will-change:transform;pointer-events:none}
.tk .disc{position:absolute;left:-17px;top:-52px;width:34px;height:34px;border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font:800 12px var(--font);border:3px solid var(--rc,#fff);background:var(--rc,#888);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tk.eu{z-index:8}
.tk.eu .mas{position:absolute;left:-27px;top:-84px;width:54px;height:auto;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));transform-origin:50% 100%}
.tk.eu .nm{position:absolute;left:50%;top:-100px;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font:800 10px var(--font);padding:1px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tk .sombra{position:absolute;left:-18px;top:-6px;width:36px;height:12px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(1px)}
.tk.pulo .mas,.tk.pulo .disc{animation:esmaga .22s}
@keyframes esmaga{0%{transform:scale(1.18,.82)}60%{transform:scale(.94,1.08)}100%{transform:scale(1,1)}}
.po{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9;pointer-events:none;z-index:4}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.fx i{position:absolute;display:block;width:9px;height:14px;border-radius:2px}
.fx b{position:absolute;display:block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffc400 55%,#c98600);box-shadow:0 0 0 2px #c98600 inset}
.banner{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:50;min-width:200px;max-width:92vw;text-align:center;
  background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--on-accent);font:800 18px var(--font);padding:12px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.banner.show{transform:translate(-50%,0)}
.banner.neg{background:linear-gradient(180deg,#6b7280,#4b5563);color:#fff}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,10,20,.62);display:grid;place-items:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal .cx{background:var(--surface);border-radius:28px;padding:26px 22px;text-align:center;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:salta .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes salta{from{transform:scale(.6) translateY(30px);opacity:0}}
.modal .cx svg{width:110px;height:110px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
.modal .cx h2{font-size:24px;margin:8px 0 2px}
.modal .cx p{margin:0 0 14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.t.bau.aberto,.tk.pulo .mas,.tk.pulo .disc,.modal .cx{animation:none}.banner{transition:none}}
.rk{display:grid;grid-template-columns:32px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rk:first-child{border-top:0}
.rk.eu{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:12px;border-top-color:transparent}
.rk .pos{font:700 17px var(--font);text-align:center}
.rk .pts{font:700 17px var(--font);text-align:right}
.rk .av{width:40px;height:40px;font-size:13px}
.hero{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:var(--on-accent);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.hero b{font:700 28px/1.1 var(--font);display:block;letter-spacing:-.03em}
.hero p{margin:4px 0 0;opacity:.92;font-size:14px}
.nt{padding:12px 0;border-top:1px solid var(--line)}
.nt:first-child{border-top:0}
.nt.novo{background:var(--accent-soft);margin:0 -10px;padding:12px 10px;border-radius:12px;border-top-color:transparent}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:min(92vw,460px);
  background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--bg);padding:13px 16px;border-radius:16px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div id="v-load" class="login"><h1>Corrida de Prêmios OP</h1><p class="sub">Carregando...</p></div>

  <div id="v-login" class="login" hidden>
    <div class="boas"><div class="palco"><img class="mascote" src="mascote.png" alt="Mascote da Orthopride" width="459" height="671"></div><span class="eyebrow">Orthopride</span><h1>Corrida de Prêmios OP</h1></div>
    <form class="card" id="f-login" novalidate>

      let html = '<svg class="estrada" width="'+W+'" height="'+g.H+'" viewBox="0 0 '+W+' '+g.H+'" aria-hidden="true"><path d="'+pts+'" fill="none" stroke="#b88a4a" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/><path d="'+pts+'" fill="none" stroke="#f4dba6" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/><path d="'+pts+'" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      for (let i = 0; i < Math.ceil(g.H / 420); i++) html += '<span class="nuvem" style="left:'+((i * 137) % Math.max(W - 90, 10))+'px;top:'+(40 + i * 420)+'px"></span>';

        else if (i === N) html += '<div class="t fim" style="left:'+p.x+'px;top:'+p.y+'px"></div><span class="rot" style="left:'+p.x+'px;top:'+(p.y + 40)+'px">Chegada</span>';
        else html += '<div class="t" style="left:'+p.x+'px;top:'+p.y+'px;--c:'+CORES_CASA[i % CORES_CASA.length]+'">'+i+'</div>';
      }
      $('#k-pista').style.height = g.H+'px'; $('#k-pista').innerHTML = html;
      rank.forEach(r => { const id = r[idCol], t = { el: criarToken(id, ents[id], id === meuId), tile: 0, xy: null }; K.tokens[id] = t; $('#k-pista').appendChild(t.el);

    Object.keys(K.tokens).forEach(id => { if (!(id in cur.pontos)){ K.tokens[id].el.remove(); delete K.tokens[id]; } });

    if (novos.length){

      + '<label class="field" for="n-tipo">O que foi feito<select id="n-tipo"><option value="">Escolha...</option>'+L.tipos.map(t => '<option value="'+t.id+'" data-v="'+(t.usa_valor?1:0)+'">'+esc(t.nome)+'</option>').join('')+'</select></label>'

  async function lancarSalvar(e){
    e.preventDefault();
    const clinica = Number($('#n-clin').value), prom = Number($('#n-prom').value), tipo = Number($('#n-tipo').value), qtd = num($('#n-qtd').value);
    const t = L.tipos.find(x => x.id === tipo), valor = $('#n-valor').value === '' ? null : num($('#n-valor').value);
    const erro = !prom ? 'Escolha o promotor.' : !tipo ? 'Escolha o que foi feito.' : !(qtd > 0) ? 'A quantidade precisa ser maior que zero.'
      : (t.usa_valor && !(valor > 0)) ? 'Este tipo exige o valor da venda.' : !$('#n-data').value ? 'Informe a data.' : '';
    if (erro){ $('#n-err').textContent = erro; return; }
    const btn = $('#n-btn'); btn.disabled = true; $('#n-err').textContent = '';
    const { error } = await sb.rpc('lancar', { p_promotor: prom, p_clinica: clinica, p_tipo: tipo, p_quantidade: qtd, p_valor: t.usa_valor ? valor : null, p_data: $('#n-data').value });
    btn.disabled = false;
    if (error){ $('#n-err').textContent = msgErro(error); return; }
    toast('Lançamento registrado.'); $('#n-qtd').value = '1'; $('#n-valor').value = ''; lancLista();
  }

  async function lancLista(){

    if (error){ alvo.innerHTML = '<div class="err">'+esc(msgErro(error))+'</div>'; return; }

  function lancPainel(r, tipo, validos, t){

    if (tipo === 'ed') return '<div class="form" '+caixa+'><div class="g2"><label class="field">Quantidade<input id="a-qtd" type="number" step="any" min="0.01" value="'+Number(r.quantidade)+'"></label>'
      + (t.usa_valor ? '<label class="field">Valor (R$)<input id="a-valor" type="number" step="0.01" min="0.01" value="'+(r.valor != null ? Number(r.valor) : '')+'"></label>' : '')+'</div>'
      + '<label class="field">Motivo da correção<input id="a-motivo" type="text" autocomplete="off" placeholder="Ex.: digitei o valor errado"></label><div class="err" id="a-err" role="alert"></div>'

      + '<div class="btns" style="margin-top:8px"><button type="button" class="btn ghost sm" data-a="fechar">Fechar</button></div></div>';

  async function lancClique(e){

  /* ---------- avisos no celular (push) ---------- */
  const VAPID_PUBLIC = 'BLF4hqSMCG5xO08eJWwz7ljcpxLpd1Q3EODat_OGhQeJru5rRisQAxP4-ruJidZRjKZnSehTy445AfQYcxrpIWw';
  const b64Bytes = t => { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; const b = atob(t); return Uint8Array.from(b, c => c.charCodeAt(0)); };
  const ehIos = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const instalado = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
  const pushSuporte = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  async function pushSub(){ try { const reg = await navigator.serviceWorker.ready; return await reg.pushManager.getSubscription(); } catch (e) { return null; } }
  async function pushEstado(){
    if (ehIos && !instalado()) return 'instalar';
    if (!pushSuporte()) return 'nao';
    if (Notification.permission === 'denied') return 'negado';
    return (Notification.permission === 'granted' && await pushSub()) ? 'ligado' : 'desligado';
  }
  async function pushGravar(sub){
    return sb.from('dispositivos_push').upsert({ usuario_id: eu.id, token: JSON.stringify(sub.toJSON()), plataforma: 'web', ultimo_uso: new Date().toISOString() }, { onConflict: 'token' });
  }
  async function pushLigar(){
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return 'Sem a permissão do aparelho não dá para avisar. Libere as notificações deste app nas configurações.';
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub){
      try { sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64Bytes(VAPID_PUBLIC) }); }
      catch (e){ return 'Não consegui ativar os avisos neste aparelho. Tente de novo em alguns instantes.'; }
    }
    const { error } = await pushGravar(sub);
    return error ? msgErro(error) : '';
  }
  async function pushDesligar(){
    const sub = await pushSub(); if (!sub) return;
    const token = JSON.stringify(sub.toJSON());
    await sb.from('dispositivos_push').delete().eq('token', token);
    try { await sub.unsubscribe(); } catch (e) {}
  }
  // Ao abrir o app: se os avisos já estão ligados, mantém o aparelho registrado (e atualiza o "último uso").
  async function pushManter(){ try { if (await pushEstado() === 'ligado'){ const sub = await pushSub(); if (sub) await pushGravar(sub); } } catch (e) {} }
  async function pushDesenhar(){
    const alvo = $('#av-push'); if (!alvo) return;
    const st = await pushEstado(); if (!$('#av-push')) return;
    const msg = { instalar: 'No iPhone, os avisos só funcionam com o app instalado: toque em Compartilhar › Adicionar à Tela de Início e abra o Corrida OP pelo ícone.', nao: 'Este aparelho ou navegador não aceita avisos. Tente pelo Chrome (Android) ou instale o app.', negado: 'Os avisos estão bloqueados. Libere as notificações do Corrida OP nas configurações do aparelho ou do navegador e volte aqui.' };
    if (msg[st]){ alvo.innerHTML = '<h2>Avisos no celular</h2><p class="sub" style="margin:0">'+msg[st]+'</p>'; return; }
    if (st === 'ligado'){
      alvo.innerHTML = '<h2>Avisos no celular</h2><p class="sub" style="margin:0 0 10px"><span class="chip ok">Ativados neste aparelho</span> Você recebe um aviso quando muda de posição ou ganha um prêmio, mesmo com o app fechado.</p><div class="err" id="av-err" role="alert"></div>'
        + '<div class="btns"><button class="btn ghost sm" type="button" id="av-teste">Enviar aviso de teste</button><button class="btn ghost sm" type="button" id="av-off">Desativar</button></div>';
      $('#av-off').addEventListener('click', async () => { await pushDesligar(); toast('Avisos desativados neste aparelho.'); pushDesenhar(); });
      $('#av-teste').addEventListener('click', async e => {
        const b = e.currentTarget; b.disabled = true; $('#av-err').textContent = '';
        const { data, error } = await sb.functions.invoke('bright-service', { body: { acao: 'teste_push' } });
        b.disabled = false;
        if (error || (data && data.erro)){ $('#av-err').textContent = (data && data.erro) || msgErro(error); return; }
        toast(data && data.enviados ? 'Aviso de teste enviado. Ele chega em instantes.' : 'O servidor não achou este aparelho. Desative e ative de novo.');
      });
      return;
    }
    alvo.innerHTML = '<h2>Avisos no celular</h2><p class="sub" style="margin:0 0 10px">Receba um aviso quando mudar de posição ou ganhar um prêmio, mesmo com o app fechado.</p><div class="err" id="av-err" role="alert"></div><button class="btn block" type="button" id="av-on">Ativar avisos</button>';
    $('#av-on').addEventListener('click', async e => {
      const b = e.currentTarget; b.disabled = true; const er = await pushLigar(); b.disabled = false;
      if (er){ $('#av-err').textContent = er; return; }
      toast('Avisos ativados.'); pushDesenhar();
    });
  }

  /* ---------- avisos ---------- */
  async function avisosCarregar(){
    $('#main').innerHTML = '<div class="card" id="av-push"><p class="sub">Carregando...</p></div><div class="card"><h2>Avisos</h2><p class="sub">Posição na corrida e prêmios.</p><div id="av-lista"><p class="sub">Carregando...</p></div></div>';
    pushDesenhar();
    const { data, error } = await sb.from('notificacoes').select('*').eq('usuario_id', eu.id).order('criada_em', { ascending: false }).limit(60);
    if (error){ $('#av-lista').innerHTML = '<div class="err">'+esc(msgErro(error))+'</div>'; return; }
    $('#av-lista').innerHTML = data.map(n => '<div class="nt'+(n.lida_em?'':' novo')+'"><b>'+esc(n.titulo)+'</b><p style="margin:2px 0">'+esc(n.texto)+'</p><p class="meta">'+new Date(n.criada_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })+'</p></div>').join('')
      || '<div class="empty">Nenhum aviso ainda.</div>';
    if (data.some(n => !n.lida_em)){
      await sb.from('notificacoes').update({ lida_em: new Date().toISOString() }).eq('usuario_id', eu.id).is('lida_em', null);
      naoLidas = 0; desenharAbas();
    }
  }

  /* ---------- perfil ---------- */
  const fmtTel = v => { const d = String(v||'').replace(/\D/g,''); return d.length === 11 ? '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7) : d.length === 10 ? '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6) : d; };
  async function perfilCarregar(){
    const cl = await sb.from('clinicas').select('*');
    const minhas = (cl.data || []).filter(c => minhasClin.includes(c.id));
    $('#main').innerHTML =
      '<div class="card" style="text-align:center"><div id="p-av">'+avatar(eu, 'xl')+'</div><h2 style="margin-top:10px">'+esc(eu.nome)+'</h2>'
      + '<p class="meta">'+esc(eu.email || '')+'</p><p class="meta">'+(eu.papel==='gerente'?'Gerência':eu.papel==='gestor'?'Gestão':eu.papel==='assistente'?'Gestão':esc(eu.cargo||'Vendas'))+(minhas.length?' · '+minhas.map(c => esc(c.sigla)).join(', '):'')+'</p>'
      + '<div class="err" id="p-ferr" role="alert"></div><div class="btns" style="justify-content:center"><label class="btn sm" style="line-height:24px">Tirar foto<input type="file" accept="image/*" capture="user" id="p-cam" hidden></label>'
      + '<label class="btn ghost sm" style="line-height:26px">Escolher da galeria<input type="file" accept="image/*" id="p-gal" hidden></label></div></div>'
      + '<div class="card"><h2>Meus dados</h2><form class="form" id="f-perfil" novalidate><label class="field" for="p-nome">Nome<input id="p-nome" type="text" autocomplete="name" value="'+esc(eu.nome)+'"></label>'
      + '<label class="field" for="p-tel">Telefone com DDD<input id="p-tel" type="tel" inputmode="numeric" autocomplete="tel" value="'+esc(fmtTel(eu.telefone))+'"></label>'
      + '<p class="meta">Clínica e cargo só o gestor altera.</p><div class="err" id="p-err" role="alert"></div><button class="btn block" type="submit">Salvar dados</button></form></div>'
      + (ehGestao() ? '<div class="card"><h2>Painel completo</h2><p class="meta" style="margin-bottom:10px">Esta versão do celular é só para consulta.</p><a class="btn ghost block" href="'+esc(urlPainel)+'" style="display:grid;place-items:center;text-decoration:none">Abrir o painel completo</a></div>' : '')
      + '<div class="card"><h2>Trocar senha</h2><form class="form" id="f-senha" novalidate><label class="field" for="s-nova">Nova senha<input id="s-nova" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label>'
      + '<label class="field" for="s-rep">Repita a senha<input id="s-rep" type="password" autocomplete="new-password"></label><div class="err" id="s-err" role="alert"></div><button class="btn block" type="submit">Trocar senha</button></form></div>'
      + '<button class="btn ghost block" type="button" id="p-sair">Sair</button><p class="meta" style="text-align:center">Versão '+VERSAO+'</p>';
    const depois = () => { toast('Foto atualizada.'); $('#p-av').innerHTML = avatar(eu, 'xl'); $('#h-av').innerHTML = avatar(eu); };
    $('#p-cam').addEventListener('change', e => escolheuFoto(e.target, $('#p-ferr'), depois));
    $('#p-gal').addEventListener('change', e => escolheuFoto(e.target, $('#p-ferr'), depois));
    $('#f-perfil').addEventListener('submit', async e => {
      e.preventDefault();
      const nome = $('#p-nome').value.trim(), tel = $('#p-tel').value.replace(/\D/g, '');
      if (!nome){ $('#p-err').textContent = 'Informe o nome.'; return; }
      if (tel && !/^[0-9]{10,11}$/.test(tel)){ $('#p-err').textContent = 'Telefone com DDD, 10 ou 11 números.'; return; }
      const { error } = await sb.rpc('atualizar_meu_perfil', { p_nome: nome, p_telefone: tel || null, p_foto_url: null });
      if (error){ $('#p-err').textContent = msgErro(error); return; }
      eu.nome = nome; if (tel) eu.telefone = tel; $('#p-err').textContent = ''; $('#h-nome').textContent = nome.split(' ')[0]; toast('Dados salvos.');
    });
    $('#f-senha').addEventListener('submit', async e => {
      e.preventDefault();
      const a = $('#s-nova').value, b = $('#s-rep').value;
      if (a.length < 8){ $('#s-err').textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
      if (a !== b){ $('#s-err').textContent = 'As duas senhas não são iguais.'; return; }
      const { error } = await sb.auth.updateUser({ password: a });
      if (error){ $('#s-err').textContent = msgErro(error); return; }
      $('#s-err').textContent = ''; $('#s-nova').value = ''; $('#s-rep').value = ''; toast('Senha trocada.');
    });
    $('#p-sair').addEventListener('click', async () => { clearInterval(timer); await sb.auth.signOut(); eu = null; view('login'); });
  }

  iniciar();
})();
</script>
</body>
</html>
